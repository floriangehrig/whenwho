name = "whenwho"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Production address (Wrangler creates the DNS record and certificate).
routes = [{ pattern = "when-who.app", custom_domain = true }]
# workers_dev = false   # turn off the *.workers.dev address once when-who.app works

# The web app (public/index.html) is served as a static asset.
# Requests that aren't a file (e.g. /api/...) go to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "whenwho"
database_id = "f485894f-738a-4ac7-be68-bec6aeb8d13e"

# Workers AI: "fill my answer from text" (✨ in My answer). Free allowance 10,000 neurons/day; on the Free plan
# going over just fails (no bill). Remove this block to hide the feature. `npm run dev` uses the real service (needs `wrangler login`).
[ai]
binding = "AI"

# Flood guard: requests per IP per minute (Workers Rate Limiting, free, counted in memory). Changes (POST/PATCH/DELETE) and
# place lookups (one per keystroke). namespace_id is any number unique within the account.
[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_PLACES"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Runs every hour: opens new polls in a series on time and sends notification/reminder emails.
[triggers]
crons = ["17 * * * *"]

# ---- Production settings ----
# Runs on the Workers Free plan (hard daily limits, never billed). Email goes through Resend (free: 100/day, 3,000/month).
# Secrets (never in this file), already set in production:
#   RESEND_API_KEY     (Resend → API Keys, "Sending access" for mail.when-who.app only)
#   TURNSTILE_SECRET   (Cloudflare → Turnstile)
[vars]
MAIL_FROM = "noreply@mail.when-who.app"     # on the domain verified in Resend
SITE_URL = "https://when-who.app"
TURNSTILE_SITE_KEY = "0x4AAAAAAGEFcq5D-SUTLIt7"   # public site key of the Turnstile widget
# Legal pages: Impressum (?imprint, required in Germany by § 5 DDG), privacy policy (?privacy) and rules (?rules).
# All of this is shown publicly. Fill in before the site goes public (and before the Google / Microsoft app review).
OPERATOR_NAME = "[Vor- und Nachname]"     # PLACEHOLDER: who runs the site: your full name (or company name + who represents it)
OPERATOR_ADDRESS = "[Straße Hausnummer], [PLZ] Frankfurt am Main, Deutschland"   # PLACEHOLDER: postal address that can receive legal mail (no P.O. box), lines separated by ", "
# OPERATOR_PHONE = ""                       # optional second quick contact next to the email (or leave out and reply fast by email)
CONTACT_EMAIL = "when-who.app.passage385@passmail.net"   # contact for data questions and reports of illegal content (DSA contact point)
DPA_NAME = "Der Hessische Beauftragte für Datenschutz und Informationsfreiheit, Wiesbaden"   # data protection authority of your Land (Hessen)
MAIL_PER_DAY = "50"                         # invite/test-email recipients per account per day
AI_PER_DAY = "20"                           # text fills per account (or IP) per day
