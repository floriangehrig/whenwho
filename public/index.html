  if(d.isAdmin&&slotsOn) wireBars();
}

// ---- hour-range picking on the day bars (admin) ----
function pickRange(){ return P.range&&P.range.date===P.ovDay?[P.range.start,P.range.end]:null; } // [start,end) picked on the open day
function setRange(st,en){ P.range=st==null?null:{date:P.ovDay,start:st,end:en}; renderBody(); }
function wireBars(){
  const box=$('ovbars'); if(!box) return;
  const at=(x,y)=>{ const el=document.elementFromPoint(x,y), st=el&&el.closest&&el.closest('[data-bh]'); return st&&box.contains(st)?+st.dataset.bh:null; };
  let a=null, b=null, moved=false;
  const show=()=>{ const lo=Math.min(a,b), hi=Math.max(a,b);
    box.querySelectorAll('[data-bh]').forEach(el=>{ const hr=+el.dataset.bh; el.classList.toggle('in',hr>=lo&&hr<=hi); }); };
  const move=e=>{ if(a===null) return; const hr=at(e.clientX,e.clientY); if(hr!==null&&hr!==b){ b=hr; moved=true; show(); } };
  const end=()=>{ window.removeEventListener('pointermove',move); if(a===null) return;
    const lo=Math.min(a,b), hi=Math.max(a,b)+1, cur=pickRange(); a=null;
    if(!moved&&cur&&cur[0]===lo&&cur[1]===hi) setRange(null); // tap the single picked hour again to clear
    else setRange(lo,hi); };
  box.addEventListener('pointerdown',e=>{ const hr=at(e.clientX,e.clientY); if(hr===null) return; e.preventDefault();
    a=b=hr; moved=false; show();
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',end,{once:true}); window.addEventListener('pointercancel',end,{once:true}); });
}

// Weekly polls: when the meeting series runs. Shared by the schedule form and the draft tray.
function repState(){ return P.rep||(P.rep={from:isoL(new Date()), every:1, until:''}); }
function repeatFields(){
  if(!isWeekly()) return '';
  const r=repState();
  return `<div class="drep"><label class="ifld">${ICON.repeat}<select id="rp_every" data-rp="every" aria-label="${t('Repeats')}" title="${t('Repeats')}">${[[1,t('Every week')],[2,t('Every other week')],[4,t('Every 4 weeks')]].map(([v,lb])=>`<option value="${v}" ${r.every===v?'selected':''}>${lb}</option>`).join('')}</select></label>
    ${tip(t('Sent as one repeating calendar event, starting on the first matching weekday from this date.'),'right')}
    <span class="drep-d"><input type="date" id="rp_from" data-rp="from" value="${esc(r.from)}" aria-label="${t('Starting from')}" title="${t('Starting from')}"><span class="dsep">→</span>
    <input type="date" id="rp_until" data-rp="until" value="${esc(r.until)}" aria-label="${t('Until')} (${t('optional')})" title="${t('Until')} (${t('optional')})"></span></div>`;
}
document.addEventListener('input',e=>{ const k=e.target.dataset&&e.target.dataset.rp; if(!k) return; const r=repState(); r[k]=k==='every'?+e.target.value:e.target.value; });
function repeatValue(err){ // {repeat} for a weekly meeting, {} otherwise; null (and a message) when invalid
  if(!isWeekly()) return {};
  const r=repState(); if(!r.from){ err.textContent=t('Pick the date the meetings start from.'); return null; }
  if(r.until&&r.until<r.from){ err.textContent=t('The “until” date is before the start date.'); return null; }
  return {repeat:{from:r.from, every:r.every, until:r.until||null}};
}
function hourOpts(lo,hi,cur){ let o=''; for(let h=lo;h<=hi;h++) o+=`<option value="${h}" ${h===cur?'selected':''}>${hh(h)}</option>`; return o; }

// ---- planner (admin): pick people, drag slots, create several meetings at once ----
let draftSeq=0;
function addDraft(date,allDay,start,end,endDate){ P.drafts.push({key:++draftSeq,date,allDay,start,end,participants:selParticipants(),...(allDay&&endDate&&endDate>date?{endDate}:{})}); P.drafts.sort((a,b)=>a.date.localeCompare(b.date)||(a.allDay?-1:b.allDay?1:a.start-b.start)); }
function inMeeting(m,k,hr){ return onDay(m,k) && (m.allDay || (hr>=m.start && hr<m.end)); }
// Days (tap or press-and-drag across day names / calendar days): one all-day draft from the first to the last day.
// A tap on a day that already has an all-day draft removes that draft.
// One range mode (P.prange): the first tap marks the start (P.panchor), the next tap the end.
function pickDays(a,b){
  let lo=a<b?a:b, hi=a<b?b:a; const hit=P.drafts.find(x=>x.allDay&&onDay(x,lo)), anc=P.panchor; P.panchor=null;
  if(lo===hi&&P.prange&&anc){ lo=anc<lo?anc:lo; hi=anc>hi?anc:hi; }
  else if(lo===hi&&hit){ P.drafts=P.drafts.filter(x=>x!==hit); renderBody(); return; }
  else if(lo===hi&&P.prange){ P.panchor=lo; renderBody(); toast(t('Now tap the last day')); return; }
  P.drafts=P.drafts.filter(x=>!(x.allDay&&x.date<=hi&&mEnd(x)>=lo));
  addDraft(lo,true,null,null,hi); renderBody();
  if(lo!==hi) toast(t('One meeting over {n} days added',{n:spanDays(lo,hi).length}));
}
function wireDayPick(box){
  if(!box) return; let dr=null;
  const cellAt=(x,y)=>{ const el=document.elementFromPoint(x,y), c=el&&el.closest&&el.closest('[data-pday]'); return c&&box.contains(c)?c:null; };
  const paint=()=>{ const lo=dr.a<dr.b?dr.a:dr.b, hi=dr.a<dr.b?dr.b:dr.a; box.querySelectorAll('[data-pday]').forEach(c=>c.classList.toggle('dr',dr.orig.has(c)||(c.dataset.pday>=lo&&c.dataset.pday<=hi))); };
  gridGestures(box,cellAt,{
    start:el=>{ dr={a:el.dataset.pday,b:el.dataset.pday,orig:new Set(box.querySelectorAll('[data-pday].dr'))}; paint(); },
    move:el=>{ if(dr&&el.dataset.pday!==dr.b){ dr.b=el.dataset.pday; paint(); } },
    end:()=>{ if(!dr) return; const {a,b}=dr; dr=null; P.pdayT=Date.now(); pickDays(a,b); },
    cancel:()=>{ dr=null; renderBody(); } });
}
function draftInvited(dr){ const rs=P.data.responses||[]; return dr.participants==='all'?rs:rs.filter(r=>dr.participants.some(p=>p.id===r.id)); }
// Planner pages: only days where someone selected is free (5 at a time), or whole weeks.
function planPages(S){
  const d=P.data, ms=inst().meetings, PER=5;
  const avail=d.dates.filter(k=>S[k].peak>0||S[k].cm.some(x=>x>0)||P.drafts.some(x=>onDay(x,k))||ms.some(x=>onDay(x,k)));
  const pages=P.pavail?Array.from({length:Math.ceil(avail.length/PER)},(_,i)=>{ const pg=avail.slice(i*PER,i*PER+PER); while(pg.length<PER) pg.push(null); return pg; }):weeks(d.dates);
  return {avail,pages};
}
// Make sure the planner shows day k.
function planShow(k){
  showMonth(k);
  if(P.data.poll.answerMode==='days') return;
  const S={}; P.data.dates.forEach(x=>S[x]=stats(x));
  let {pages}=planPages(S), i=pages.findIndex(pg=>pg.includes(k));
  if(i<0&&P.pavail){ P.pavail=false; pages=planPages(S).pages; i=pages.findIndex(pg=>pg.includes(k)); }
  if(i>=0) P[P.pavail?'ppage':'pweek']=i;
}
function pickSeg(){
  if(isWeekly()) return '';
  const b=(on,v,ic,l,tt)=>`<button data-prange="${v}" class="${on?'on':''}" title="${tt}" aria-label="${l}" aria-pressed="${on}"><span class="segic">${ICON[ic]}</span><span class="bl">${l}</span></button>`;
  return `<div class="seg iseg pick">${b(!P.prange,'0','day',t('Separate days'),t('Each tapped day is its own all-day meeting'))}${b(P.prange,'1','span',t('One range'),t('Tap the first and the last day: one meeting over all days in between'))}</div>`;
}
function renderPlanner(S){
  const d=P.data, slotsOn=d.poll.answerMode!=='days', tot=sel().length, H=hours(), ms=inst().meetings;
  let h='';
  if(slotsOn){
    const {avail,pages}=planPages(S);
    if(!pages.length) return `<div class="empty-v"><b>${t('No free hours yet.')}</b><span class="muted small">${t('None of the selected people has marked any hours as available.')}</span></div>`;
    const pk=P.pavail?'ppage':'pweek'; P[pk]=Math.min(Math.max(0,P[pk]),pages.length-1); const wk=pages[P[pk]], real=wk.filter(Boolean);
    // One row: date pager pill + icon toggle (free days / weeks).
    h+=`<div class="row tight pnav"><div class="wknav pill"><button class="btn" data-pwk="-1" ${P[pk]===0?'disabled':''} aria-label="${t('Previous')}">‹</button><span class="lbl">${esc(dLabel(real[0]))} – ${esc(dLabel(real[real.length-1]))}${P.pavail&&pages.length>1?` <span class="muted small">${P[pk]+1}/${pages.length}</span>`:''}</span>
      <button class="btn" data-pwk="1" ${P[pk]===pages.length-1?'disabled':''} aria-label="${t('Next')}">›</button></div>
      <div class="seg iseg"><button data-pview="avail" class="${P.pavail?'on':''}" title="${t('Only days when someone is free ({n})',{n:avail.length})}" aria-label="${t('Free days ({n})',{n:avail.length})}"><span class="segic">${ICON.users}</span><span class="bl">${t('Free days')}</span></button><button data-pview="week" class="${P.pavail?'':'on'}" title="${t('Whole weeks')}" aria-label="${t('Weeks')}"><span class="segic">${ICON.cal}</span><span class="bl">${t('Weeks')}</span></button></div>${pickSeg()}</div>
      <div class="grid pgrid" id="pgrid" style="grid-template-columns:42px repeat(${wk.length},1fr)"><div></div>`;
    wk.forEach((k,i)=>{ const ad=k&&P.drafts.some(x=>x.allDay&&onDay(x,k));
      h+=`<div class="hd${ad?' dr':''}${k&&P.panchor===k?' da':''}" ${k?`data-pday="${k}" title="${isWeekly()?t('Add an all-day meeting on {day}',{day:esc(dLabel(k))}):t('Add an all-day meeting on {day}. Drag across days for a trip or offsite.',{day:esc(dLabel(k))})}"`:''}>${k?WD[wdOf(k)]:'&nbsp;'}<b>${k?dNum(k)||'&nbsp;':'&nbsp;'}</b></div>`; });
    H.forEach((hr,ri)=>{ h+=`<div class="hr">${hh(hr)}</div>`;
      wk.forEach(k=>{ const pos=(ri===0?' top':'')+(ri===H.length-1?' bot':'');
        if(!k){ h+=`<div class="slot na${pos}"></div>`; return; }
        const c=S[k].cy[ri], m=S[k].cm[ri], f=S[k].ci[ri];
        let cls='slot'+pos+(c||m||hours(k).includes(hr)?'':' off');
        if(c===tot) cls+=' allfree'; else if(c) cls+=' hm'; else if(m) cls+=' mo';
        if(c<tot&&m&&c+m>=tot) cls+=' mb';
        if(ms.some(x=>inMeeting(x,k,hr))) cls+=' mt';
        if(P.drafts.some(x=>!x.allDay&&inMeeting(x,k,hr))) cls+=' dr';
        h+=`<div class="${cls}" style="--a:${Math.round(12+(c||m)/tot*55)}%" data-k="${k}" data-h="${hr}" title="${esc(dLabel(k))} ${hh(hr)} · ${esc(freeTip(c,f,m,tot))}">${c||(m?m+'?':'')}</div>`; }); });
    h+='</div>'+legend('heat','allfree','monly','mstripe','draft','meeting');
  } else {
    const ps=pickSeg(); if(ps) h+=`<div class="row tight pnav">${ps}</div>`;
    h+=`<div id="pcal">`+calendar(d.dates,(k,day)=>heatCell(k,day,S[k],tot,`data-pday="${k}"`,(P.drafts.some(x=>onDay(x,k))?' dr':'')+(P.panchor===k?' da':'')))+'</div>';
    h+=legend('heat','ifn','maybe','line','draft','meeting');
  }
  return h;
}
// The organiser's Meetings tab, lower card: 1 who, 2 when (grid), 3 details of the drafts + create.
function step(n,title,help,body,extra=''){
  return `<section class="pstep"><div class="pstep-h"><span class="pstep-n" aria-hidden="true">${n}</span><div class="grow minw row tight"><h3>${title}</h3>${help?tip(help):''}</div>${extra}</div>${body}</section>`;
}
function renderPlan(el){
  const d=P.data, rs=d.responses||[], slotsOn=d.poll.answerMode!=='days', tot=sel().length, nd=P.drafts.length;
  let h='';
  if(!rs.length){ el.innerHTML=h+`<div class="empty-v"><b>${t('No answers yet.')}</b><span class="muted small">${t("Once people answer, you can plan meetings around when they're free.")}</span><button class="btn sm mt-2" data-atab="people">${t('Share the poll')}</button></div>`; return; }
  const S={}; d.dates.forEach(k=>S[k]=stats(k));
  h+=step(1,t('Who should come?'),t('Each meeting invites the people selected when you add it.'),
    tools(whoDropdown(),'mt-2 tbar ptbar'));
  h+=step(2,t('Pick the times'),tot?(slotsOn?(TOUCH?t('<b>Press and hold, then drag down a day</b> to add a meeting (a tap adds one hour).'):t('<b>Drag down a day</b> to add a meeting.'))+' '+t('Tap a day name for an all-day one (hold and drag across day names for several days), tap a draft to remove it. Darker = more of them are free.')
      :(TOUCH?t('<b>Tap a day</b> to add or remove an all-day meeting, or <b>press and hold, then drag</b> across days for one meeting over several days (a trip, an offsite). Darker = more of them are free.'):t('<b>Tap a day</b> to add or remove an all-day meeting, or <b>drag across days</b> for one meeting over several days (a trip, an offsite). Darker = more of them are free.'))):'',
    tot?sugAi()+sugPanel()+renderPlanner(S):`<div class="empty-v"><b>${t('Nobody selected.')}</b><span class="muted small">${t('Pick at least one person in step 1.')}</span></div>`,
    tot?sugAiBtn()+sugButton():'');
  h+=step(3,`${t('Details')}${nd?` <span class="count">${nd}</span>`:''}`,nd?'':t('Meetings you add in step 2 show up here. Set the details, then create them in one go.'),
    draftTray(),nd?ib('trash',t('Clear all'),'data-cleardrafts','sm ghost danger'):'');
  el.innerHTML=h; wireWho(); wirePlanner();
}
function draftTray(){
  const pt=P.data.poll.title, dm=P.dmeta||(P.dmeta={title:pt,location:'',note:''}), n=P.drafts.length;
  if(!n) return `<div id="drafts"></div>`;
  // One compact row per draft: date tile | time (or All day) over availability + who | icon toggles.
  const rows=P.drafts.map(x=>{ const inv=draftInvited(x), days=spanDays(x.date,mEnd(x)).filter(k=>P.data.dates.includes(k)), free=inv.filter(r=>days.every(k=>windowStatus((r.entries||{})[k],x.start,x.end,x.allDay,k)!=='x')).length;
    const who=x.participants==='all'?t('Everyone'):x.participants.map(p=>p.name).join(', ');
    const time=x.allDay?`<span class="dtime all">${ICON.day}${allDayText(x)}</span>`
      :`<span class="dtime">${ICON.clock}<select class="dsel" data-dstart="${x.key}" aria-label="${t('From')}">${hourOpts(0,23,x.start)}</select><span class="dsep">–</span><select class="dsel" data-dend="${x.key}" aria-label="${t('To')}">${hourOpts(1,24,x.end)}</select></span>`;
    return `<div class="dft${x.ownDesc?' open':''}">${dateTile({date:x.date,endDate:x.endDate})}
      <div class="dmain">${time}

async function chatFetch(full){

  let again=false;
  try{
    if(!c.msgs) full=true;
    const after=full?null:c.since;
    const r=await api('GET',`/polls/${P.id}/chat${after?'?after='+encodeURIComponent(after):''}`,null,headers());
    if(c!==P.chat) return;
    c.since=r.now; c.owner=r.owner; c.canDel=!!r.canDeleteAll; c.me=r.me||c.me||null;
    if(full){
      const unread=(P.data.chat&&P.data.chat.unread)||0;
      c.msgs=r.messages.concat((c.msgs||[]).filter(m=>m.tmp)); c.people=r.people||{}; c.members=r.members||[];
      // "New" divider above the first unread message from someone else.
      c.newId=null; if(unread){ let k=0; for(let i=r.messages.length-1;i>=0;i--){ if(!r.messages[i].mine&&++k===unread){ c.newId=r.messages[i].id; break; } } }
    } else {
      const byId=new Map(c.msgs.map((m,i)=>[m.id,i])), add=[];
      let changed=false;
      for(const m of r.messages){ if(byId.has(m.id)){ const o=c.msgs[byId.get(m.id)]; if(JSON.stringify(o.rx)!==JSON.stringify(m.rx)){ c.msgs[byId.get(m.id)]=m; changed=true; } } else add.push(m); }
      if(!add.length&&!changed){ c.delay=Math.min(CHAT_MAX,Math.round(c.delay*1.5)); return; }
      c.delay=CHAT_MIN;
      if(add.some(m=>!c.people[m.uid]||(m.rq&&!c.people[m.rq.uid]))){ again=true; return; } // someone new wrote: reload once to get their name and picture
      c.msgs.push(...add); if(c.msgs.length>CHAT_KEEP) c.msgs.splice(0,c.msgs.length-CHAT_KEEP);
      const others=add.filter(m=>!m.mine);

      if(others.length){ const l=others[others.length-1], p=c.people[l.uid]||{}; P.data.chat.last={name:p.name||'?',body:plainText(l.body).slice(0,120),at:l.at,mine:false}; c.unseen+=others.length; }

}
// ---- date chips: dates of this poll written in a message ('Fri 14', '14.11.', 'Nov 14', 'Friday') ----
let DCHIP=null;
function dchipRe(){

  const W={}, Wl={}, M={}, add=(o,s,i)=>{ s=s.toLowerCase().replace(/\.$/,''); if(s.length>=2) o[s]=i; };
  for(const loc of [...new Set([LOC,'en'])]){

    for(let i=0;i<12;i++){ const dt=new Date(Date.UTC(2024,i,15)); ['long','short'].forEach(w=>add(M,dt.toLocaleDateString(loc,{month:w,timeZone:'UTC'}),i)); }

function findDay(o){

  let c=[];

  else if(o[6]) c=pick(+o[7],null,lw(o[6]));

  m.rx=rx; c.menu=null; chatDraw(true); chatFast();
  try{ const r=await api('POST',`/polls/${P.id}/chat/${encodeURIComponent(mid)}/react`,{emoji:e},headers()); m.rx=r.message.rx; }
  catch(err){ m.rx=old; toast(err.message); }
  chatDraw(true);
}
// All chat clicks (dock, drawer, peek, 💬 buttons on days and meetings, date chips, chips and menus in messages).
const CHAT_CLICK='[data-chatopen],[data-chatclose],[data-chatgo],[data-goday],[data-chatdel],[data-chatmenu],[data-chatrx],[data-chatretry],[data-chatreply],[data-chatcopy],[data-chatquote],[data-chatperson],[data-chatmeet],[data-chatatt],[data-chatac],[data-chatattm],[data-chatnoreply],[data-chatfind],[data-chatshow],[data-chatf],[data-chatexp]';
document.addEventListener('click',e=>{
  if(!P.chat||!e.target.closest) return;
  const c=P.chat, b=e.target.closest(CHAT_CLICK);
  // The click that ends a long press or swipe only lifts the finger.
  if(Date.now()-c.held<700&&e.target.closest('#chatbox')){ e.preventDefault(); e.stopPropagation(); return; }
  if(c.menu&&!e.target.closest('.msg-menu,[data-chatmenu]')){ c.menu=null; if(!b) { chatDraw(true); return; } }
  if(c.ac&&!e.target.closest('#chatac,#chatin,[data-chatatt]')){ c.ac=null; chatAcDraw(); }
  if(!b){ // in search results, a tap on a message shows it in the conversation
    const mel=e.target.closest('#chatbox .msg[data-mid]'); if(mel&&chatFiltering(c)&&!e.target.closest('a,button,select,input')) chatJump(mel.dataset.mid);
    return;
  }
  const ds=b.dataset, msg=id=>(c.msgs||[]).find(x=>x.id===id);
  if(ds.chatopen!==undefined){ if(c.open) chatSetOpen(false); else chatSetOpen(true,null); return; }
  if(ds.chatclose!==undefined){ chatSetOpen(false); return; }
  if(ds.chatgo!==undefined){ e.preventDefault(); e.stopPropagation(); chatSetOpen(true,ds.chatgo||null); chatDraw(false); return; }
  if(ds.goday){ goDay(ds.goday); return; }
  if(ds.chatdel){ c.menu=null; chatDraw(true); chatDelete(ds.chatdel); return; }
  if(ds.chatmenu){ c.menu=c.menu===ds.chatmenu?null:ds.chatmenu; if(c.menu) chatMenu(c.menu); else chatDraw(true); return; }
  if(ds.chatrx){ chatReact(ds.chatrx,ds.e); return; }
  if(ds.chatretry){ const m=msg(ds.chatretry); if(m) chatSend(m.body,m); return; }
  if(ds.chatreply){ chatReplyTo(ds.chatreply); return; }
  if(ds.chatcopy){ const m=msg(ds.chatcopy); c.menu=null; chatDraw(true); if(m) copy(plainText(m.body)); return; }
  if(ds.chatquote){ chatJump(ds.chatquote); return; }
  if(ds.chatperson){ if(!chatCan()) return; c.find=true; c.f='u:'+ds.chatperson; chatDraw(false); return; }
  if(ds.chatmeet){ goMeeting(ds.chatmeet); return; }
  if(ds.chatatt!==undefined){ c.ac=c.ac&&c.ac.mode==='att'?null:{mode:'att',q:'',sel:0}; c.menu=null; chatAcDraw(); return; }
  if(ds.chatac){ chatAcPick(+ds.chatac); return; }
  if(ds.chatattm){ chatInsert('m',ds.chatattm); return; }
  if(ds.chatnoreply!==undefined){ c.reply=null; chatReplyDraw(); const ta=$('chatin'); if(ta) ta.focus(); return; }
  if(ds.chatfind!==undefined){ c.find=!c.find; if(!c.find){ c.q=''; c.f=''; } chatDraw(false); const q=$('chatq'); if(q) q.focus(); return; }
  if(ds.chatshow){ c.show=ds.chatshow; store.set('chatShow',c.show); chatDraw(false); return; }
  if(ds.chatf){ c.f=c.f===ds.chatf?'':ds.chatf; chatDraw(false); return; }
  if(ds.chatexp){ c.exp.add(ds.chatexp); chatDraw(true); return; }
},true);

// vCard 2.1 / 3.0 / 4.0: FN (or N) and every EMAIL of each card. Quoted-printable names are decoded as UTF-8.
function parseVcf(text){
  const qp=v=>{ try{ const b=v.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
    return decodeURIComponent(escape(b)); }catch(e){ return v; } };
  const un=v=>v.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
  const out=[];
  String(text).split(/BEGIN:VCARD/i).slice(1).forEach(card=>{
    const lines=card.replace(/\r?\n[ \t]/g,'').split(/\r?\n/); let fn='', n='', mails=[];
    for(let li=0;li<lines.length;li++){ let ln=lines[li];
      // vCard 2.1 quoted-printable values continue on the next line after a trailing "="
      if(/QUOTED-PRINTABLE/i.test(ln.split(':')[0])) while(ln.endsWith('=')&&li+1<lines.length) ln=ln.slice(0,-1)+lines[++li];
      const m=ln.match(/^(?:[\w-]+\.)?([A-Za-z-]+)((?:;[^:]*)?):(.*)$/); if(!m) continue;
      const key=m[1].toUpperCase(), params=m[2].toUpperCase(); let v=m[3]; if(/QUOTED-PRINTABLE/.test(params)) v=qp(v);
      if(key==='FN') fn=un(v); else if(key==='N'){ const p=v.split(';').map(un); n=[p[3],p[1],p[2],p[0],p[4]].filter(Boolean).join(' '); }
      else if(key==='EMAIL') mails.push(un(v).replace(/^mailto:/i,'')); }
    const name=(fn||n).slice(0,60);
    if(mails.length) mails.forEach(e=>out.push({name,email:e})); else if(name) out.push({name,email:''});
  });
  return out;
}

    try{ await api('PATCH',`/polls/${P.id}`,{openDays:+$('s_open').value, deadlineDays:$('s_dld').value===''?null:+$('s_dld').value},headers());
      toast(t('Schedule saved')); await loadPoll(false); }catch(ex){ err.textContent=ex.message; } };
  const f=$('sf'); if(!f) return;
  const p=P.data.poll, v=id=>{ const el=$(id); return el?el.value:undefined; };
  f.onsubmit=async e=>{ e.preventDefault(); const err=$('serr'); err.textContent='';
    const b={ title:v('s_title'), description:v('s_desc'), hideResults:$('s_hide').checked, allowComments:$('s_com').checked, requireEmail:$('s_reqmail').checked, invitedOnly:$('s_invonly').checked, answerMode:v('s_ans') }; { const pv=patValue('sp'); if(pv.empty){ toast(t('Add at least one rule.')); return; } Object.assign(b,{hourStart:pv.hs, hourEnd:pv.he, dayPattern:pv.pat}); }
    const pk=pickerValue('poll'); b.icon=pk.emoji; if(pk.image!==undefined) b.image=pk.image;
    if(P.data.emailEnabled){ if($('s_notify')) b.notifyOpen=$('s_notify').checked; b.remindDays=$('s_remind').checked&&v('s_rdays')!==''?+v('s_rdays'):null; }
    const clr=$('s_pwclear'); if(clr&&clr.checked) b.password=''; else if(v('s_pw')) b.password=v('s_pw');
    // Settings → Dates edits the poll's single round; only sent when something there changed.
    const i=inst(), ib={};
    if($('s_from') && (v('s_from')!==i.startDate || v('s_to')!==i.endDate)) Object.assign(ib,{startDate:v('s_from'), endDate:v('s_to')});
    if($('s_dl') && (v('s_dl')||null)!==(i.deadline||null)) ib.deadline=v('s_dl')||null;
    if($('s_note') && v('s_note')!==i.note) ib.note=v('s_note');
    try{ if(Object.keys(ib).length) await api('PATCH',`/polls/${P.id}/instances/${i.id}`,ib,headers());
      await api('PATCH',`/polls/${P.id}`,b,headers());
      if(b.password!==undefined){ if(b.password) store.set('pw:'+P.id,b.password); else store.del('pw:'+P.id); P.password=b.password||null; }
      if(b.answerMode==='slots') P.mode='slots'; else if(b.answerMode==='days') P.mode='days';
      toast(t('Settings saved')); await loadPoll(false);
    }catch(ex){ err.textContent=ex.message; } };
  $('delPoll').onclick=async()=>{
    if(!confirm(p.kind==='series'?t('Delete this whole series (all its polls) and all answers? This can’t be undone.'):t('Delete this poll and all answers? This can’t be undone.'))) return;
    try{ await api('DELETE',`/polls/${P.id}`,null,headers()); location.href=origin; }
    catch(ex){ alert(ex.message); } };
}

// ---- events ----
document.addEventListener('click',async e=>{
  const tg=e.target.closest('[data-prange],[data-copy],[data-forget],[data-tab],[data-mode],[data-brush],[data-wk],[data-mon],[data-bulk],[data-ov],[data-delresp],[data-schedule],[data-clearrange],[data-mail],[data-copyinvite],[data-delmeet],[data-sendinvite],[data-inst],[data-istatus],[data-iedit],[data-idel],[data-nextinst],[data-whoall],[data-whonone],[data-pwk],[data-pview],[data-pday],[data-deldraft],[data-ddesc],[data-mdesc],[data-mdescsave],[data-mdesccancel],[data-suggest],[data-savedrafts],[data-cleardrafts],[data-logout],[data-recall],[data-pedit],[data-psave],[data-pcancel],[data-pdel],[data-padd],[data-pinvite],[data-premind],[data-pmailsel],[data-pmailapp],[data-pselnone],[data-atab]'); if(!tg) return;
  const ds=tg.dataset;
  if(ds.atab){ e.preventDefault(); if(ds.msubgo) setMsub(ds.msubgo,false); setPollTab(ds.atab); if(ds.msubgo&&P.atab==='meetings') renderBody(); return; }
  if(ds.copy!==undefined){ e.preventDefault(); copy(ds.copy); return; }
  if(ds.logout!==undefined){ e.preventDefault(); try{ await api('POST','/auth/logout',{everywhere:ds.logout==='all'}); }catch(ex){} location.reload(); return; }
  if(ds.recall!==undefined){ recallMine(); return; }
  if(ds.padd!==undefined){ peopleAdd(tg); return; }
  const pp=PEOPLE&&PEOPLE.parts||[];
  if(ds.pinvite){ const p=pp.find(x=>x.id===ds.pinvite); if(!p) return;
    if(CONFIG.emailEnabled) partsInvite(tg,{ids:[p.id]},p.invitedAt?t('Reminder'):t('Invite')); else peopleMailApp([p]); return; }
  if(ds.premind!==undefined){ const n=pp.filter(p=>p.canMail&&!p.answeredNow).length;
    if(confirm(t("Email {n} who haven't answered yet?",{n:plural(n,t('person'),t('people'))}))) partsInvite(tg,{remind:true},t('Reminder')); return; }
  if(ds.pmailsel!==undefined){ const ids=pp.filter(p=>PEOPLE.sel.has(p.id)&&p.canMail).map(p=>p.id); if(ids.length){ await partsInvite(tg,{ids},t('Invite')); PEOPLE.sel=new Set(); renderParts(); } return; }
  if(ds.pmailapp!==undefined){ peopleMailApp(ds.pmailapp==='waiting'?pp.filter(p=>!p.answeredNow):pp.filter(p=>PEOPLE.sel.has(p.id))); return; }
  if(ds.pselnone!==undefined){ PEOPLE.sel=new Set(); renderParts(); return; }
  if(ds.pedit){ PEOPLE.edit=ds.pedit; renderParts(); return; }
  if(ds.psave){ peopleSave(ds.psave); return; }
  if(ds.pcancel!==undefined){ PEOPLE.edit=null; renderParts(); return; }
  if(ds.pdel){ const p=pp.find(x=>x.id===ds.pdel); if(!p) return;
    if(!confirm(t('Remove “{name}” from this poll?',{name:p.name}))) return;
    const answers = p.rounds ? confirm(t("Also delete {name}'s {n}?\n\nOK = delete them\nCancel = keep them (no longer linked to the name)",{name:p.name,n:plural(p.rounds,t('answer'),t('answers'))})) : false;
    try{ await api('DELETE',`/polls/${PEOPLE.id}/participants/${p.id}${answers?'?answers=1':''}`,null,pollHeaders(PEOPLE.id)); await peopleChanged(t('Removed')); }catch(ex){ toast(ex.message); } return; }
  if(ds.forget){ store.set('myPolls',store.get('myPolls',[]).filter(x=>x.id!==ds.forget)); renderHome(); return; }
  if(ds.inst){ P.atab='answers'; store.set('atab:'+P.id,'answers'); switchInstance(ds.inst); return; }
  if(ds.iedit!==undefined){ e.preventDefault(); P.iedit=ds.iedit||null; renderSeries(); return; }
  if(ds.istatus){ try{ await api('PATCH',`/polls/${P.id}/instances/${ds.istatus}`,{status:ds.to},headers()); toast(ds.to==='closed'?t('Poll closed'):t('Poll reopened')); await loadPoll(false); }catch(ex){ toast(ex.message); } return; }
  if(ds.idel){ const x=P.data.instances.find(y=>y.id===ds.idel);
    if(!confirm(t('Delete the poll for {label} and its {n}? This can’t be undone.',{label:instLabel(x),n:plural(x.responses,t('answer'),t('answers'))}))) return;
    try{ await api('DELETE',`/polls/${P.id}/instances/${ds.idel}`,null,headers()); if(P.iid===ds.idel) P.iid=null; toast(t('Deleted')); await loadPoll(false); }catch(ex){ toast(ex.message); } return; }
  if(ds.nextinst!==undefined){ if(!P.data.next||!confirm(t('Open the poll for {range} now?',{range:rangeLabel(P.data.poll.unit,P.data.next.startDate,P.data.next.endDate)}))) return;
    try{ const r=await api('POST',`/polls/${P.id}/instances`,{},headers()); toast(t('Opened')); await switchInstance(r.id); }catch(ex){ toast(ex.message); } return; }
  if(ds.whoall!==undefined){ setWho(new Set((P.data.responses||[]).map(r=>r.id))); return; }
  if(ds.whonone!==undefined){ setWho(new Set()); return; }
  if(ds.pwk){ P[P.pavail?'ppage':'pweek']+=+ds.pwk; renderBody(); return; }
  if(ds.pview){ P.pavail=ds.pview==='avail'; P.panchor=null; renderBody(); return; }
  if(ds.prange){ P.prange=ds.prange==='1'; P.panchor=null; store.set('prange',P.prange?1:0); renderBody(); return; }
  if(ds.pday){ if(!isWeekly()&&Date.now()-(P.pdayT||0)<600) return; const ex=P.drafts.find(x=>x.date===ds.pday&&x.allDay); if(ex) P.drafts=P.drafts.filter(x=>x!==ex); else addDraft(ds.pday,true,null,null); renderBody(); return; }
  if(ds.ddesc){ const x=P.drafts.find(y=>y.key===+ds.ddesc); if(x){ x.ownDesc=!x.ownDesc; renderBody(); } return; }
  if(ds.deldraft){ P.drafts=P.drafts.filter(x=>x.key!==+ds.deldraft); renderBody(); return; }
  if(ds.cleardrafts!==undefined){ P.drafts=[]; renderBody(); return; }
  if(ds.suggest!==undefined){ suggestDrafts(); return; }
  if(ds.savedrafts!==undefined){ saveDrafts(tg); return; }
  if(ds.tab){ if(tg.disabled) return; P.tab=ds.tab; store.set('view:'+P.id,P.tab); renderBody(); return; }
  if(ds.mode){ P.mode=ds.mode; renderBody(); return; }
  if(ds.brush){ P.brush=ds.brush; renderBody(); return; }
  if(ds.wk){ P.week+=+ds.wk; renderBody(); return; }
  if(ds.mon){ P.month+=+ds.mon; renderBody(); return; }
  if(ds.schedule){ scheduleDay(ds.schedule); return; }
  if(ds.ov){ P.ovDay=P.ovDay===ds.ov?null:ds.ov; if(P.ovDay) showMonth(P.ovDay); renderBody(); return; }
  if(ds.clearrange!==undefined){ P.range=null; renderBody(); return; }
  if(ds.mdesc){ P.mdesc=ds.mdesc; renderMeetings(); const ta=$('mdesc_t'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } return; }
  if(ds.mdesccancel!==undefined){ P.mdesc=null; renderMeetings(); return; }
  if(ds.mdescsave){ const id=ds.mdescsave, v=$('mdesc_t').value.trim(), all=id==='*', xe=$('mdesc_x'), xv=xe?xe.value.trim():null;
    tg.disabled=true; P.mdesc=null;
    if(await saveMeetings(inst().meetings.map(m=>all?{...m,note:v}:m.id===id?{...m,note:v,extra:xv||undefined}:m))) toast(all?t('Description saved on all meetings'):t('Description saved'));
    else { P.mdesc=id; tg.disabled=false; } return; }
  if(ds.mail||ds.copyinvite||ds.delmeet||ds.sendinvite){
    const m=inst().meetings.find(x=>x.id===(ds.mail||ds.copyinvite||ds.delmeet||ds.sendinvite)); if(!m) return;
    if(ds.copyinvite){ shareOrCopy(m.title||P.data.poll.title,inviteText(m)); return; }
    if(ds.delmeet){ if(confirm(m.proposed?t('Remove this option?'):t('Delete this meeting?'))) saveMeetings(inst().meetings.filter(x=>x.id!==m.id)); return; }
    if(ds.sendinvite){ tg.disabled=true;
      try{ const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/meetings/${m.id}/send`,{},headers());
        toast(t('Invite sent to {n}',{n:plural(r.sent,t('person'),t('people'))})); await loadPoll(false); }
      catch(ex){ toast(ex.message); tg.disabled=false; } return; }
    const to=invited(m).filter(r=>r.email).map(r=>r.email);
    if(!to.length) toast(t('Nobody invited left an email. Opening a blank email.'));
    location.href=`mailto:?${to.length?'bcc='+encodeURIComponent(to.join(','))+'&':''}subject=${encodeURIComponent((m.title||P.data.poll.title)+' · '+(m.repeat?repeatText(m).split(' · ')[0]:dayLabel(m.date)))}&body=${encodeURIComponent(inviteText(m))}`;
    return;
  }
  if(ds.delresp){ if(!confirm(t('Delete this response?'))) return; try{ await api('DELETE',`/polls/${P.id}/responses/${ds.delresp}`,null,headers()); await loadPoll(false); }catch(err){ toast(err.message); } return; }
  if(!editable()) return;
  if(ds.bulk==='clear'&&qfActive()){ // only the hand-made marks go; the Quick fill rules fill in again
    const {en}=qfCompute({},P.qfApplied); P.qfBase={}; P.qfOver={}; P.qfLast=Object.assign({},en);
    if(!qfSame(en,P.mine.entries)){ P.mine.entries=en; changed(); } renderBody(); toast(t('Your own marks are cleared; Quick fill stays')); return; }
  if(ds.bulk){ const dates=P.data.dates, en=Object.assign({},P.mine.entries);
    if(ds.bulk==='wkend') dates.forEach(k=>{ if(wdOf(k)>=5) en[k]='y'; });
    if(ds.bulk==='clear') Object.keys(en).forEach(k=>delete en[k]);
    P.mine.entries=en; changed(); renderBody(); }
});

      <button type="button" class="pg-btn" id="pgSnd" aria-label="${t('Toggle sound')}"></button><button type="button" class="pg-btn" id="pgX" aria-label="${t('Close game')}">✕</button></div><canvas id="pgCv"></canvas>
      <a class="pg-credit" href="https://commons.wikimedia.org/wiki/File:Bird-in-flight.gif" target="_blank" rel="noopener">${t('Pigeon: Gadgetroid, CC BY-SA 3.0 (edited)')}</a></div>`;
    document.body.appendChild(ov); prevOverflow=document.body.style.overflow; document.body.style.overflow='hidden';
    cv=$('pgCv'); cx=cv.getContext('2d'); s=null; size(); reset(true); sndLabel(); reveal(true);
    $('pgX').onclick=close;
    $('pgSnd').onclick=()=>{ muted=!muted; store.set('ww_pigeon_muted',muted); sndLabel(); coo(); ov.focus(); };
    cv.addEventListener('pointerdown',onPtr); ov.addEventListener('pointerdown',e=>{ if(e.target===ov) close(); });
    window.addEventListener('keydown',onKey,true); window.addEventListener('resize',onResize); document.addEventListener('visibilitychange',onVis); document.addEventListener('themechange',onScheme);
    ov.focus(); last=0; raf=requestAnimationFrame(frame);
  }
  function close(){
    if(!ov||closing) return; closing=true;
    window.removeEventListener('keydown',onKey,true); window.removeEventListener('resize',onResize); document.removeEventListener('visibilitychange',onVis); document.removeEventListener('themechange',onScheme);
    reveal(false,()=>{ cancelAnimationFrame(raf); raf=0; ov.remove(); ov=null; s=null; closing=false; document.body.style.overflow=prevOverflow; });
    if(location.hash==='#pigeon') history.replaceState(null,'',location.pathname+location.search);
  }
  return {open,close};
})();
// Triggers. A single click on the logo mark still goes home (after a short pause to count clicks).
let logoTaps=0, logoT=0, logoNav=null;
document.addEventListener('click',e=>{
  const m=e.target.closest('.logo .mark'); if(!m||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  e.preventDefault(); const a=m.closest('a'), now=Date.now();
  logoTaps=now-logoT<600?logoTaps+1:1; logoT=now; clearTimeout(logoNav);
  if(logoTaps>=5){ logoTaps=0; const r=m.getBoundingClientRect(); Pigeon.open({x:r.left+r.width/2,y:r.top+r.height/2}); return; }
  if(logoTaps===1) logoNav=setTimeout(()=>{ location.href=a.href; },350);
});
let typed='';
document.addEventListener('keydown',e=>{
  const t=e.target; if(e.ctrlKey||e.metaKey||e.altKey||!e.key||e.key.length!==1) return;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  typed=(typed+e.key.toLowerCase()).slice(-3); if(typed==='coo'){ typed=''; Pigeon.open(); }
});
const hashPigeon=()=>{ if(location.hash==='#pigeon') Pigeon.open(); };
window.addEventListener('hashchange',hashPigeon); hashPigeon();
window.addEventListener('beforeunload',e=>{ if(P.dirty||P.saving){ e.preventDefault(); e.returnValue=''; } });

// ---- boot ----
(async()=>{
  try{ CONFIG = await api('GET','/config'); }catch(e){}
  const qs=new URLSearchParams(location.search), pid=qs.get('p');
  // Old admin links (?admin=…) no longer manage a poll; they are kept only to move the poll into an account.
  const ak=qs.get('admin');
  if(pid&&ak){ const list=store.get('myPolls',[]); if(!list.some(x=>x.id===pid)){ list.unshift({id:pid,adminKey:ak,title:t('Poll'),created:Date.now()}); store.set('myPolls',list); }
    history.replaceState(null,'',`?p=${encodeURIComponent(pid)}`); }
  try{ Object.assign(ME, await api('GET','/me')); }catch(e){}
  if(ME.user){
    if(store.get('myPolls',[]).some(p=>p.adminKey)) await claimLocalPolls();
    try{ Object.assign(ME, await api('GET','/me/polls')); }catch(e){}
  }
  if(pid){
    await openPoll(pid); await contactsReturn(qs);
    if(P.data&&!ME.user){ const list=store.get('myPolls',[]); list.forEach(x=>{ if(x.id===pid) x.title=P.data.poll.title; }); store.set('myPolls',list); }
  } else if(qs.has('account')){ renderAccount(); calReturn(qs); }
  else if(qs.has('new')) renderNew();
  else if(qs.has('privacy')) renderPrivacy();
  else renderHome();
})();
