// ================= POLL =================
const P = { id:null, data:null, password:null, iid:null, mine:null, mineFor:null, myResp:null,
  tab:'mine', range:null, mode:'days', brush:'y', week:0, ovDay:null, sched:null, dirty:false, saving:false,
  hint:store.get('showOthers',false), who:null, whoOpen:false, gview:'overview', pweek:0, pavail:true, ppage:0, drafts:[], dmeta:null, atab:'answers' };

function headers(){ const h={}; if(P.password) h['x-poll-password']=P.password;
  if(P.myResp){ if(P.myResp.editKey) h['x-edit-key']=P.myResp.editKey; else if(P.myResp.name) h['x-edit-name']=encodeURIComponent(P.myResp.name); }
  return h; }
const inst = () => P.data.instance;
const respKey = () => `resp:${P.id}:${inst().id}`;
const ansMode = () => P.data.poll.answerMode;
const instLabel = i => P.data.poll.kind==='weekly' ? 'A typical week' : P.data.poll.kind==='series' ? rangeLabel(P.data.poll.unit, i.startDate, i.endDate) : `${dayLabel(i.startDate)} – ${dayLabel(i.endDate)}`;

async function openPoll(id){ P.id=id; P.atab=store.get('atab:'+id,'answers'); P.password=store.get('pw:'+id,null); await loadPoll(true); }
async function fetchPoll(){ const q=P.iid?`?i=${encodeURIComponent(P.iid)}`:''; return api('GET',`/polls/${P.id}${q}`,null,headers()); }
async function loadPoll(first){
  try{ P.data = await fetchPoll(); }
  catch(e){
    if(e.status===401 && e.data && e.data.needPassword) return renderPassword(e.data.title, e.message);
    $app.innerHTML=`${appbar('All polls')}<section class="band"><div class="wrap"><div class="eyebrow">Poll</div><h1>Poll not available</h1><p class="lead">${esc(e.message)}</p></div></section>
      <main class="wrap"><div class="card"><p class="m0">The link may be wrong, or the poll was deleted. Ask the organiser for a new link.</p><div class="row mt-4"><a class="btn primary" href="${esc(origin)}">Go to when-who</a></div></div></main>`; return;
  }
  P.iid = inst().id;
  if(P.mineFor!==P.iid){
    P.mineFor=P.iid; P.dirty=false; P.sched=null; P.rep=null; P.range=null; P.ovDay=null; P.week=0; P.who=null; P.whoOpen=false; P.pweek=0; P.ppage=0; P.drafts=[]; P.dmeta=null;
    const me=P.data.me; // signed in: the answer belongs to the account
    P.myResp = me&&me.responseId ? {id:me.responseId, account:true} : store.get(respKey(), null);
    P.mine = { name: me ? (me.name||displayName(ME.user)) : store.get('myName',''), email: me ? me.email : store.get('myEmail',''), comment:'', entries:{} };
    if(P.myResp){
      try{ const r=await api('GET',`/polls/${P.id}/responses/${P.myResp.id}`,null,headers()); P.mine={name:r.name,email:r.email||'',comment:r.comment,entries:cleanEntries(r.entries)}; }
      catch(e){ if(e.status===404||e.status===403){ store.del(respKey()); P.myResp=null; } }
    }
  }
  if(first) P.mode = ansMode()==='slots' ? 'slots' : 'days';
  pruneWho();
  render();
}
async function switchInstance(id){ if(P.dirty && !confirm('Your changes haven’t been sent yet. Switch anyway and discard them?')) return; P.dirty=false; P.iid=id; await loadPoll(false); window.scrollTo({top:0,behavior:'smooth'}); }

function renderPassword(title,msg){
  $app.innerHTML=`${appbar('All polls')}<section class="band"><div class="wrap"><div class="eyebrow">${ICON.lock.replace('<svg','<svg width="14" height="14"')} Protected poll</div><h1>${esc(title||'Poll')}</h1></div></section>
    <main class="wrap"><div class="card"><form id="pwf"><label for="pwi">This poll is password-protected. Enter the password to open it.</label>
    <div class="row"><input type="password" id="pwi" class="grow" autofocus><button class="btn primary">Open poll</button></div>
    ${msg==='Wrong password'?'<div class="err">Wrong password.</div>':''}</form></div></main>`;
  $('pwf').onsubmit=e=>{ e.preventDefault(); P.password=$('pwi').value; store.set('pw:'+P.id,P.password); loadPoll(true); };
}

// ---- entry helpers: 'y' | 'm' | {y:[h],m:[h]}. Anything not marked counts as not available.
// Old answers may still hold 'n' / {n:[h]} (an explicit "can't"); it is treated like blank.
function hours(){ const p=P.data.poll; return Array.from({length:p.hourEnd-p.hourStart},(_,i)=>p.hourStart+i); }
function hourMap(v){
  const H=hours(), map=new Map();
  if(v==='y'||v==='m') H.forEach(h=>map.set(h,v));
  else if(Array.isArray(v)) v.forEach(h=>map.set(h,'y'));
  else if(v&&typeof v==='object') ['m','y'].forEach(s=>(v[s]||[]).forEach(h=>map.set(h,s)));
  return map;
}
function fromMap(map){
  const H=hours(), o={y:[],m:[]};
  H.forEach(h=>{ const s=map.get(h); if(s==='y'||s==='m') o[s].push(h); });
  for(const s of ['y','m']) if(o[s].length===H.length) return s;
  if(!o.y.length&&!o.m.length) return null;
  return o;
}
const isPartial = v => Array.isArray(v)||(v&&typeof v==='object');
// Drops old explicit "can't" marks from my own answer, so saving rewrites it without them.
function cleanEntries(en){ const o={}; for(const k in en||{}){ const x=fromMap(hourMap(en[k])); if(x!=null) o[k]=x; } return o; }
function counts(v){ const H=hours(), c={y:0,m:0,e:0}; const map=hourMap(v); H.forEach(h=>{ const s=map.get(h); c[s||'e']++; }); return c; }
function ratioBar(v){ const c=counts(v), t=hours().length; return `<div class="ratio" title="${c.y}h available · ${c.m}h maybe · ${c.e}h not available">${['y','m'].map(s=>c[s]?`<i class="r${s}" style="width:${c[s]/t*100}%"></i>`:'').join('')}</div>`; }
function hoursOf(v,s){ return [...hourMap(v)].filter(([h,x])=>x===s).map(([h])=>h).sort((a,b)=>a-b); }
function partialText(v){ const y=hoursOf(v,'y'), m=hoursOf(v,'m'); return [y.length?hoursText(y):'', m.length?'maybe '+hoursText(m):''].filter(Boolean).join(' · ') || "can't"; }
function statusOf(v){
  if(v==='y') return {t:'Available',c:'var(--yes-dark)',cls:'y'};
  if(v==='m') return {t:'Maybe',c:'var(--maybe-ink)',cls:'m'};
  if(isPartial(v)&&fromMap(hourMap(v))!=null) return {t:partialText(v),c:'var(--ink)',cls:'part'};
  return {t:'',c:'var(--muted)',cls:''};
}
// availability of a person for a window [start,end) on a day: 'y' all hours available, 'm' none unavailable but some maybe/blank-maybe, 'x' otherwise
function windowStatus(v,start,end,allDay){
  if(v==null) return 'x';
  if(v==='y'||v==='m') return v; if(!isPartial(v)) return 'x';
  const map=hourMap(v), H=hours(); const span=allDay?H:H.filter(h=>h>=start&&h<end);
  if(!span.length) return 'x';
  const st=span.map(h=>map.get(h));
  if(st.every(s=>s==='y')) return 'y';
  if(st.every(s=>s==='y'||s==='m')) return 'm';
  return 'x';
}

// ---- saving ----
function editable(){ return P.data && inst().status==='open'; }
function status(t){ saveBar(t); }
// The send/update bar under the calendar. Answers are only sent when the button is pressed.
function saveBar(msg){
  const bar=$('savebar'); if(!bar) return;
  bar.classList.toggle('hide', P.tab!=='mine' && !P.dirty && !P.saving);
  bar.classList.toggle('dirty', P.dirty);
  const btn=$('saveBtn');
  btn.textContent = P.saving ? 'Sending…' : P.myResp ? 'Update answer' : 'Send answer';
  btn.disabled = P.saving || !P.dirty;
  $('status').textContent = msg!=null ? msg
    : P.dirty ? (P.mine.name.trim() ? (P.myResp?'You have changes that aren’t sent yet':'Not sent yet') : 'Enter your name, then send')
    : P.myResp ? 'Saved ✓' : 'Mark your availability, then send your answer';
}
function changed(){
  if(!editable()) return;
  P.dirty=true; saveBar();
}
async function save(retried){
  if(P.saving||!P.dirty) return false;
  if(!P.mine.name.trim()){ saveBar('Enter your name first'); const nm=$('name'); if(nm) nm.focus(); return false; }
  P.saving=true; P.dirty=false; saveBar();
  const em=(P.mine.email||'').trim(), key=respKey(), had=!!P.myResp;
  const body={name:P.mine.name, email:EMAIL_RE.test(em)?em:'', comment:P.mine.comment, entries:P.mine.entries};
  let msg, retry=false, ok=false;
  try{
    if(P.myResp){ const r=await api('PUT',`/polls/${P.id}/responses/${P.myResp.id}`,body,headers());
      if(!P.myResp.account && !P.myResp.editKey && r.name){ P.myResp.name=r.name; store.set(key,P.myResp); } }
    else { const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/responses`,body,headers());
      if(ME.user) P.myResp={id:r.id,account:true}; else { P.myResp={id:r.id,editKey:r.editKey,name:r.name}; store.set(key,P.myResp); } nameHint(); }
    if(!ME.user){ store.set('myName',P.mine.name); if(body.email) store.set('myEmail',body.email); }
    ok=true; msg = em&&!body.email ? 'Saved, but that email doesn’t look right' : 'Saved ✓';
    toast(had?'Answer updated':'Answer sent'); refreshResults();
  }catch(e){
    P.dirty=true;
    if(e.status===404 && P.myResp){ store.del(key); P.myResp=null; retry=true; }
    else if(e.status===409 && e.data && e.data.code==='name_taken'){ msg='Not sent'; nameHint(true); }
    else if(e.status===409 && e.data && e.data.code==='own_answer'){ P.myResp={id:e.data.responseId,account:true}; retry=true; } // answered on another device
    else msg='Not sent: '+e.message;
  }
  P.saving=false;
  if(retry && !retried) return save(true);
  saveBar(P.dirty&&ok ? undefined : msg);
  if(ok) updateHelp();
  return ok;
}
// The help line under "Your answer" depends on whether an answer exists.
function updateHelp(){ const h=$('ansHelp'); if(h) h.innerHTML=ansHelp(); wireDel(); }
function ansHelp(){
  if(ME.user) return P.myResp?'Your answer is saved. Change it any time and press <b>Update answer</b>. <a href="#" id="delMine">Remove my answer</a>'
    :'Mark your availability below, then press <b>Send answer</b>.';
  return P.myResp?'Your answer is saved. To change it later, open the poll here or enter the same name on any device, then press <b>Update answer</b>. <a href="#" id="delMine">Remove my answer</a>'
    :'Enter your name, mark your availability below, then press <b>Send answer</b>.';
}
// "Is that you?": shown when the typed name already belongs to someone in this poll.
function nameHint(force){
  const el=$('nameHint'); if(!el) return;
  if(ME.user){ el.innerHTML=''; return; } // signed in: names don't have to be unique
  const k=nameKey(P.mine.name), p=(P.data.participants||[]).find(x=>nameKey(x.name)===k);
  if(!k || P.myResp || (!p && !force)){ el.innerHTML=''; return; }
  const shown=p?p.name:P.mine.name.trim();
  el.innerHTML=`<div class="namehint">“${esc(shown)}” is already in this poll. If that's you, load your answer.<button type="button" class="btn sm" data-recall>That's me</button><br><span class="muted">Otherwise, pick a different name.</span></div>`;
}
async function recallMine(){
  try{
    const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/recall`,{name:P.mine.name},headers());
    if(!r.responseId){ // known person, no answer yet this round: their new answer is linked to the same name
      P.mine.name=r.name; $('nameHint').innerHTML=`<div class="namehint">Welcome back, ${esc(r.name)}! Mark your availability below; it's saved under your name.</div>`;
      const nm=$('name'); if(nm) nm.value=r.name; changed(); return; }
    P.myResp={id:r.responseId,editKey:null,name:r.name};
    const a=await api('GET',`/polls/${P.id}/responses/${r.responseId}`,null,headers());
    store.set(respKey(),P.myResp); P.dirty=false;
    P.mine={name:a.name,email:a.email||'',comment:a.comment,entries:cleanEntries(a.entries)};
    render(); toast('Your answer is loaded');
  }catch(e){ P.myResp=null; toast(e.message); }
}
let refT=null;
function refreshResults(){ clearTimeout(refT); refT=setTimeout(async()=>{ try{ const d=await fetchPoll(); if(d.instance.id!==P.iid) return; P.data=d; pruneWho(); renderHeader(); renderSeries(); if(P.tab==='group'||(P.tab==='mine'&&P.hint)) renderBody(); }catch(e){} },400); }

function wireDel(){
  const dm=$('delMine');
  if(dm) dm.onclick=async e=>{ e.preventDefault(); if(!confirm('Remove your answer from this poll?')) return;
    try{ await api('DELETE',`/polls/${P.id}/responses/${P.myResp.id}`,null,headers()); }catch(err){}
    store.del(respKey()); P.myResp=null; P.mine={name:P.mine.name,email:P.mine.email,comment:'',entries:{}}; P.mineFor=null; await loadPoll(false); };
}

// ---- render ----
function render(){
  const d=P.data, p=d.poll, i=inst();
  document.title=p.title;
  if(!editable()) P.tab='group';
  $app.innerHTML=`
    ${appbar('All polls')}
    <section class="band"><div class="wrap"><div id="hdr"></div>
    ${!d.isAdmin&&d.instances.length>1?`<div class="field"><div class="seg">${d.instances.map(x=>`<button data-inst="${x.id}" class="${x.id===i.id?'on':''}">${esc(instLabel(x))}</button>`).join('')}</div></div>`:''}
    </div></section>
    <main class="wrap">
    ${d.isAdmin?adminTabs():''}

    <div id="meetings"></div>
    ${editable()&&ME.user?`<div class="card"><div class="card-h">${avatarOf(ME.user)}<h2>Your answer</h2></div>
      <div class="grid2"><div class="field">${ME.user.name?`<label>Name shown to others</label><div><b>${esc(ME.user.name)}</b> <a href="?account" class="small">Change in your profile</a></div>`
          :`<label for="name">Name shown to others</label><input type="text" id="name" maxlength="60" autocomplete="name"><div class="help mt-1"><a href="?account">Set a name in your profile</a> to use it in every poll.</div>`}
        <div class="help mt-1">Signed in as <b>${esc(ME.user.email)}</b>. Your answer is linked to your account, so it follows you to every device.</div></div></div>
      ${p.allowComments?`<div class="field"><label for="comment">Comment (optional)</label><textarea id="comment" maxlength="500" placeholder="e.g. Can only do evenings in the first week"></textarea></div>`:''}

    :editable()?`<div class="card"><div class="card-h"><h2>Your details</h2></div><div class="grid2">
        <div class="field"><label for="name">Your name <span class="tag">unique in this poll</span></label><input type="text" id="name" maxlength="60" placeholder="So everyone knows who you are" list="pnames" autocomplete="off">
          <datalist id="pnames">${(d.participants||[]).map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
          <div class="help mt-1">Use the same name every round and on any device to get back to your answer.</div><div id="nameHint"></div></div>
        <div class="field"><label for="email">Email (optional)</label><input type="email" id="email" maxlength="200" placeholder="Only the organiser sees this${d.emailEnabled?' (invites & reminders)':''}"></div></div>
      ${p.allowComments?`<div class="field"><label for="comment">Comment (optional)</label><textarea id="comment" maxlength="500" placeholder="e.g. Can only do evenings in the first week"></textarea></div>`:''}
      <p class="help" id="ansHelp">${ansHelp()}</p>
      <p class="help"><a href="#" data-opensignin>Sign in</a> to keep your answers in an account instead.</p></div>`
      :`<div class="notice warn mt-4">This poll (${esc(instLabel(i))}) is closed. Answers can't be changed any more.</div>`}
    <div class="tabs"><button data-tab="mine" class="${P.tab==='mine'?'on':''}" ${editable()?'':'disabled'}>My availability</button>
      <button data-tab="group" class="${P.tab==='group'?'on':''}">Group overview</button></div>
    <div class="card" id="body"></div>
    ${editable()?`<div class="savebar" id="savebar"><span class="small muted" id="status"></span><button type="button" class="btn primary" id="saveBtn">Send answer</button></div>`:''}</div>
    ${d.isAdmin?adminPanes():''}</main>`;
  renderHeader(); renderSeries();
  const nm=$('name'); if(nm){ nm.value=P.mine.name||''; nm.oninput=e=>{ P.mine.name=e.target.value; nameHint(); changed(); }; nameHint(); }
  const em=$('email'); if(em){ em.value=P.mine.email||''; em.oninput=e=>{ P.mine.email=e.target.value; changed(); }; }
  const cm=$('comment'); if(cm){ cm.value=P.mine.comment||''; cm.oninput=e=>{ P.mine.comment=e.target.value; changed(); }; }
  wireDel();
  const sb=$('saveBtn'); if(sb) sb.onclick=()=>save();
  [nm,em].forEach(x=>{ if(x) x.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } }); });
  if(d.isAdmin) wireAdmin();
  renderBody();
}
function renderHeader(){

function renderBody(){

// ---- series (admin) ----

      ${P.iedit===x.id?`<form class="sched full" id="ieditForm">
        <div class="grid2">${isWeekly()?'':`<div class="field"><label>From</label><input type="date" id="ie_s" value="${x.startDate}"></div><div class="field"><label>To</label><input type="date" id="ie_e" value="${x.endDate}"></div>`}

    if(!ev) continue;
    if(/^BEGIN:/i.test(line)){ depth++; continue; }   // VALARM etc.
    if(/^END:VEVENT$/i.test(line)){ evs.push(ev); ev=null; continue; }
    if(/^END:/i.test(line)){ depth--; continue; }
    if(depth) continue;
    const p=icsProp(line);
    if(p.name==='DTSTART') ev.start=icsTime(p.value,p.params);
    else if(p.name==='DTEND') ev.end=icsTime(p.value,p.params);
    else if(p.name==='DURATION') ev.dur=icsDuration(p.value);
    else if(p.name==='RRULE') ev.rrule=p.value;
    else if(p.name==='EXDATE') p.value.split(',').forEach(v=>{ const t=icsTime(v,p.params); if(t) ev.exdates.push(t); });
    else if(p.name==='RECURRENCE-ID') ev.rid=icsTime(p.value,p.params);
    else if(p.name==='UID') ev.uid=p.value;
    else if(p.name==='STATUS') ev.status=p.value.trim().toUpperCase();
    else if(p.name==='TRANSP') ev.transp=p.value.trim().toUpperCase();
  }
  const moved={}; // uid -> start times (ms) of occurrences that were changed or cancelled one by one
  evs.forEach(e=>{ if(e.rid&&e.uid&&e.start) (moved[e.uid]||(moved[e.uid]=new Set())).add(toMs(e.rid.w,e.rid.tz||e.start.tz)); });
  const busy=[], margin=2*DAY;
  for(const e of evs){
    if(!e.start||e.status==='CANCELLED'||e.transp==='TRANSPARENT') continue;
    const st=e.start, tz=st.tz;
    // Length: all-day events end on a (wall-clock) day, timed ones after a fixed number of ms.
    let days=0, ms=0;
    if(st.date){ days=e.end?Math.round((e.end.w-st.w)/DAY):e.dur!=null?Math.round(e.dur/DAY):1; if(days<=0) continue; }
    else { ms=e.end?toMs(e.end.w,e.end.tz||tz)-toMs(st.w,tz):e.dur||0; if(ms<=0) continue; }
    const span=w=>st.date?[toMs(w,''),toMs(w+days*DAY,'')]:[toMs(w,tz),toMs(w,tz)+ms];
    let starts=[st.w];
    if(e.rrule&&!e.rid){
      const fromW=fromMs-margin-Math.max(days*DAY,ms)+(st.w-toMs(st.w,tz)), toW=toMsX+margin+(st.w-toMs(st.w,tz));
      const ex=new Set(e.exdates.map(t=>toMs(t.date?st.w%DAY+t.w:t.w,t.tz||tz))), mv=moved[e.uid];
      starts=expandRule(e.rrule,st,toW,fromW).filter(w=>{ const t=toMs(w,tz); return !ex.has(t)&&!(mv&&mv.has(t)); });
    }
    for(const w of starts){ const [a,b]=span(w); if(a<toMsX&&b>fromMs) busy.push([a,b]); }
  }
  return busy;
}
// Free hours (in blank cells only) become "available"; busy hours stay blank, which means not available.
function calendarFill(busy){
  const H=hours(), days=ansMode()==='days', en=Object.assign({},P.mine.entries); let changedDays=0;
  const busyAt=(k,h)=>{ const a=parseD(k); a.setHours(h); const s=a.getTime(), e=s+3600000; return busy.some(([x,y])=>x<e&&y>s); };
  // Weekly schedule polls have no real dates: look at the next 4 weeks, busy if busy in at least 2 of them.
  const mon=(()=>{ const t=new Date(); return addDaysL(isoL(t),-((t.getDay()+6)%7)); })();
  const isBusy=(k,h)=>isWeekly()?[0,1,2,3].filter(w=>busyAt(addDaysL(mon,wdOf(k)+7*w),h)).length>=2:busyAt(k,h);
  P.data.dates.forEach(k=>{
    const m=hourMap(en[k]); if(days&&m.size) return;
    const free=H.filter(h=>!m.has(h)&&!isBusy(k,h)); if(!free.length) return;
    if(days){ en[k]=free.length===H.length?'y':'m'; changedDays++; return; }
    free.forEach(h=>m.set(h,'y')); const x=fromMap(m); if(x==null) delete en[k]; else en[k]=x; changedDays++;
  });
  P.mine.entries=en; return changedDays;
}
function calWindow(){
  if(isWeekly()){ const t=new Date(), mon=addDaysL(isoL(t),-((t.getDay()+6)%7)); return [parseD(mon).getTime(), parseD(addDaysL(mon,28)).getTime()]; }
  const ds=P.data.dates; return [parseD(ds[0]).getTime(), parseD(addDaysL(ds[ds.length-1],1)).getTime()];
}
function applyCalendar(text){
  if(!editable()) return;
  if(!/BEGIN:VCALENDAR/i.test(String(text).slice(0,2000))){ toast("That isn't a calendar (.ics) file"); return; }
  const [a,b]=calWindow(); let n;
  try{ n=calendarFill(parseIcs(text,a,b)); }catch(e){ console.error(e); toast("Couldn't read that calendar"); return; }
  P.calOpen=false; if(n) changed(); renderBody();
  toast(n?`Filled ${n} day${n===1?'':'s'} from your calendar. Check, then send.`:'Nothing to fill: no free time in blank days');
}
async function importCalendar(useSaved){
  const inp=$('cal_url'), url=useSaved?'':(inp?inp.value.trim():''), save=!useSaved&&$('cal_save')&&$('cal_save').checked;

  try{

    if(!res.ok){ let d={}; try{ d=await res.json(); }catch(e){} throw new Error(d.error||`Couldn't load the calendar (${res.status})`); }

}

function wireGrid(){

// Everyone's saved answers except my own (for the "Show others" hints in My availability).
function others(){ return (P.data.responses||[]).filter(r=>!P.myResp||r.id!==P.myResp.id); }
function stats(k, rs=sel()){
  const H=hours(), cy=H.map(()=>0), cm=H.map(()=>0); let full=0,part=0,maybe=0,no=0;
  const list=rs.map(r=>{ const v=(r.entries||{})[k];
    const x=fromMap(hourMap(v)); if(x==='y') full++; else if(x==='m') maybe++; else if(x) part++; else no++;
    hourMap(v).forEach((s,h)=>{ const i=h-H[0]; if(i<0||i>=H.length) return; if(s==='y') cy[i]++; else if(s==='m') cm[i]++; });
    return {id:r.id,name:r.name||'Someone',v}; });
  const peak=Math.max(0,...cy), bestHours=peak?H.filter((h,i)=>cy[i]===peak):[];
  const peakMaybe=peak?Math.max(0,...H.map((h,i)=>cy[i]===peak?cm[i]:0)):Math.max(0,...cm);
  return {full,part,maybe,no,cy,cm,peak,peakMaybe,bestHours,window:hoursText(bestHours),list};
}
function bestBlock(s){ // longest contiguous run of best hours
  const H=s.bestHours; if(!H.length) return [hours()[0], hours()[0]+2];
  let best=[H[0],H[0]], cur=[H[0],H[0]];
  for(let i=1;i<H.length;i++){ if(H[i]===cur[1]+1) cur[1]=H[i]; else cur=[H[i],H[i]]; if(cur[1]-cur[0]>best[1]-best[0]) best=[...cur]; }
  return [best[0], best[1]+1];
}

function wireSched(){
  const sc=P.sched, v=id=>$(id).value;
  const keep=()=>{ sc.title=v('mt_title'); sc.location=v('mt_loc'); sc.note=v('mt_note'); };
  $('mt_allday').onchange=e=>{ keep(); sc.allDay=e.target.checked; autoPick(); renderBody(); };
  $('mt_start').onchange=e=>{ keep(); sc.start=+e.target.value; if(sc.end<=sc.start) sc.end=Math.min(24,sc.start+1); autoPick(); renderBody(); };
  $('mt_end').onchange=e=>{ keep(); sc.end=+e.target.value; if(sc.end<=sc.start) sc.start=Math.max(0,sc.end-1); autoPick(); renderBody(); };
  $('mt_who').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; keep(); sc.who=b.dataset.v; renderBody(); };
  document.querySelectorAll('[data-pid]').forEach(cb=>cb.onchange=()=>{ if(cb.checked) sc.picked.add(cb.dataset.pid); else sc.picked.delete(cb.dataset.pid); });
  ['mt_title','mt_loc','mt_note'].forEach(id=>$(id).oninput=keep);
}
async function saveSched(){
  const sc=P.sched, rs=P.data.responses||[];
  const participants = sc.who==='all' ? 'all' : rs.filter(r=>sc.picked.has(r.id)).map(r=>({id:r.id,name:r.name}));
  if(participants!=='all' && !participants.length){ $('mt_err').textContent='Select at least one person, or choose Everyone.'; return; }
  const rv=repeatValue($('mt_err')); if(!rv) return;
  const m={date:sc.date, allDay:sc.allDay, title:sc.title, location:sc.location, note:sc.note, participants, ...rv};
  if(!sc.allDay){ m.start=sc.start; m.end=sc.end; }
  if(await saveMeetings([...inst().meetings, m])){ P.sched=null; P.range=null; renderBody(); toast('Meeting saved'); }
}

function hourOpts(lo,hi,cur){ let o=''; for(let h=lo;h<=hi;h++) o+=`<option value="${h}" ${h===cur?'selected':''}>${hh(h)}</option>`; return o; }

// ---- planner (admin): pick people, drag slots, create several meetings at once ----
let draftSeq=0;
function addDraft(date,allDay,start,end){ P.drafts.push({key:++draftSeq,date,allDay,start,end,participants:selParticipants()}); P.drafts.sort((a,b)=>a.date.localeCompare(b.date)||(a.allDay?-1:b.allDay?1:a.start-b.start)); }
function inMeeting(m,k,hr){ return m.date===k && (m.allDay || (hr>=m.start && hr<m.end)); }
function draftInvited(dr){ const rs=P.data.responses||[]; return dr.participants==='all'?rs:rs.filter(r=>dr.participants.some(p=>p.id===r.id)); }
function renderPlanner(S){
  const d=P.data, slotsOn=d.poll.answerMode!=='days', tot=sel().length, H=hours(), ms=inst().meetings;
  let h=`<p class="help">${slotsOn?'Darker green = more of the selected people are free; dark cells mean <b>everyone selected</b> is free. <b>Drag down a day</b> to add a meeting draft, tap a day name for an all-day one, tap a draft to remove it.':'Darker green = more of the selected people are free. <b>Tap a day</b> to add or remove an all-day meeting draft.'}
    Each draft invites the people selected when you drew it, so you can switch the Participants list and plan meetings for another group.</p>
    <div class="row mt-3"><button class="btn" data-suggest>Suggest best times</button>${P.drafts.length?'<button class="btn" data-cleardrafts>Clear drafts</button>':''}</div>`;
  if(slotsOn){
    // Pages: whole weeks, or only the days where someone selected is available/maybe (plus days with drafts or meetings), 5 at a time.
    const PER=5, avail=d.dates.filter(k=>S[k].peak>0||S[k].cm.some(x=>x>0)||P.drafts.some(x=>x.date===k)||ms.some(x=>x.date===k));
    const pages=P.pavail?Array.from({length:Math.ceil(avail.length/PER)},(_,i)=>{ const pg=avail.slice(i*PER,i*PER+PER); while(pg.length<PER) pg.push(null); return pg; }):weeks(d.dates);
    h+=`<div class="row mt-3"><span class="muted small">Show:</span><div class="seg">
      <button data-pview="avail" class="${P.pavail?'on':''}">Available days (${avail.length})</button><button data-pview="week" class="${P.pavail?'':'on'}">Full weeks</button></div></div>`;
    if(!pages.length){ h+=`<p class="help">None of the selected people has marked any hours as available yet.</p>`; return h+draftTray(); }
    const pk=P.pavail?'ppage':'pweek'; P[pk]=Math.min(Math.max(0,P[pk]),pages.length-1); const wk=pages[P[pk]], real=wk.filter(Boolean);
    h+=`<div class="wknav"><button class="btn" data-pwk="-1" ${P[pk]===0?'disabled':''}>‹</button><span class="lbl">${esc(dLabel(real[0]))} – ${esc(dLabel(real[real.length-1]))}${P.pavail&&pages.length>1?` <span class="muted small">(${P[pk]+1}/${pages.length})</span>`:''}</span>
      <button class="btn" data-pwk="1" ${P[pk]===pages.length-1?'disabled':''}>›</button></div>
      <div class="grid pgrid" id="pgrid" style="grid-template-columns:42px repeat(${wk.length},1fr)"><div></div>`;
    wk.forEach((k,i)=>{ const ad=k&&P.drafts.some(x=>x.date===k&&x.allDay);
      h+=`<div class="hd${ad?' dr':''}" ${k?`data-pday="${k}" title="Add an all-day meeting on ${esc(dLabel(k))}"`:''}>${k?WD[wdOf(k)]:'&nbsp;'}<b>${k?dNum(k)||'&nbsp;':'&nbsp;'}</b></div>`; });
    H.forEach((hr,ri)=>{ h+=`<div class="hr">${hh(hr)}</div>`;
      wk.forEach(k=>{ const pos=(ri===0?' top':'')+(ri===H.length-1?' bot':'');
        if(!k){ h+=`<div class="slot na${pos}"></div>`; return; }
        const c=S[k].cy[ri], m=S[k].cm[ri];
        let cls='slot'+pos;
        if(c===tot) cls+=' allfree'; else if(c) cls+=' hm'; else if(m) cls+=' mo';
        if(c<tot&&m&&c+m>=tot) cls+=' mb';
        if(ms.some(x=>inMeeting(x,k,hr))) cls+=' mt';
        if(P.drafts.some(x=>!x.allDay&&inMeeting(x,k,hr))) cls+=' dr';
        h+=`<div class="${cls}" style="--a:${Math.round(12+(c||m)/tot*55)}%" data-k="${k}" data-h="${hr}" title="${esc(dLabel(k))} ${hh(hr)} · ${c}/${tot} available${m?`, ${m} maybe`:''}">${c||(m?m+'?':'')}</div>`; }); });
    h+='</div>';
    h+=`<div class="legend"><span style="--c:color-mix(in srgb,var(--yes) 45%,var(--card))">Some free (number = how many)</span><span style="--c:var(--yes-dark)">Everyone selected free</span><span style="--c:color-mix(in srgb,var(--maybe) 45%,var(--card))">Only “maybe” (n? = how many)</span><span style="--c:var(--maybe)">Rest are “maybe” (stripe)</span><span style="--c:var(--accent)">Draft / ★ scheduled (outline)</span></div>`;
  } else {
    const md=meetingDays();
    h+=calendar(d.dates,(k,day)=>{ const s=S[k], r=tot?s.peak/tot:0, dr=P.drafts.some(x=>x.date===k);
      const bg=s.peak?`background:color-mix(in srgb,var(--yes) ${Math.round(10+r*55)}%,var(--card));border-color:var(--yes)`:'';
      return `<div class="day heat${dr?' dr':''}" style="${bg}" data-pday="${k}"><div class="n">${day}</div><div class="t">${s.peak||s.peakMaybe?`${s.peak}/${tot}${s.peakMaybe?` · +${s.peakMaybe}?`:''}`:''}</div>${md.has(k)?'<span class="star">★</span>':''}</div>`; });
  }
  return h+draftTray();
}
function draftTray(){
  const pt=P.data.poll.title, dm=P.dmeta||(P.dmeta={title:pt,location:'',note:''});
  if(!P.drafts.length) return `<div class="sched"><h3>Meeting drafts</h3><p class="help">No drafts yet. Drag across the grid or tap a day to add one.</p></div>`;
  const rows=P.drafts.map(x=>{ const inv=draftInvited(x), free=inv.filter(r=>windowStatus((r.entries||{})[x.date],x.start,x.end,x.allDay)!=='x').length;
    return `<div class="dft"><span class="when">${esc(dLabel(x.date))}</span>
      <label class="check m0"><input type="checkbox" data-dall="${x.key}" ${x.allDay?'checked':''}> All day</label>
      ${x.allDay?'':`<span class="row"><select class="inline" data-dstart="${x.key}">${hourOpts(0,23,x.start)}</select> to <select class="inline" data-dend="${x.key}">${hourOpts(1,24,x.end)}</select></span>`}
      <span class="tag ${free===inv.length?'y':free?'m':'x'}" title="Invited people who are available or maybe for the whole time">${free}/${inv.length} free</span>
      <button class="btn sm danger" data-deldraft="${x.key}" title="Remove draft">✕</button>
      <span class="who">Who: ${esc(x.participants==='all'?'Everyone':x.participants.map(p=>p.name).join(', '))}</span></div>`; }).join('');
  return `<div class="sched"><h3>Meeting drafts (${P.drafts.length})</h3><div class="drafts">${rows}</div>
    <div class="grid2 mt-2">
      <div class="field"><label>Title (for all)</label><input type="text" id="dm_title" maxlength="120" value="${esc(dm.title)}"></div>
      <div class="field"><label>Location (optional)</label><input type="text" id="dm_loc" maxlength="200" value="${esc(dm.location)}"></div></div>
    ${repeatFields()}
    <div class="field"><label>Note (optional)</label><textarea id="dm_note" maxlength="1000">${esc(dm.note)}</textarea></div>
    <div class="err" id="dm_err"></div>
    <div class="row mt-4"><button class="btn primary" data-savedrafts>Create ${P.drafts.length} ${P.drafts.length===1?'meeting':'meetings'}</button></div></div>`;
}
function wirePlanner(){
  const dm=P.dmeta, find=k=>P.drafts.find(x=>x.key===+k);
  [['dm_title','title'],['dm_loc','location'],['dm_note','note']].forEach(([id,f])=>{ const el=$(id); if(el) el.oninput=()=>{ dm[f]=el.value; }; });
  document.querySelectorAll('[data-dall]').forEach(cb=>cb.onchange=()=>{ const x=find(cb.dataset.dall); x.allDay=cb.checked; if(!x.allDay&&x.start==null){ const [st,en]=bestBlock(stats(x.date)); x.start=st; x.end=Math.min(24,en); } renderBody(); });
  document.querySelectorAll('[data-dstart]').forEach(se=>se.onchange=()=>{ const x=find(se.dataset.dstart); x.start=+se.value; if(x.end<=x.start) x.end=Math.min(24,x.start+1); renderBody(); });
  document.querySelectorAll('[data-dend]').forEach(se=>se.onchange=()=>{ const x=find(se.dataset.dend); x.end=+se.value; if(x.end<=x.start) x.start=Math.max(0,x.end-1); renderBody(); });
  const grid=$('pgrid'); if(!grid) return;
  let drag=null;
  const cellAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.classList&&el.classList.contains('slot')&&el.dataset.k?el:null; };
  const paint=()=>{ const lo=Math.min(drag.a,drag.b), hi=Math.max(drag.a,drag.b);
    grid.querySelectorAll(`.slot[data-k="${drag.k}"]`).forEach(c=>{ const hr=+c.dataset.h; c.classList.toggle('dr', drag.orig.has(c)||(hr>=lo&&hr<=hi)); }); };
  const end=()=>{ if(!drag) return; const lo=Math.min(drag.a,drag.b), hi=Math.max(drag.a,drag.b), k=drag.k; drag=null; addDraft(k,false,lo,hi+1); renderBody(); };
  grid.addEventListener('pointerdown',e=>{ const el=cellAt(e.clientX,e.clientY); if(!el) return; e.preventDefault();
    const k=el.dataset.k, hr=+el.dataset.h, hit=P.drafts.find(x=>!x.allDay&&inMeeting(x,k,hr));
    if(hit){ P.drafts=P.drafts.filter(x=>x!==hit); renderBody(); return; }
    drag={k,a:hr,b:hr,orig:new Set(grid.querySelectorAll(`.slot.dr[data-k="${k}"]`))}; paint();
    window.addEventListener('pointerup',end,{once:true}); window.addEventListener('pointercancel',()=>{ drag=null; renderBody(); },{once:true}); });
  grid.addEventListener('pointermove',e=>{ if(!drag) return; const el=cellAt(e.clientX,e.clientY); if(el&&el.dataset.k===drag.k&&+el.dataset.h!==drag.b){ drag.b=+el.dataset.h; paint(); } });
}
function suggestDrafts(){
  const slotsOn=P.data.poll.answerMode!=='days', tot=sel().length, taken=new Set(P.drafts.map(x=>x.date));
  const ranked=P.data.dates.filter(k=>!taken.has(k)).map(k=>({k,s:stats(k)})).filter(o=>o.s.peak>0)
    .sort((a,b)=>b.s.peak-a.s.peak||b.s.full-a.s.full||b.s.peakMaybe-a.s.peakMaybe||a.k.localeCompare(b.k)).slice(0,3);
  if(!ranked.length){ toast('No free times found for the selected people'); return; }
  ranked.forEach(o=>{ if(slotsOn&&o.s.full<tot){ const [st,en]=bestBlock(o.s); addDraft(o.k,false,st,Math.min(en,24)); } else addDraft(o.k,true,null,null); });
  renderBody(); toast(`Added ${ranked.length} ${ranked.length===1?'draft':'drafts'}`);
}
async function saveDrafts(btn){
  const dm=P.dmeta||{title:'',location:'',note:''}, ms=inst().meetings, err=$('dm_err');
  if(!P.drafts.length) return;
  if(ms.length+P.drafts.length>100){ err.textContent=`A poll can have at most 100 meetings (${ms.length} already scheduled).`; return; }
  const rv=repeatValue(err); if(!rv) return;
  const list=P.drafts.map(x=>{ const m={date:x.date, allDay:x.allDay, title:dm.title, location:dm.location, note:dm.note, participants:x.participants, ...rv};
    if(!x.allDay){ m.start=x.start; m.end=x.end; } return m; });
  btn.disabled=true; const n=list.length;
  if(await saveMeetings([...ms, ...list])){ P.drafts=[]; renderBody(); toast(`${n} ${n===1?'meeting':'meetings'} created`); }
  else btn.disabled=false;
}

  catch(e){ el.innerHTML=`<p class="err">${esc(e.message)}</p>`; return; }
  const ps=P.parts;
  el.innerHTML=`<p class="help">Guests are identified by their name, which is unique in this poll and stays the same across all rounds. People who answer while signed in are identified by their account's email, so their names may repeat.</p>
    ${ps.length?`<ul class="list">${ps.map(p=>`<li><span class="grow"><b>${esc(p.name)}</b>${p.account?' <span class="pill soft" title="Answered while signed in: identified by their email, not by name">Account</span>':''}${p.email?` <span class="muted small">· ${esc(p.email)}</span>`:''}<br>
      <span class="muted small">${p.rounds?`${p.rounds} ${p.rounds===1?'answer':'answers'} · last ${esc(new Date(p.lastAnswered).toLocaleDateString())}`:'no answers yet'}</span></span>
      <button class="btn" data-pedit="${esc(p.id)}">Edit</button>
      ${ps.length>1?`<select class="inline" data-pmerge="${esc(p.id)}"><option value="">Merge into…</option>${ps.filter(x=>x.id!==p.id).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`:''}
      <button class="btn danger" data-pdel="${esc(p.id)}">Remove</button></li>`).join('')}</ul>`:'<p class="help">Nobody yet.</p>'}
    <div class="field"><label for="p_add">Add people in advance (one per line: Name or Name, email)</label>
      <textarea id="p_add" maxlength="20000" placeholder="Anna&#10;Ben, ben@example.com"></textarea></div>
    <div class="row mt-3"><button class="btn" data-padd>Add</button></div>`;
}
async function partsChanged(msg){ if(msg) toast(msg); await loadPoll(false); }
document.addEventListener('change',async e=>{
  const sel=e.target.closest('[data-pmerge]'); if(!sel||!sel.value) return;
  const src=P.parts.find(x=>x.id===sel.dataset.pmerge), dst=P.parts.find(x=>x.id===sel.value);
  if(!confirm(`Merge “${src.name}” into “${dst.name}”? All answers move to “${dst.name}”. Where both answered the same round, the newer answer is kept.`)){ sel.value=''; return; }
  try{ const r=await api('POST',`/polls/${P.id}/participants/${src.id}/merge`,{into:dst.id},headers()); partsChanged(`Merged${r.removedAnswers?` (${r.removedAnswers} older ${r.removedAnswers===1?'answer':'answers'} removed)`:''}`); }
  catch(ex){ toast(ex.message); sel.value=''; }
});
function wireAdmin(){
  if(P.atab==='participants') loadParts();
  const rf=$('rf'); if(rf) rf.onsubmit=async e=>{ e.preventDefault(); const err=$('rerr'); err.textContent='';
    try{ await api('PATCH',`/polls/${P.id}`,{openDays:+$('s_open').value, deadlineDays:$('s_dld').value===''?null:+$('s_dld').value},headers());
      toast('Schedule saved'); await loadPoll(false); }catch(ex){ err.textContent=ex.message; } };
  const f=$('sf'); if(!f) return;
  const p=P.data.poll, v=id=>{ const el=$(id); return el?el.value:undefined; };
  f.onsubmit=async e=>{ e.preventDefault(); const err=$('serr'); err.textContent='';
    const b={ title:v('s_title'), description:v('s_desc'), hideResults:$('s_hide').checked, allowComments:$('s_com').checked, answerMode:v('s_ans') }; { const pv=patValue('sp'); if(pv.empty){ toast('Pick at least one day of the week'); return; } Object.assign(b,{hourStart:pv.hs, hourEnd:pv.he, dayPattern:pv.pat}); }
    const pk=pickerValue('poll'); b.icon=pk.emoji; if(pk.image!==undefined) b.image=pk.image;
    if(P.data.emailEnabled){ if($('s_notify')) b.notifyOpen=$('s_notify').checked; b.remindDays=$('s_remind').checked&&v('s_rdays')!==''?+v('s_rdays'):null; }
    const clr=$('s_pwclear'); if(clr&&clr.checked) b.password=''; else if(v('s_pw')) b.password=v('s_pw');
    // Settings → Dates edits the poll's single round; only sent when something there changed.
    const i=inst(), ib={};
    if($('s_from') && (v('s_from')!==i.startDate || v('s_to')!==i.endDate)) Object.assign(ib,{startDate:v('s_from'), endDate:v('s_to')});
    if($('s_dl') && (v('s_dl')||null)!==(i.deadline||null)) ib.deadline=v('s_dl')||null;
    if($('s_note') && v('s_note')!==i.note) ib.note=v('s_note');
    try{ if(Object.keys(ib).length) await api('PATCH',`/polls/${P.id}/instances/${i.id}`,ib,headers());
      await api('PATCH',`/polls/${P.id}`,b,headers());
      if(b.password!==undefined){ if(b.password) store.set('pw:'+P.id,b.password); else store.del('pw:'+P.id); P.password=b.password||null; }
      if(b.answerMode==='slots') P.mode='slots'; else if(b.answerMode==='days') P.mode='days';
      toast('Settings saved'); await loadPoll(false);
    }catch(ex){ err.textContent=ex.message; } };
  const tm=$('testMail'); if(tm) tm.onclick=async()=>{ try{ await api('POST',`/polls/${P.id}/test-email`,{},headers()); toast('Test email sent'); }catch(ex){ toast(ex.message); } };
  $('delPoll').onclick=async()=>{
    if(!confirm(`Delete this ${p.kind==='series'?'whole series (all its polls)':'poll'} and all answers? This can’t be undone.`)) return;
    try{ await api('DELETE',`/polls/${P.id}`,null,headers()); location.href=origin; }
    catch(ex){ alert(ex.message); } };
}

// ---- events ----
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-copy],[data-forget],[data-tab],[data-mode],[data-brush],[data-wk],[data-day],[data-bulk],[data-ov],[data-delresp],[data-schedule],[data-cancelsched],[data-clearrange],[data-savesched],[data-mail],[data-copyinvite],[data-delmeet],[data-sendinvite],[data-inst],[data-istatus],[data-iedit],[data-idel],[data-nextinst],[data-invitepoll],[data-sendpoll],[data-gview],[data-whoall],[data-whonone],[data-pwk],[data-pview],[data-pday],[data-deldraft],[data-suggest],[data-savedrafts],[data-cleardrafts],[data-logout],[data-recall],[data-pedit],[data-pdel],[data-padd],[data-atab]'); if(!t) return;
  const ds=t.dataset;
  if(ds.atab){ e.preventDefault(); setAdminTab(ds.atab); return; }
  if(ds.copy!==undefined){ e.preventDefault(); copy(ds.copy); return; }
  if(ds.sendpoll){ const r=pollInviteMail(ds.sendpoll,'',null,emailsValue(ds.sendpoll));
    if(r.bad.length){ toast(`Doesn't look like an email: ${r.bad.slice(0,3).join(', ')}${r.bad.length>3?' …':''}`); return; }
    if(!r.ok.length){ toast('Enter at least one email address'); return; }
    t.disabled=true;
    try{ const x=await api('POST',`/polls/${ds.sendpoll}/invite`,{emails:r.ok});
      toast(`Invite sent to ${x.sent} ${x.sent===1?'person':'people'}`); emailsClear(ds.sendpoll); }
    catch(ex){ toast(ex.message); }
    t.disabled=false; return; }
  if(ds.invitepoll){ const r=pollInviteMail(ds.invitepoll, ds.title, ds.deadline||null, emailsValue(ds.invitepoll));
    if(r.bad.length) toast(`Skipped (doesn't look like an email): ${r.bad.slice(0,3).join(', ')}${r.bad.length>3?' …':''}`);
    else if(!r.ok.length) toast('No addresses entered. Opening a blank email.');
    location.href=r.href; return; }
  if(ds.logout!==undefined){ e.preventDefault(); try{ await api('POST','/auth/logout',{everywhere:ds.logout==='all'}); }catch(ex){} location.reload(); return; }
  if(ds.recall!==undefined){ recallMine(); return; }
  if(ds.padd!==undefined){ const v=$('p_add').value; if(!v.trim()) return;
    try{ const r=await api('POST',`/polls/${P.id}/participants`,{lines:v},headers());
      partsChanged(`Added ${r.added.length}${r.skipped.length?` · already there: ${r.skipped.join(', ')}`:''}`); }catch(ex){ toast(ex.message); } return; }
  if(ds.pedit){ const p=P.parts.find(x=>x.id===ds.pedit); if(!p) return;
    const name=prompt('Name', p.name); if(name===null) return; const mail=p.account?p.email:prompt(`Email for ${name} (optional)`, p.email||''); if(mail===null) return;
    try{ await api('PATCH',`/polls/${P.id}/participants/${p.id}`,{name,email:mail},headers()); partsChanged('Saved'); }catch(ex){ toast(ex.message); } return; }
  if(ds.pdel){ const p=P.parts.find(x=>x.id===ds.pdel); if(!p) return;
    if(!confirm(`Remove “${p.name}” from this poll?`)) return;
    const answers = p.rounds ? confirm(`Also delete ${p.name}'s ${p.rounds} ${p.rounds===1?'answer':'answers'}?\n\nOK = delete them\nCancel = keep them (no longer linked to the name)`) : false;
    try{ await api('DELETE',`/polls/${P.id}/participants/${p.id}${answers?'?answers=1':''}`,null,headers()); partsChanged('Removed'); }catch(ex){ toast(ex.message); } return; }
  if(ds.forget){ store.set('myPolls',store.get('myPolls',[]).filter(x=>x.id!==ds.forget)); renderHome(); return; }
  if(ds.inst){ if(P.data.isAdmin){ P.atab='answers'; store.set('atab:'+P.id,'answers'); } switchInstance(ds.inst); return; }
  if(ds.iedit!==undefined){ e.preventDefault(); P.iedit=ds.iedit||null; renderSeries(); return; }
  if(ds.istatus){ try{ await api('PATCH',`/polls/${P.id}/instances/${ds.istatus}`,{status:ds.to},headers()); toast(ds.to==='closed'?'Poll closed':'Poll reopened'); await loadPoll(false); }catch(ex){ toast(ex.message); } return; }
  if(ds.idel){ const x=P.data.instances.find(y=>y.id===ds.idel);
    if(!confirm(`Delete the poll for ${instLabel(x)} and its ${x.responses} answers? This can’t be undone.`)) return;
    try{ await api('DELETE',`/polls/${P.id}/instances/${ds.idel}`,null,headers()); if(P.iid===ds.idel) P.iid=null; toast('Deleted'); await loadPoll(false); }catch(ex){ toast(ex.message); } return; }
  if(ds.nextinst!==undefined){ if(!P.data.next||!confirm(`Open the poll for ${rangeLabel(P.data.poll.unit,P.data.next.startDate,P.data.next.endDate)} now?`)) return;
    try{ const r=await api('POST',`/polls/${P.id}/instances`,{},headers()); toast('Opened'); await switchInstance(r.id); }catch(ex){ toast(ex.message); } return; }
  if(ds.gview){ P.gview=ds.gview; P.sched=null; renderBody(); return; }
  if(ds.whoall!==undefined){ setWho(new Set((P.data.responses||[]).map(r=>r.id))); return; }
  if(ds.whonone!==undefined){ setWho(new Set()); return; }
  if(ds.pwk){ P[P.pavail?'ppage':'pweek']+=+ds.pwk; renderBody(); return; }
  if(ds.pview){ P.pavail=ds.pview==='avail'; renderBody(); return; }
  if(ds.pday){ const ex=P.drafts.find(x=>x.date===ds.pday&&x.allDay); if(ex) P.drafts=P.drafts.filter(x=>x!==ex); else addDraft(ds.pday,true,null,null); renderBody(); return; }
  if(ds.deldraft){ P.drafts=P.drafts.filter(x=>x.key!==+ds.deldraft); renderBody(); return; }
  if(ds.cleardrafts!==undefined){ P.drafts=[]; renderBody(); return; }
  if(ds.suggest!==undefined){ suggestDrafts(); return; }
  if(ds.savedrafts!==undefined){ saveDrafts(t); return; }
  if(ds.tab){ if(t.disabled) return; P.tab=ds.tab; renderBody(); return; }
  if(ds.mode){ P.mode=ds.mode; renderBody(); return; }
  if(ds.brush){ P.brush=ds.brush; renderBody(); return; }
  if(ds.wk){ P.week+=+ds.wk; renderBody(); return; }
  if(ds.ov){ if(P.ovDay!==ds.ov) P.sched=null; P.ovDay=P.ovDay===ds.ov?null:ds.ov; renderBody(); return; }
  if(ds.schedule){ openSched(ds.schedule); return; }
  if(ds.cancelsched!==undefined){ P.sched=null; renderBody(); return; }
  if(ds.clearrange!==undefined){ P.range=null; renderBody(); return; }
  if(ds.savesched!==undefined){ saveSched(); return; }
  if(ds.mail||ds.copyinvite||ds.delmeet||ds.sendinvite){
    const m=inst().meetings.find(x=>x.id===(ds.mail||ds.copyinvite||ds.delmeet||ds.sendinvite)); if(!m) return;
    if(ds.copyinvite){ copy(inviteText(m)); return; }
    if(ds.delmeet){ if(confirm('Delete this meeting?')) saveMeetings(inst().meetings.filter(x=>x.id!==m.id)); return; }
    if(ds.sendinvite){ t.disabled=true;
      try{ const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/meetings/${m.id}/send`,{},headers());
        toast(`Invite sent to ${r.sent} ${r.sent===1?'person':'people'}`); await loadPoll(false); }
      catch(ex){ toast(ex.message); t.disabled=false; } return; }
    const to=invited(m).filter(r=>r.email).map(r=>r.email);
    if(!to.length) toast('Nobody invited left an email. Opening a blank email.');
    location.href=`mailto:?${to.length?'bcc='+encodeURIComponent(to.join(','))+'&':''}subject=${encodeURIComponent((m.title||P.data.poll.title)+' · '+(m.repeat?repeatText(m).split(' · ')[0]:dayLabel(m.date)))}&body=${encodeURIComponent(inviteText(m))}`;
    return;
  }
  if(ds.delresp){ if(!confirm('Delete this response?')) return; try{ await api('DELETE',`/polls/${P.id}/responses/${ds.delresp}`,null,headers()); await loadPoll(false); }catch(err){ toast(err.message); } return; }
  if(!editable()) return;
  if(ds.day){ const v=P.mine.entries[ds.day]; setEntry(ds.day, v==='y'?'m':v==='m'?null:'y'); changed(); renderBody(); return; }
  if(ds.bulk){ const dates=P.data.dates, en=Object.assign({},P.mine.entries);
    if(ds.bulk==='all') dates.forEach(k=>en[k]='y');
    if(ds.bulk==='wkend') dates.forEach(k=>{ if(wdOf(k)>=5) en[k]='y'; });
    if(ds.bulk==='clear') Object.keys(en).forEach(k=>delete en[k]);
    P.mine.entries=en; changed(); renderBody(); }
});

    ov.innerHTML=`<div class="pigeon-win" id="pgWin"><div class="pigeon-bar"><span class="pg-title">🐦<span> Pigeon Post</span></span><span class="pg-stat">Delivered <b id="pgScore">0</b></span><span class="pg-stat">Best <b id="pgBest">0</b></span>
      <button type="button" class="pg-btn" id="pgSnd" aria-label="Toggle sound"></button><button type="button" class="pg-btn" id="pgX" aria-label="Close game">✕</button></div><canvas id="pgCv"></canvas>
      <a class="pg-credit" href="https://commons.wikimedia.org/wiki/File:Bird-in-flight.gif" target="_blank" rel="noopener">Pigeon: Gadgetroid, CC BY-SA 3.0 (edited)</a></div>`;
    document.body.appendChild(ov); prevOverflow=document.body.style.overflow; document.body.style.overflow='hidden';
    cv=$('pgCv'); cx=cv.getContext('2d'); s=null; size(); reset(true); sndLabel(); reveal(true);
    $('pgX').onclick=close;
    $('pgSnd').onclick=()=>{ muted=!muted; store.set('ww_pigeon_muted',muted); sndLabel(); coo(); ov.focus(); };
    cv.addEventListener('pointerdown',onPtr); ov.addEventListener('pointerdown',e=>{ if(e.target===ov) close(); });
    window.addEventListener('keydown',onKey,true); window.addEventListener('resize',onResize); document.addEventListener('visibilitychange',onVis); darkMq.addEventListener('change',onScheme);
    ov.focus(); last=0; raf=requestAnimationFrame(frame);
  }
  function close(){
    if(!ov||closing) return; closing=true;
    window.removeEventListener('keydown',onKey,true); window.removeEventListener('resize',onResize); document.removeEventListener('visibilitychange',onVis); darkMq.removeEventListener('change',onScheme);
    reveal(false,()=>{ cancelAnimationFrame(raf); raf=0; ov.remove(); ov=null; s=null; closing=false; document.body.style.overflow=prevOverflow; });
    if(location.hash==='#pigeon') history.replaceState(null,'',location.pathname+location.search);
  }
  return {open,close};
})();
// Triggers. A single click on the logo mark still goes home (after a short pause to count clicks).
let logoTaps=0, logoT=0, logoNav=null;
document.addEventListener('click',e=>{
  const m=e.target.closest('.logo .mark'); if(!m||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  e.preventDefault(); const a=m.closest('a'), now=Date.now();
  logoTaps=now-logoT<600?logoTaps+1:1; logoT=now; clearTimeout(logoNav);
  if(logoTaps>=5){ logoTaps=0; const r=m.getBoundingClientRect(); Pigeon.open({x:r.left+r.width/2,y:r.top+r.height/2}); return; }
  if(logoTaps===1) logoNav=setTimeout(()=>{ location.href=a.href; },350);
});
let typed='';
document.addEventListener('keydown',e=>{
  const t=e.target; if(e.ctrlKey||e.metaKey||e.altKey||!e.key||e.key.length!==1) return;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  typed=(typed+e.key.toLowerCase()).slice(-3); if(typed==='coo'){ typed=''; Pigeon.open(); }
});
const hashPigeon=()=>{ if(location.hash==='#pigeon') Pigeon.open(); };
window.addEventListener('hashchange',hashPigeon); hashPigeon();
window.addEventListener('beforeunload',e=>{ if(P.dirty||P.saving){ e.preventDefault(); e.returnValue=''; } });

// ---- boot ----
(async()=>{
  try{ CONFIG = await api('GET','/config'); }catch(e){}
  const qs=new URLSearchParams(location.search), pid=qs.get('p');
  // Old admin links (?admin=…) no longer manage a poll; they are kept only to move the poll into an account.
  const ak=qs.get('admin');
  if(pid&&ak){ const list=store.get('myPolls',[]); if(!list.some(x=>x.id===pid)){ list.unshift({id:pid,adminKey:ak,title:'Poll',created:Date.now()}); store.set('myPolls',list); }
    history.replaceState(null,'',`?p=${encodeURIComponent(pid)}`); }
  try{ Object.assign(ME, await api('GET','/me')); }catch(e){}
  if(ME.user){
    if(store.get('myPolls',[]).some(p=>p.adminKey)) await claimLocalPolls();
    try{ Object.assign(ME, await api('GET','/me/polls')); }catch(e){}
  }
  if(pid){
    await openPoll(pid);
    if(P.data&&!ME.user){ const list=store.get('myPolls',[]); list.forEach(x=>{ if(x.id===pid) x.title=P.data.poll.title; }); store.set('myPolls',list); }
  } else if(qs.has('account')) renderAccount();
  else if(qs.has('new')) renderNew();
  else renderHome();
})();
})();
</script>
