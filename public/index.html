<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whenwho</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f7f6f3; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc; --empty:#e9e7e1;
    --yes:#2f9e62; --yes-dark:#1d6e42; --yes-bg:#dff3e8; --maybe:#d99a1c; --maybe-bg:#fbefd2;
    --no:#c4554c; --no-bg:#f6e0de; --accent:#7c4dff; --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17171a; --card:#212125; --ink:#f2f2f4; --muted:#a0a0a8; --line:#34343a; --empty:#2e2e33;
      --yes-bg:#1d3a2a; --yes-dark:#7fd6a5; --maybe-bg:#3d3015; --no-bg:#3f2222; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  a{color:var(--accent)}
  .wrap{max-width:880px;margin:0 auto;padding:22px 16px 70px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .top a.home{font-weight:700;text-decoration:none;color:var(--ink);font-size:14px}
  .top .acct{margin-left:auto;margin-top:0}
  .namehint{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--maybe-bg);font-size:13px}
  .namehint .btn{margin-left:6px;padding:4px 9px}
  h1{font-size:25px;margin:6px 0 4px;letter-spacing:-.01em}
  h2{font-size:17px;margin:0} h3{font-size:15px;margin:0}
  .sub{color:var(--muted);font-size:14px}
  .desc{margin-top:8px;white-space:pre-wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .muted{color:var(--muted)} .small{font-size:13px}
  label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
  .field{margin-top:12px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],textarea,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
  textarea{min-height:60px;resize:vertical}
  input[type=number]{width:90px}
  select.inline{width:auto}
  .check{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;margin-top:8px}
  .check input{width:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){ .grid2{grid-template-columns:1fr} }
  .btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--no)}
  .btn:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;gap:4px;margin-top:18px;background:var(--line);padding:4px;border-radius:10px;width:fit-content}
  .tabs button,.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
  .tabs button.on,.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--bg);border:1px solid var(--line);padding:3px;border-radius:9px}
  .seg button{padding:5px 11px;font-size:13px}
  .seg .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
  .notice{margin-top:12px;padding:10px 14px;border-radius:var(--radius);background:var(--maybe-bg);font-size:14px}
  .err{margin-top:10px;color:var(--no);font-size:14px}
  .help{color:var(--muted);font-size:13px;margin:10px 0 0}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .linkbox{display:flex;gap:6px;margin-top:4px} .linkbox input{font-size:13px}
  .mlabel{font-weight:700;margin:16px 0 0;font-size:14px}
  /* calendars */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
  .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
  .day{position:relative;min-height:62px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;cursor:pointer;background:var(--card);user-select:none;overflow:hidden}
  .day:active{transform:scale(.97)}
  .day.off{cursor:default;background:transparent;border-style:dashed;opacity:.35}
  .day .n{font-weight:700;font-size:14px}
  .day .t{font-size:11px;margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day.y{background:var(--yes-bg);border-color:var(--yes)} .day.y .t{color:var(--yes-dark)}
  .day.m{background:var(--maybe-bg);border-color:var(--maybe)} .day.m .t{color:var(--maybe)}
  .day.no{background:var(--no-bg);border-color:var(--no)} .day.no .t{color:var(--no)}
  .day.sel{outline:2px solid var(--ink);outline-offset:1px}
  .day .star{position:absolute;top:5px;right:7px;color:var(--accent);font-size:13px}
  .day.heat .t{color:var(--ink)}
  .ratio{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--empty)}
  .ratio i{display:block;height:100%}
  .ratio .ry{background:var(--yes)} .ratio .rm{background:var(--maybe)} .ratio .rn{background:var(--no)}
  .blank{min-height:62px}
  .wknav{display:flex;align-items:center;gap:8px;margin-top:12px}
  .wknav .lbl{font-weight:600;font-size:14px}
  .grid{display:grid;margin-top:10px;user-select:none;touch-action:none}
  .grid .hd{font-size:12px;font-weight:600;text-align:center;padding:4px 2px;color:var(--muted)}
  .grid .hd b{display:block;color:var(--ink);font-size:14px}
  .grid .hr{font-size:11px;color:var(--muted);text-align:right;padding-right:6px;line-height:26px}
  .slot{height:26px;border:1px solid var(--line);border-top:0;background:var(--card);cursor:pointer;margin:0 2px}
  .slot.top{border-top:1px solid var(--line);border-radius:6px 6px 0 0}
  .slot.bot{border-radius:0 0 6px 6px}
  .slot.sy{background:var(--yes);border-color:color-mix(in srgb,var(--yes) 70%,#000)}
  .slot.sm{background:var(--maybe);border-color:color-mix(in srgb,var(--maybe) 70%,#000)}
  .slot.sn{background:var(--no);border-color:color-mix(in srgb,var(--no) 70%,#000)}
  .slot.na{background:var(--bg);cursor:default;opacity:.4}
  /* overview */
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:8px}
  .p{font-size:13px;padding:6px 9px;border-radius:8px;background:var(--bg)}
  .p .pr{display:flex;justify-content:space-between;gap:8px}
  .p .st{font-weight:600;text-align:right}
  .p .ratio{margin-top:5px;height:6px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:12px}
  .stack{flex:1;height:100%;display:flex;flex-direction:column-reverse}
  .bar{background:var(--yes)} .bar.best{background:var(--yes-dark)} .bar.mbar{background:var(--maybe);opacity:.8}
  .barl{display:flex;gap:3px;font-size:10px;color:var(--muted)} .barl span{flex:1;text-align:center}
  .list{margin:8px 0 0;padding:0;list-style:none}
  .list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
  .list li:first-child{border-top:0}
  .list li.click{cursor:pointer}
  .sc{font-weight:700;min-width:44px}
  .comments .c{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .comments .c:first-child{border-top:0}
  details summary{cursor:pointer;font-weight:600}
  .meet{padding:10px 0;border-top:1px solid var(--line)} .meet:first-of-type{border-top:0}
  .meet .when{font-weight:700}
  .meet .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .sched{margin-top:14px;padding:14px;border:1px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 5%,var(--card))}
  .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px;margin-top:6px}
  .plist label{font-weight:500;display:flex;gap:6px;align-items:center;font-size:13px;margin:0}
  .plist input{width:auto}
  .tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px}
  .tag.y{background:var(--yes-bg);color:var(--yes-dark)} .tag.m{background:var(--maybe-bg);color:var(--maybe)} .tag.x{background:var(--empty);color:var(--muted)}
  /* participant dropdown */
  .dd{position:relative;display:inline-block;margin-top:8px}
  .dd>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px}
  .dd>summary::-webkit-details-marker{display:none}
  .dd>summary::after{content:'▾';color:var(--muted)}
  .dd .ddp{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:230px;max-width:min(320px,calc(100vw - 32px));max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
  .dd .ddp label{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;margin:0;padding:5px 4px;border-radius:6px;cursor:pointer}
  .dd .ddp label:hover{background:var(--bg)}
  .dd .ddp input{width:auto}
  .dd .ddb{display:flex;gap:6px;margin-bottom:6px}
  /* planner */
  .pgrid .slot{position:relative;cursor:crosshair;font-size:10px;line-height:24px;text-align:center;color:var(--ink);overflow:hidden}
  .pgrid .slot.hm{background:color-mix(in srgb,var(--yes) var(--a),var(--card))}
  .pgrid .slot.mb{box-shadow:inset 3px 0 0 var(--maybe)}
  .pgrid .slot.allfree{background:var(--yes-dark);color:#fff}
  .pgrid .slot.mt{outline:2px solid var(--accent);outline-offset:-2px}
  .pgrid .slot.dr{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pgrid .hd{cursor:pointer;border-radius:6px} .pgrid .hd:hover{background:var(--bg)}
  .pgrid .hd.dr{background:var(--accent);color:#fff} .pgrid .hd.dr b{color:#fff}
  .day.dr{outline:3px solid var(--accent);outline-offset:-1px}
  .drafts .dft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .drafts .dft:first-child{border-top:0}
  .drafts .dft .when{font-weight:700;min-width:110px}
  .drafts .dft .who{flex-basis:100%;font-size:12px;color:var(--muted)}
  .hide{display:none!important}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:560px){ .day{min-height:52px;padding:5px} .day .t{font-size:10px} .blank{min-height:52px} }
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const $app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const EMAIL_RE = /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('Copied'); }catch(e){ prompt('Copy this:', text); } }
const origin = location.origin + location.pathname.replace(/index\.html$/,'');
const shareLink = id => `${origin}?p=${id}`;
// "Invite by email": opens the organiser's own email app with the share link (addresses in BCC). No server email needed.
function inviteBox(id,title,deadline){
  return `<details class="field"><summary>Invite by email</summary>
    <div class="field"><label for="inv_${esc(id)}">Email addresses (separate with commas, spaces or new lines)</label>
    <textarea id="inv_${esc(id)}" maxlength="5000" placeholder="anna@example.com, ben@example.com"></textarea></div>
    <div class="row"><button type="button" class="btn" data-invitepoll="${esc(id)}" data-title="${esc(title)}" data-deadline="${esc(deadline||'')}">Open in my email app</button></div>
    <div class="help">Opens a ready-to-send email in your email app, with everyone in BCC so they don't see each other's addresses.</div></details>`;
}
function pollInviteMail(id,title,deadline,raw){
  const parts=(raw||'').split(/[\s,;]+/).map(x=>x.replace(/^<|>$/g,'').trim()).filter(Boolean);
  const ok=[...new Set(parts.filter(x=>EMAIL_RE.test(x)).map(x=>x.toLowerCase()))], bad=parts.filter(x=>!EMAIL_RE.test(x));
  const body=['Hi,','',`When are you free? Please mark your availability for “${title}” here:`, shareLink(id),
    deadline?`\nPlease answer by ${longDay(deadline)}.`:'', '', 'No account needed, just open the link.'].join('\n');
  return { ok, bad, href:`mailto:?${ok.length?'bcc='+encodeURIComponent(ok.join(','))+'&':''}subject=${encodeURIComponent('When are you free? '+title)}&body=${encodeURIComponent(body)}` };
}
const adminLink = (id,key) => `${origin}?p=${id}&admin=${encodeURIComponent(key)}`;

async function api(method, path, body, headers={}){
  const res = await fetch('/api'+path, { method, headers:Object.assign({'content-type':'application/json'},headers), body: body?JSON.stringify(body):undefined });
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error(data.error||('Request failed ('+res.status+')')); err.status=res.status; err.data=data; throw err; }
  return data;
}

// ---------- dates ----------
const parseD = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const dayLabel = k => parseD(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const longDay = k => parseD(k).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const monthLabel = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); };
const wdOf = k => (parseD(k).getDay()+6)%7;
const isoL = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDaysL = (k,n) => { const d=parseD(k); d.setDate(d.getDate()+n); return isoL(d); };
const addMonthsL = (k,n) => { const d=parseD(k); return isoL(new Date(d.getFullYear(), d.getMonth()+n, 1)); };
const seriesStart = (s,n) => s.unit==='month' ? addMonthsL(s.anchor, n*s.every) : addDaysL(s.anchor, n*7*s.every);
function rangeLabel(unit, st, en){
  if(unit==='month' && st.endsWith('-01') && addDaysL(en,1).endsWith('-01')){
    const a=monthLabel(st.slice(0,7)), b=monthLabel(en.slice(0,7)); return a===b?a:`${a} – ${b}`; }
  const f=k=>parseD(k).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  return `${f(st)} – ${f(en)} ${parseD(en).getFullYear()}`;
}
let CONFIG={emailEnabled:false};
let ME={user:null,loginEnabled:false,polls:[]};
const nameKey = s => String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
function accountBar(){
  if(ME.user) return `<span class="acct small muted">Signed in as <b>${esc(ME.user.name)}</b> · <a href="#" data-logout>Sign out</a></span>`;
  if(!ME.loginEnabled) return '';
  return `<details class="acct dd"><summary class="small">Admin login</summary><div class="ddp" style="left:auto;right:0">
    <form class="loginf"><div><label>Username</label><input type="text" name="u" autocomplete="username" value="admin"></div>
    <div class="field"><label>Password</label><input type="password" name="pw" autocomplete="current-password" required></div>
    <div class="err"></div><div class="row" style="margin-top:10px"><button class="btn primary">Sign in</button></div></form></div></details>`;
}
// After signing in, move polls this browser has admin links for into the account.
async function claimLocalPolls(){
  for(const p of store.get('myPolls',[])){
    if(ME.polls.some(x=>x.id===p.id)) continue;
    try{ await api('POST',`/polls/${p.id}/claim`,{},{'x-admin-key':p.adminKey}); }catch(e){}
  }
}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('.loginf'); if(!f) return; e.preventDefault();
  const err=f.querySelector('.err'); err.textContent='';
  try{ await api('POST','/auth/login',{username:f.u.value,password:f.pw.value}); ME.user={name:'admin'}; await claimLocalPolls(); location.reload(); }
  catch(ex){ err.textContent=ex.message; }
});
const hh = h => `${pad(h%24)}:00`;
function hoursText(arr){
  const a=[...arr].sort((x,y)=>x-y), parts=[]; let s=null,p=null;
  a.forEach(h=>{ if(s===null){s=p=h;} else if(h===p+1){p=h;} else {parts.push([s,p]); s=p=h;} });
  if(s!==null) parts.push([s,p]);
  return parts.map(([a,b])=>`${a}–${b+1}`).join(', ');
}

// ================= HOME =================
function seg(id, options, current){ return `<div class="seg" id="${id}">${options.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===current?'on':''}">${l}</button>`).join('')}</div>`; }
function wireSeg(id, onChange){ $(id).onclick=e=>{ const b=e.target.closest('button'); if(!b) return; [...$(id).children].forEach(x=>x.classList.toggle('on',x===b)); onChange(b.dataset.v); }; }

function renderHome(){
  document.title='whenwho';
  const mine = store.get('myPolls',[]);
  const server = ME.user ? ME.polls : [];
  const localOnly = mine.filter(p=>!server.some(x=>x.id===p.id));
  $app.innerHTML = `
    <div class="top">${accountBar()}</div>
    <h1>whenwho</h1>
    <div class="sub">Find out when everyone's free, and who can make it. The organiser creates a poll and sends the link. Answering doesn't need an account.</div>
    <div class="card" id="created" hidden></div>
    ${ME.user?`<div class="card">
      <h2>New poll</h2>
      <form id="f">
        <div class="field"><label for="title">Title</label><input type="text" id="title" maxlength="120" placeholder="e.g. Band rehearsals, Summer trip" required></div>
        <div class="field"><label for="desc">Description (optional)</label><textarea id="desc" maxlength="1000" placeholder="Anything people should know"></textarea></div>
        <div class="field"><label>Type</label>${seg('kindSeg',[['series','Recurring series'],['single','One-off']],'series')}</div>
        <div id="seriesBox">
          <div class="row field"><label style="margin:0">Repeats every</label><input type="number" id="every" min="1" max="12" value="1">
            <select id="unit" class="inline"><option value="month">month(s)</option><option value="week">week(s)</option></select></div>
          <div class="grid2">
            <div class="field"><label for="first" id="firstLbl">First month</label><input type="month" id="first"></div>
            <div class="field"><label for="openDays">Open each poll … days before it starts</label><input type="number" id="openDays" min="0" max="90" value="11"></div>
            <div class="field"><label for="dlDays">Reply by … days before it starts (optional)</label><input type="number" id="dlDays" min="0" max="90" value="4"></div>
          </div>
          <div class="help" id="seriesPreview"></div>
        </div>
        <div id="singleBox" class="grid2 hide">
          <div class="field"><label for="start">From</label><input type="date" id="start"></div>
          <div class="field"><label for="end">To</label><input type="date" id="end"></div>
          <div class="field"><label for="dl">Reply by (optional)</label><input type="date" id="dl"></div>
        </div>
        <div class="field"><label>People answer with</label>${seg('ansSeg',[['days','Whole days'],['slots','Time slots'],['both','Both (they choose)']],'both')}
          <div class="help" id="ansHelp"></div></div>
        <div id="hoursBox" class="row field"><label style="margin:0">Hours from</label><input type="number" id="hs" min="0" max="23" value="8"><label style="margin:0">to</label><input type="number" id="he" min="1" max="24" value="24"></div>
        <details class="field"><summary>Privacy options</summary>
          <div class="field"><label for="pw">Password (optional)</label><input type="password" id="pw" maxlength="100" placeholder="Only people with the password can open the poll" autocomplete="new-password"></div>

// ================= POLL =================
const P = { id:null, data:null, adminKey:null, password:null, iid:null, mine:null, mineFor:null, myResp:null,
  tab:'mine', mode:'days', brush:'y', week:0, ovDay:null, sched:null, dirty:false, saving:false,
  who:null, whoOpen:false, gview:'overview', pweek:0, drafts:[], dmeta:null };

function headers(){ const h={}; if(P.adminKey) h['x-admin-key']=P.adminKey; if(P.password) h['x-poll-password']=P.password;
  if(P.myResp){ if(P.myResp.editKey) h['x-edit-key']=P.myResp.editKey; else if(P.myResp.name) h['x-edit-name']=encodeURIComponent(P.myResp.name); }
  return h; }
const inst = () => P.data.instance;
const respKey = () => `resp:${P.id}:${inst().id}`;
const ansMode = () => P.data.poll.answerMode;
const instLabel = i => P.data.poll.kind==='series' ? rangeLabel(P.data.poll.unit, i.startDate, i.endDate) : `${dayLabel(i.startDate)} – ${dayLabel(i.endDate)}`;

async function openPoll(id){ P.id=id; P.adminKey=store.get('admin:'+id,null); P.password=store.get('pw:'+id,null); await loadPoll(true); }
async function fetchPoll(){ const q=P.iid?`?i=${encodeURIComponent(P.iid)}`:''; return api('GET',`/polls/${P.id}${q}`,null,headers()); }
async function loadPoll(first){
  try{ P.data = await fetchPoll(); }
  catch(e){
    if(e.status===401 && e.data && e.data.needPassword) return renderPassword(e.data.title, e.message);
    if(e.status===403 && P.adminKey){ store.del('admin:'+P.id); P.adminKey=null; return loadPoll(first); }
    $app.innerHTML=`<div class="top"><a class="home" href="${esc(origin)}">← whenwho</a></div><h1>Poll not available</h1><p class="sub">${esc(e.message)}</p>`; return;
  }
  if(!P.data.isAdmin && P.adminKey){ store.del('admin:'+P.id); P.adminKey=null; }
  P.iid = inst().id;
  if(P.mineFor!==P.iid){
    P.mineFor=P.iid; P.dirty=false; P.sched=null; P.ovDay=null; P.week=0; P.who=null; P.whoOpen=false; P.pweek=0; P.drafts=[]; P.dmeta=null;
    P.myResp = store.get(respKey(), null);
    P.mine = { name: store.get('myName',''), email: store.get('myEmail',''), comment:'', entries:{} };
    if(P.myResp){
      try{ const r=await api('GET',`/polls/${P.id}/responses/${P.myResp.id}`,null,headers()); P.mine={name:r.name,email:r.email||'',comment:r.comment,entries:r.entries||{}}; }
      catch(e){ if(e.status===404||e.status===403){ store.del(respKey()); P.myResp=null; } }
    }
  }
  if(first) P.mode = ansMode()==='slots' ? 'slots' : 'days';
  pruneWho();
  render();
}
async function switchInstance(id){ if(P.dirty){ clearTimeout(saveT); await save(); } P.iid=id; await loadPoll(false); window.scrollTo({top:0,behavior:'smooth'}); }

function renderPassword(title,msg){
  $app.innerHTML=`<div class="top"><a class="home" href="${esc(origin)}">← whenwho</a></div><h1>${esc(title||'Poll')}</h1>
    <div class="card"><form id="pwf"><label for="pwi">This poll is password-protected</label>
    <div class="row"><input type="password" id="pwi" class="grow" style="width:auto" autofocus><button class="btn primary">Open</button></div>
    ${msg==='Wrong password'?'<div class="err">Wrong password.</div>':''}</form></div>`;
  $('pwf').onsubmit=e=>{ e.preventDefault(); P.password=$('pwi').value; store.set('pw:'+P.id,P.password); loadPoll(true); };

// ---- entry helpers: 'y' | 'm' | 'n' | {y:[h],m:[h],n:[h]} ----
function hours(){ const p=P.data.poll; return Array.from({length:p.hourEnd-p.hourStart},(_,i)=>p.hourStart+i); }
function hourMap(v){
  const H=hours(), map=new Map();
  if(v==='y'||v==='m'||v==='n') H.forEach(h=>map.set(h,v));
  else if(Array.isArray(v)) v.forEach(h=>map.set(h,'y'));
  else if(v&&typeof v==='object') ['n','m','y'].forEach(s=>(v[s]||[]).forEach(h=>map.set(h,s)));
  return map;
}
function fromMap(map){
  const H=hours(), o={y:[],m:[],n:[]};
  H.forEach(h=>{ const s=map.get(h); if(s) o[s].push(h); });
  for(const s of ['y','m','n']) if(o[s].length===H.length) return s;
  if(!o.y.length&&!o.m.length&&!o.n.length) return null;
  return o;
}
const isPartial = v => Array.isArray(v)||(v&&typeof v==='object');
function counts(v){ const H=hours(), c={y:0,m:0,n:0,e:0}; const map=hourMap(v); H.forEach(h=>{ const s=map.get(h); c[s||'e']++; }); return c; }
function ratioBar(v){ const c=counts(v), t=hours().length; return `<div class="ratio" title="${c.y}h available · ${c.m}h maybe · ${c.n}h not available">${['y','m','n'].map(s=>c[s]?`<i class="r${s}" style="width:${c[s]/t*100}%"></i>`:'').join('')}</div>`; }
function hoursOf(v,s){ return [...hourMap(v)].filter(([h,x])=>x===s).map(([h])=>h).sort((a,b)=>a-b); }
function partialText(v){ const y=hoursOf(v,'y'), m=hoursOf(v,'m'); return [y.length?hoursText(y):'', m.length?'maybe '+hoursText(m):''].filter(Boolean).join(' · ') || "can't"; }
function statusOf(v){
  if(v==='y') return {t:'Available',c:'var(--yes-dark)',cls:'y'};
  if(v==='m') return {t:'Maybe',c:'var(--maybe)',cls:'m'};
  if(v==='n') return {t:"Can't",c:'var(--no)',cls:'no'};
  if(isPartial(v)) return {t:partialText(v),c:'var(--ink)',cls:'part'};
  return {t:'',c:'var(--muted)',cls:''};
}
// availability of a person for a window [start,end) on a day: 'y' all hours available, 'm' none unavailable but some maybe/blank-maybe, 'x' otherwise
function windowStatus(v,start,end,allDay){
  if(v==null) return 'x';
  if(v==='y'||v==='m') return v; if(v==='n') return 'x';
  const map=hourMap(v), H=hours(); const span=allDay?H:H.filter(h=>h>=start&&h<end);
  if(!span.length) return 'x';
  const st=span.map(h=>map.get(h));
  if(st.every(s=>s==='y')) return 'y';
  if(st.every(s=>s==='y'||s==='m')) return 'm';
  return 'x';
}

// ---- saving ----
let saveT=null;
function editable(){ return P.data && inst().status==='open'; }
function status(t){ const el=$('status'); if(el) el.textContent=t; }
function changed(){
  if(!editable()) return;
  P.dirty=true; clearTimeout(saveT);
  if(!P.mine.name.trim()){ status('Enter your name to save'); return; }
  status('Saving…'); saveT=setTimeout(save,800);
}
async function save(){
  if(P.saving||!P.dirty||!P.mine.name.trim()) return;
  P.saving=true; P.dirty=false;
  const em=(P.mine.email||'').trim(), key=respKey();
  const body={name:P.mine.name, email:EMAIL_RE.test(em)?em:'', comment:P.mine.comment, entries:P.mine.entries};
  try{
    if(P.myResp){ const r=await api('PUT',`/polls/${P.id}/responses/${P.myResp.id}`,body,headers());
      if(!P.myResp.editKey && r.name){ P.myResp.name=r.name; store.set(key,P.myResp); } }
    else { const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/responses`,body,headers()); P.myResp={id:r.id,editKey:r.editKey,name:r.name}; store.set(key,P.myResp); nameHint(); }
    store.set('myName',P.mine.name); if(body.email) store.set('myEmail',body.email);
    status(em&&!body.email?'Saved, but that email doesn’t look right':'Saved ✓'); refreshResults();
  }catch(e){
    if(e.status===404 && P.myResp){ store.del(key); P.myResp=null; P.dirty=true; }
    else if(e.status===409 && e.data && e.data.code==='name_taken'){ status('Not saved'); nameHint(true); }
    else status('Not saved: '+e.message);
  }
  P.saving=false; if(P.dirty) save();
}
// "Is that you?": shown when the typed name already belongs to someone in this poll.
function nameHint(force){
  const el=$('nameHint'); if(!el) return;
  const k=nameKey(P.mine.name), p=(P.data.participants||[]).find(x=>nameKey(x.name)===k);
  if(!k || P.myResp || (!p && !force)){ el.innerHTML=''; return; }
  const shown=p?p.name:P.mine.name.trim();
  el.innerHTML=`<div class="namehint">“${esc(shown)}” is already in this poll. If that's you, load your answer.<button type="button" class="btn" data-recall>That's me</button><br><span class="muted">Otherwise, pick a different name.</span></div>`;
}
async function recallMine(){
  try{
    const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/recall`,{name:P.mine.name},headers());
    if(!r.responseId){ // known person, no answer yet this round: their new answer is linked to the same name
      P.mine.name=r.name; $('nameHint').innerHTML=`<div class="namehint">Welcome back, ${esc(r.name)}! Mark your availability below; it's saved under your name.</div>`;
      const nm=$('name'); if(nm) nm.value=r.name; changed(); return; }
    P.myResp={id:r.responseId,editKey:null,name:r.name};
    const a=await api('GET',`/polls/${P.id}/responses/${r.responseId}`,null,headers());
    store.set(respKey(),P.myResp); P.dirty=false; clearTimeout(saveT);
    P.mine={name:a.name,email:a.email||'',comment:a.comment,entries:a.entries||{}};
    render(); toast('Your answer is loaded');
  }catch(e){ P.myResp=null; toast(e.message); }
}
let refT=null;
function refreshResults(){ clearTimeout(refT); refT=setTimeout(async()=>{ try{ const d=await fetchPoll(); if(d.instance.id!==P.iid) return; P.data=d; pruneWho(); renderHeader(); renderSeries(); if(P.tab==='group') renderBody(); }catch(e){} },400); }

// ---- render ----
function render(){

    store.del(respKey()); P.myResp=null; P.mine={name:P.mine.name,email:P.mine.email,comment:'',entries:{}}; P.mineFor=null; await loadPoll(false); };
  if(d.isAdmin) wireAdmin();
  renderBody();
}
function renderHeader(){

// ---- calendars ----
function monthsOf(dates){ const g=[]; dates.forEach(k=>{ const ym=k.slice(0,7); let x=g[g.length-1]; if(!x||x.ym!==ym){ x={ym,days:[]}; g.push(x);} x.days.push(k); }); return g; }
function calendar(dates, cell){
  const set=new Set(dates), groups=monthsOf(dates);
  return groups.map(g=>{
    const [y,m]=g.ym.split('-').map(Number), n=new Date(y,m,0).getDate();
    let h=`${groups.length>1?`<div class="mlabel">${esc(monthLabel(g.ym))}</div>`:''}<div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}`;
    for(let i=0;i<wdOf(`${g.ym}-01`);i++) h+='<div class="blank"></div>';
    for(let d=1; d<=n; d++){ const k=`${g.ym}-${pad(d)}`; h+= set.has(k) ? cell(k,d) : `<div class="day off"><div class="n">${d}</div></div>`; }
    return h+'</div>';
  }).join('');
}
function weeks(dates){
  const out=[]; let cur=null, last=null;
  dates.forEach(k=>{ const wd=wdOf(k); if(!cur||wd===0||(last!=null&&wd<=last)){ cur=Array(7).fill(null); out.push(cur);} cur[wd]=k; last=wd; });
  return out;
}

function setEntry(k,v){ const e=Object.assign({},P.mine.entries); if(v==null) delete e[k]; else e[k]=v; P.mine.entries=e; }

function wireGrid(){
  const grid=$('grid'); if(!grid) return;
  let paint=null, touched=new Map();
  const cellAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.classList&&el.classList.contains('slot')&&el.dataset.k?el:null; };
  const stateOf=el=>['y','m','n'].find(s=>el.classList.contains('s'+s))||null;
  const apply=el=>{ const k=el.dataset.k, hr=+el.dataset.h; if(!touched.has(k)) touched.set(k,hourMap(P.mine.entries[k]));
    const map=touched.get(k); if(paint==='x') map.delete(hr); else map.set(hr,paint);
    ['y','m','n'].forEach(s=>el.classList.toggle('s'+s,paint===s)); };
  const end=()=>{ if(paint===null) return; paint=null; touched.forEach((map,k)=>setEntry(k,fromMap(map))); touched=new Map(); changed(); renderBody(); };
  grid.addEventListener('pointerdown',e=>{ const el=cellAt(e.clientX,e.clientY); if(!el) return; e.preventDefault();
    paint=(P.brush!=='x'&&stateOf(el)===P.brush)?'x':P.brush; touched=new Map(); apply(el);
    window.addEventListener('pointerup',end,{once:true}); window.addEventListener('pointercancel',end,{once:true}); });
  grid.addEventListener('pointermove',e=>{ if(paint===null) return; const el=cellAt(e.clientX,e.clientY); if(el) apply(el); });
}

function stats(k){
  const H=hours(), rs=sel(), cy=H.map(()=>0), cm=H.map(()=>0); let full=0,part=0,maybe=0,no=0;
  const list=rs.map(r=>{ const v=(r.entries||{})[k];
    if(v==='y') full++; else if(v==='n') no++; else if(v==='m') maybe++; else if(isPartial(v)) part++;
    hourMap(v).forEach((s,h)=>{ const i=h-H[0]; if(i<0||i>=H.length) return; if(s==='y') cy[i]++; else if(s==='m') cm[i]++; });
    return {id:r.id,name:r.name||'Someone',v}; });
  const peak=Math.max(0,...cy), bestHours=peak?H.filter((h,i)=>cy[i]===peak):[];
  const peakMaybe=peak?Math.max(0,...H.map((h,i)=>cy[i]===peak?cm[i]:0)):Math.max(0,...cm);
  return {full,part,maybe,no,cy,cm,peak,peakMaybe,bestHours,window:hoursText(bestHours),list};
}
function bestBlock(s){ // longest contiguous run of best hours
  const H=s.bestHours; if(!H.length) return [hours()[0], hours()[0]+2];
  let best=[H[0],H[0]], cur=[H[0],H[0]];
  for(let i=1;i<H.length;i++){ if(H[i]===cur[1]+1) cur[1]=H[i]; else cur=[H[i],H[i]]; if(cur[1]-cur[0]>best[1]-best[0]) best=[...cur]; }
  return [best[0], best[1]+1];
}

async function saveSched(){

let draftSeq=0;
function addDraft(date,allDay,start,end){ P.drafts.push({key:++draftSeq,date,allDay,start,end,participants:selParticipants()}); P.drafts.sort((a,b)=>a.date.localeCompare(b.date)||(a.allDay?-1:b.allDay?1:a.start-b.start)); }
function inMeeting(m,k,hr){ return m.date===k && (m.allDay || (hr>=m.start && hr<m.end)); }
function draftInvited(dr){ const rs=P.data.responses||[]; return dr.participants==='all'?rs:rs.filter(r=>dr.participants.some(p=>p.id===r.id)); }
function renderPlanner(S){
  const d=P.data, slotsOn=d.poll.answerMode!=='days', tot=sel().length, H=hours(), ms=inst().meetings;
  let h=`<p class="help">${slotsOn?'Darker green = more of the selected people are free; dark cells mean <b>everyone selected</b> is free. <b>Drag down a day</b> to add a meeting draft, tap a day name for an all-day one, tap a draft to remove it.':'Darker green = more of the selected people are free. <b>Tap a day</b> to add or remove an all-day meeting draft.'}
    Each draft invites the people selected when you drew it, so you can switch the Participants list and plan meetings for another group.</p>
    <div class="row" style="margin-top:8px"><button class="btn" data-suggest>Suggest best times</button>${P.drafts.length?'<button class="btn" data-cleardrafts>Clear drafts</button>':''}</div>`;
  if(slotsOn){
    const wks=weeks(d.dates); P.pweek=Math.min(Math.max(0,P.pweek),wks.length-1); const wk=wks[P.pweek], real=wk.filter(Boolean);
    h+=`<div class="wknav"><button class="btn" data-pwk="-1" ${P.pweek===0?'disabled':''}>‹</button><span class="lbl">${esc(dayLabel(real[0]))} – ${esc(dayLabel(real[real.length-1]))}</span>
      <button class="btn" data-pwk="1" ${P.pweek===wks.length-1?'disabled':''}>›</button></div>
      <div class="grid pgrid" id="pgrid" style="grid-template-columns:42px repeat(7,1fr)"><div></div>`;
    wk.forEach((k,i)=>{ const ad=k&&P.drafts.some(x=>x.date===k&&x.allDay);
      h+=`<div class="hd${ad?' dr':''}" ${k?`data-pday="${k}" title="Add an all-day meeting on ${esc(dayLabel(k))}"`:''}>${WD[i]}<b>${k?parseD(k).getDate():'&nbsp;'}</b></div>`; });
    H.forEach((hr,ri)=>{ h+=`<div class="hr">${hh(hr)}</div>`;
      wk.forEach(k=>{ const pos=(ri===0?' top':'')+(ri===H.length-1?' bot':'');
        if(!k){ h+=`<div class="slot na${pos}"></div>`; return; }
        const c=S[k].cy[ri], m=S[k].cm[ri];
        let cls='slot'+pos;
        if(c===tot) cls+=' allfree'; else if(c) cls+=' hm';
        if(c<tot&&m&&c+m>=tot) cls+=' mb';
        if(ms.some(x=>inMeeting(x,k,hr))) cls+=' mt';
        if(P.drafts.some(x=>!x.allDay&&inMeeting(x,k,hr))) cls+=' dr';
        h+=`<div class="${cls}" style="--a:${Math.round(12+c/tot*55)}%" data-k="${k}" data-h="${hr}" title="${esc(dayLabel(k))} ${hh(hr)} · ${c}/${tot} available${m?`, ${m} maybe`:''}">${c||''}</div>`; }); });
    h+='</div>';
    h+=`<div class="legend"><span style="--c:color-mix(in srgb,var(--yes) 45%,var(--card))">Some free (number = how many)</span><span style="--c:var(--yes-dark)">Everyone selected free</span><span style="--c:var(--maybe)">Rest are “maybe”</span><span style="--c:var(--accent)">Draft / ★ scheduled (outline)</span></div>`;
  } else {
    const md=meetingDays();
    h+=calendar(d.dates,(k,day)=>{ const s=S[k], r=tot?s.peak/tot:0, dr=P.drafts.some(x=>x.date===k);
      const bg=s.peak?`background:color-mix(in srgb,var(--yes) ${Math.round(10+r*55)}%,var(--card));border-color:var(--yes)`:'';
      return `<div class="day heat${dr?' dr':''}" style="${bg}" data-pday="${k}"><div class="n">${day}</div><div class="t">${s.peak||s.peakMaybe?`${s.peak}/${tot}${s.peakMaybe?` · +${s.peakMaybe}?`:''}`:''}</div>${md.has(k)?'<span class="star">★</span>':''}</div>`; });
  }
  return h+draftTray();
}
function draftTray(){
  const pt=P.data.poll.title, dm=P.dmeta||(P.dmeta={title:pt,location:'',note:''});
  if(!P.drafts.length) return `<div class="sched"><h3>Meeting drafts</h3><p class="help">No drafts yet. Drag across the grid or tap a day to add one.</p></div>`;
  const rows=P.drafts.map(x=>{ const inv=draftInvited(x), free=inv.filter(r=>windowStatus((r.entries||{})[x.date],x.start,x.end,x.allDay)!=='x').length;
    return `<div class="dft"><span class="when">${esc(dayLabel(x.date))}</span>

function wirePlanner(){
  const dm=P.dmeta, find=k=>P.drafts.find(x=>x.key===+k);
  [['dm_title','title'],['dm_loc','location'],['dm_note','note']].forEach(([id,f])=>{ const el=$(id); if(el) el.oninput=()=>{ dm[f]=el.value; }; });
  document.querySelectorAll('[data-dall]').forEach(cb=>cb.onchange=()=>{ const x=find(cb.dataset.dall); x.allDay=cb.checked; if(!x.allDay&&x.start==null){ const [st,en]=bestBlock(stats(x.date)); x.start=st; x.end=Math.min(24,en); } renderBody(); });
  document.querySelectorAll('[data-dstart]').forEach(se=>se.onchange=()=>{ const x=find(se.dataset.dstart); x.start=+se.value; if(x.end<=x.start) x.end=Math.min(24,x.start+1); renderBody(); });
  document.querySelectorAll('[data-dend]').forEach(se=>se.onchange=()=>{ const x=find(se.dataset.dend); x.end=+se.value; if(x.end<=x.start) x.start=Math.max(0,x.end-1); renderBody(); });
  const grid=$('pgrid'); if(!grid) return;
  let drag=null;
  const cellAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.classList&&el.classList.contains('slot')&&el.dataset.k?el:null; };
  const paint=()=>{ const lo=Math.min(drag.a,drag.b), hi=Math.max(drag.a,drag.b);
    grid.querySelectorAll(`.slot[data-k="${drag.k}"]`).forEach(c=>{ const hr=+c.dataset.h; c.classList.toggle('dr', drag.orig.has(c)||(hr>=lo&&hr<=hi)); }); };
  const end=()=>{ if(!drag) return; const lo=Math.min(drag.a,drag.b), hi=Math.max(drag.a,drag.b), k=drag.k; drag=null; addDraft(k,false,lo,hi+1); renderBody(); };
  grid.addEventListener('pointerdown',e=>{ const el=cellAt(e.clientX,e.clientY); if(!el) return; e.preventDefault();
    const k=el.dataset.k, hr=+el.dataset.h, hit=P.drafts.find(x=>!x.allDay&&inMeeting(x,k,hr));
    if(hit){ P.drafts=P.drafts.filter(x=>x!==hit); renderBody(); return; }
    drag={k,a:hr,b:hr,orig:new Set(grid.querySelectorAll(`.slot.dr[data-k="${k}"]`))}; paint();
    window.addEventListener('pointerup',end,{once:true}); window.addEventListener('pointercancel',()=>{ drag=null; renderBody(); },{once:true}); });
  grid.addEventListener('pointermove',e=>{ if(!drag) return; const el=cellAt(e.clientX,e.clientY); if(el&&el.dataset.k===drag.k&&+el.dataset.h!==drag.b){ drag.b=+el.dataset.h; paint(); } });
}
function suggestDrafts(){
  const slotsOn=P.data.poll.answerMode!=='days', tot=sel().length, taken=new Set(P.drafts.map(x=>x.date));
  const ranked=P.data.dates.filter(k=>!taken.has(k)).map(k=>({k,s:stats(k)})).filter(o=>o.s.peak>0)
    .sort((a,b)=>b.s.peak-a.s.peak||b.s.full-a.s.full||b.s.peakMaybe-a.s.peakMaybe||a.k.localeCompare(b.k)).slice(0,3);
  if(!ranked.length){ toast('No free times found for the selected people'); return; }
  ranked.forEach(o=>{ if(slotsOn&&o.s.full<tot){ const [st,en]=bestBlock(o.s); addDraft(o.k,false,st,Math.min(en,24)); } else addDraft(o.k,true,null,null); });
  renderBody(); toast(`Added ${ranked.length} ${ranked.length===1?'draft':'drafts'}`);
}
async function saveDrafts(btn){
  const dm=P.dmeta||{title:'',location:'',note:''}, ms=inst().meetings, err=$('dm_err');

  const list=P.drafts.map(x=>{ const m={date:x.date, allDay:x.allDay, title:dm.title, location:dm.location, note:dm.note, participants:x.participants};
    if(!x.allDay){ m.start=x.start; m.end=x.end; } return m; });
  btn.disabled=true; const n=list.length;
  if(await saveMeetings([...ms, ...list])){ P.drafts=[]; renderBody(); toast(`${n} ${n===1?'meeting':'meetings'} created`); }
  else btn.disabled=false;
}

  if(ds.pdel){ const p=P.parts.find(x=>x.id===ds.pdel); if(!p) return;
    if(!confirm(`Remove “${p.name}” from this poll?`)) return;
    const answers = p.rounds ? confirm(`Also delete ${p.name}'s ${p.rounds} ${p.rounds===1?'answer':'answers'}?\n\nOK = delete them\nCancel = keep them (no longer linked to the name)`) : false;
    try{ await api('DELETE',`/polls/${P.id}/participants/${p.id}${answers?'?answers=1':''}`,null,headers()); partsChanged('Removed'); }catch(ex){ toast(ex.message); } return; }
  if(ds.forget){ store.set('myPolls',store.get('myPolls',[]).filter(x=>x.id!==ds.forget)); renderHome(); return; }
  if(ds.inst){ switchInstance(ds.inst); return; }
  if(ds.iedit!==undefined){ e.preventDefault(); P.iedit=ds.iedit||null; renderSeries(); return; }
  if(ds.istatus){ try{ await api('PATCH',`/polls/${P.id}/instances/${ds.istatus}`,{status:ds.to},headers()); toast(ds.to==='closed'?'Poll closed':'Poll reopened'); await loadPoll(false); }catch(ex){ toast(ex.message); } return; }
  if(ds.idel){ const x=P.data.instances.find(y=>y.id===ds.idel);
    if(!confirm(`Delete the poll for ${instLabel(x)} and its ${x.responses} answers? This can’t be undone.`)) return;
    try{ await api('DELETE',`/polls/${P.id}/instances/${ds.idel}`,null,headers()); if(P.iid===ds.idel) P.iid=null; toast('Deleted'); await loadPoll(false); }catch(ex){ toast(ex.message); } return; }
  if(ds.nextinst!==undefined){ if(!P.data.next||!confirm(`Open the poll for ${rangeLabel(P.data.poll.unit,P.data.next.startDate,P.data.next.endDate)} now?`)) return;
    try{ const r=await api('POST',`/polls/${P.id}/instances`,{},headers()); toast('Opened'); await switchInstance(r.id); }catch(ex){ toast(ex.message); } return; }
  if(ds.gview){ P.gview=ds.gview; P.sched=null; renderBody(); return; }
  if(ds.whoall!==undefined){ setWho(new Set((P.data.responses||[]).map(r=>r.id))); return; }
  if(ds.whonone!==undefined){ setWho(new Set()); return; }
  if(ds.pwk){ P.pweek+=+ds.pwk; renderBody(); return; }
  if(ds.pday){ const ex=P.drafts.find(x=>x.date===ds.pday&&x.allDay); if(ex) P.drafts=P.drafts.filter(x=>x!==ex); else addDraft(ds.pday,true,null,null); renderBody(); return; }
  if(ds.deldraft){ P.drafts=P.drafts.filter(x=>x.key!==+ds.deldraft); renderBody(); return; }
  if(ds.cleardrafts!==undefined){ P.drafts=[]; renderBody(); return; }
  if(ds.suggest!==undefined){ suggestDrafts(); return; }
  if(ds.savedrafts!==undefined){ saveDrafts(t); return; }
  if(ds.tab){ if(t.disabled) return; P.tab=ds.tab; renderBody(); return; }
  if(ds.mode){ P.mode=ds.mode; renderBody(); return; }
  if(ds.brush){ P.brush=ds.brush; renderBody(); return; }
  if(ds.wk){ P.week+=+ds.wk; renderBody(); return; }
  if(ds.ov){ if(P.ovDay!==ds.ov) P.sched=null; P.ovDay=P.ovDay===ds.ov?null:ds.ov; renderBody(); return; }
  if(ds.schedule){ openSched(ds.schedule); return; }
  if(ds.cancelsched!==undefined){ P.sched=null; renderBody(); return; }
  if(ds.savesched!==undefined){ saveSched(); return; }
  if(ds.mail||ds.copyinvite||ds.delmeet||ds.sendinvite){
    const m=inst().meetings.find(x=>x.id===(ds.mail||ds.copyinvite||ds.delmeet||ds.sendinvite)); if(!m) return;
    if(ds.copyinvite){ copy(inviteText(m)); return; }
    if(ds.delmeet){ if(confirm('Delete this meeting?')) saveMeetings(inst().meetings.filter(x=>x.id!==m.id)); return; }
    if(ds.sendinvite){ t.disabled=true;
      try{ const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/meetings/${m.id}/send`,{},headers());
        toast(`Invite sent to ${r.sent} ${r.sent===1?'person':'people'}`); await loadPoll(false); }
      catch(ex){ toast(ex.message); t.disabled=false; } return; }
    const to=invited(m).filter(r=>r.email).map(r=>r.email);
    if(!to.length) toast('Nobody invited left an email. Opening a blank email.');
    location.href=`mailto:?${to.length?'bcc='+encodeURIComponent(to.join(','))+'&':''}subject=${encodeURIComponent((m.title||P.data.poll.title)+' · '+dayLabel(m.date))}&body=${encodeURIComponent(inviteText(m))}`;
    return;
  }
  if(ds.delresp){ if(!confirm('Delete this response?')) return; try{ await api('DELETE',`/polls/${P.id}/responses/${ds.delresp}`,null,headers()); await loadPoll(false); }catch(err){ toast(err.message); } return; }
  if(!editable()) return;
  if(ds.day){ const v=P.mine.entries[ds.day]; setEntry(ds.day, v==null?'y':v==='y'?'m':v==='m'?'n':v==='n'?null:'y'); changed(); renderBody(); return; }
  if(ds.bulk){ const dates=P.data.dates, en=Object.assign({},P.mine.entries);
    if(ds.bulk==='all') dates.forEach(k=>en[k]='y');
    if(ds.bulk==='wkend') dates.forEach(k=>{ if(wdOf(k)>=5) en[k]='y'; });
    if(ds.bulk==='blank') dates.forEach(k=>{ if(en[k]==null) en[k]='n'; });
    if(ds.bulk==='clear') Object.keys(en).forEach(k=>delete en[k]);
    P.mine.entries=en; changed(); renderBody(); }
});
window.addEventListener('beforeunload',e=>{ if(P.dirty||P.saving){ e.preventDefault(); e.returnValue=''; } });

// ---- boot ----
(async()=>{
  try{ CONFIG = await api('GET','/config'); }catch(e){}
  try{ Object.assign(ME, await api('GET','/me')); if(ME.user) ME.polls=(await api('GET','/me/polls')).polls; }catch(e){}
  const qs=new URLSearchParams(location.search), pid=qs.get('p');
  if(pid){
    const ak=qs.get('admin');
    if(ak){ store.set('admin:'+pid,ak); const list=store.get('myPolls',[]); if(!list.some(x=>x.id===pid)){ list.unshift({id:pid,adminKey:ak,title:'Poll',created:Date.now()}); store.set('myPolls',list); }
      history.replaceState(null,'',`?p=${encodeURIComponent(pid)}`); }
    await openPoll(pid);
    if(P.data&&P.data.isAdmin){ const list=store.get('myPolls',[]); list.forEach(x=>{ if(x.id===pid) x.title=P.data.poll.title; }); store.set('myPolls',list); }
  } else renderHome();
})();
})();
</script>
</body>
</html>
