<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>when-who</title>
<meta name="description" content="Free availability polls: share one link and see when everyone is free. No account needed to answer.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B1F3A">
<script>
// Light/dark: saved choice ("theme" in localStorage) or the system setting. Set before the CSS so there is no flash.
(function(){ var d=document.documentElement, mq=matchMedia('(prefers-color-scheme: dark)'), saved=null;
  try{ saved=JSON.parse(localStorage.getItem('theme')); }catch(e){}
  d.dataset.theme = saved==='dark'||saved==='light' ? saved : (mq.matches?'dark':'light');
  mq.addEventListener&&mq.addEventListener('change',function(e){ var s=null; try{ s=JSON.parse(localStorage.getItem('theme')); }catch(x){}
    if(s!=='dark'&&s!=='light'){ d.dataset.theme=e.matches?'dark':'light'; document.dispatchEvent(new Event('themechange')); } });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ---------- design tokens: navy + blue corporate palette ---------- */
  :root{
    color-scheme:light;
    --brand:#0B1F3A; --brand-2:#132E55; --on-brand:#fff; --on-brand-muted:#A9B8D3;
    --accent:#1F5EFF; --accent-hover:#1849D6; --accent-weak:#E8EFFF; --accent-ink:#1640B8;
    --sel-bg:color-mix(in srgb,var(--accent) 14%,var(--card));
    --bg:#F5F7FB; --card:#fff; --sunken:#F8FAFC; --ink:#0F172A; --ink-2:#334155; --muted:#5B6578;
    --line:#E2E8F0; --line-strong:#CBD5E1; --empty:#EDF1F7;
    --yes:#12A150; --yes-dark:#0B7A3B; --yes-bg:#E3F6EA;
    --maybe:#E8A317; --maybe-ink:#946500; --maybe-bg:#FDF3DC;
    --ifn:#3BA9A0; --ifn-ink:#1F716B; --ifn-bg:#E0F3F1;
    --no:#D64545; --no-bg:#FBE6E6;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r-sm:6px; --r:10px; --r-lg:14px; --radius:var(--r-lg);
    --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
    --shadow:0 4px 14px rgba(15,23,42,.08),0 1px 3px rgba(15,23,42,.05);
    --shadow-pop:0 16px 40px rgba(15,23,42,.18),0 2px 6px rgba(15,23,42,.06);
    --ring:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);
  }
  :root[data-theme="dark"]{ color-scheme:dark;
      --brand:#0A1830; --brand-2:#12284A; --on-brand-muted:#8FA0BF;
      --accent:#4C7DFF; --accent-hover:#6A93FF; --accent-weak:#1A2747; --accent-ink:#A9C0FF;
      --bg:#0E1525; --card:#151E31; --sunken:#111A2C; --ink:#E6EAF2; --ink-2:#C3CBDA; --muted:#94A0B8;
      --line:#26324A; --line-strong:#34425E; --empty:#1E2940;
      --yes:#1FB463; --yes-dark:#5FD38F; --yes-bg:#123526;
      --maybe:#E8A317; --maybe-ink:#F2C25B; --maybe-bg:#3A2E12;
      --ifn:#3BB5AB; --ifn-ink:#6FD3C9; --ifn-bg:#123332;
      --no:#E86A6A; --no-bg:#3D1E22;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 4px 14px rgba(0,0,0,.35); --shadow-pop:0 16px 40px rgba(0,0,0,.5);
  }

  /* ---------- base ---------- */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  h1{font-size:30px;line-height:1.2;margin:0;letter-spacing:-.022em;font-weight:700}
  h2{font-size:18px;line-height:1.3;margin:0;letter-spacing:-.01em;font-weight:650}
  h3{font-size:15px;margin:0;font-weight:600}
  ::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
  :focus-visible{outline:none;box-shadow:var(--ring)}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}
  .sub{color:var(--muted);font-size:14px}
  .desc{margin-top:12px;white-space:pre-wrap;max-width:720px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .row>input.grow{width:auto;min-width:0}
  .hide{display:none!important}
  /* spacing utilities */
  .m0{margin:0!important} .mt-0{margin-top:0!important} .mt-1{margin-top:var(--s1)} .mt-2{margin-top:var(--s2)} .mt-3{margin-top:var(--s3)} .mt-4{margin-top:var(--s4)} .mt-5{margin-top:var(--s5)}
  .mb-3{margin-bottom:var(--s3)} .ml-auto{margin-left:auto} .minw{min-width:170px} .w-auto{width:auto!important}
  .section{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line)}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* ---------- app bar + navy band ---------- */
  .appbar{background:var(--brand);color:var(--on-brand);position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(255,255,255,.06)}
  .appbar-in{max-width:960px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;gap:14px}
  .logo{display:inline-flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;letter-spacing:-.015em}
  .logo:hover{text-decoration:none}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3B7BFF,#1640B8);display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  .logo .mark svg{width:21px;height:15px}
  .acct{margin-left:auto;display:flex;align-items:center;gap:6px}
  .appbar .su-btn{color:#fff;font-weight:600;padding:6px 12px} .appbar .su-btn:hover{background:rgba(255,255,255,.1)}
  .band{background:radial-gradient(1200px 300px at 85% -40%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 70%),linear-gradient(180deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--on-brand);padding:36px 0 76px}
  .band .wrap{padding-bottom:0}
  .band .eyebrow{color:var(--on-brand-muted);display:flex;align-items:center;gap:8px}
  .band h1{color:#fff;margin-top:8px}
  .band .lead{color:#C9D5EA;font-size:16px;max-width:640px;margin:10px 0 0}
  .band .desc{color:#DCE4F2}
  .band .notice{background:rgba(255,255,255,.08);color:#E8EEF8;border-color:rgba(255,255,255,.12);border-left-color:var(--accent)}
  .band .notice.warn{border-left-color:var(--maybe)}
  .band .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}
  .band .seg button{color:#C9D5EA} .band .seg button:hover{color:#fff}
  .band .seg button.on{background:#fff;color:var(--brand)}
  .band+.wrap{margin-top:-52px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.1);color:#E8EEF8;border:1px solid rgba(255,255,255,.08)}
  .chip svg{width:14px;height:14px;opacity:.8}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin-top:var(--s4);box-shadow:var(--shadow-sm)}
  .card{scroll-margin-top:76px}
  .card-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .card-h h2{flex:1}
  .card.accent{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 0 0 4px var(--accent-weak),var(--shadow-sm)}
  .home-grid{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)} /* minmax: long content (e.g. a calendar's email) can't widen the page */
  .home-grid>.card{margin-top:0}
  @media (min-width:900px){ .home-grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start} .home-grid>.span{grid-column:1/-1} }
  .empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:8px 0 4px}

  /* ---------- forms ---------- */
  label{font-weight:600;font-size:13px;display:block;margin-bottom:6px;color:var(--ink-2)}
  .field{margin-top:var(--s4)}
  /* location search: suggestions from OpenStreetMap (Photon) under the input */
  .locbox{position:relative}
  .locsug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-pop);max-height:300px;overflow:auto;padding:4px}
  .locsug button{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;line-height:1.3;background:none;border:0;border-radius:6px;padding:7px 10px;color:var(--ink);cursor:pointer}
  .locsug button span{display:block;font-size:12px;color:var(--muted)}
  .locsug button.on,.locsug button:hover{background:var(--sunken)}
  .locsug.up{top:auto;bottom:calc(100% + 4px)}
  .locsug .attr{font-size:11px;color:var(--muted);padding:4px 10px 2px}
  body:has(.locsug:not([hidden])) .chatdock{display:none} /* the round chat button would cover the list on phones */
  input[type=text],input[type=email],input[type=search],input[type=url],input[type=password],input[type=date],input[type=month],input[type=number],textarea,select{
    font:inherit;font-size:14px;min-height:40px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--ink);width:100%;
    transition:border-color .12s,box-shadow .12s}
  input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
  input:hover,textarea:hover,select:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line-strong))}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  input[type=date],input[type=month]{min-width:0}
  input[readonly]{background:var(--sunken);color:var(--ink-2)}
  textarea{min-height:76px;resize:vertical;line-height:1.45}
  /* email entry: each address becomes a square-ish pill */
  .ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0 8px;border-bottom:1px solid var(--line)}
  /* Add-people popup: a centred card on wide screens, a bottom sheet on phones. Only the list scrolls. */
  .dlg{width:min(520px,calc(100vw - 32px));max-height:min(680px,calc(100dvh - 48px));padding:0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 18px 48px rgba(11,31,58,.28);overflow:hidden}
  .dlg[open]{display:flex;flex-direction:column}
  .dlg::backdrop{background:rgba(11,31,58,.5)}
  .dlg-h{display:flex;align-items:center;gap:8px;padding:12px 12px 0 16px} .dlg-h h2{flex:1;margin:0;font-size:16px;font-weight:700}
  .dlg-b{padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
  .pd-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto auto;gap:6px;align-items:center}
  .pd-add input{min-height:38px;padding:6px 10px}
  .pd-add .padd-btn{width:38px;height:38px;min-height:38px}
  .pd-add .qb{width:38px;height:38px;border-color:var(--line-strong)}
  .pd-imp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .pd-imp .btn{min-height:30px;padding:4px 10px;font-size:13px} .pd-imp .btn svg{width:15px;height:15px}
  .pd-imp .tip{margin-left:auto}
  .pd-q{position:relative} .pd-q svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
  .pd-q input{min-height:36px;padding:6px 10px 6px 32px;font-size:14px}
  .pd-list{flex:1 1 auto;min-height:0;overflow:auto;padding:0 16px 12px;overscroll-behavior:contain}
  .pd-list .cgrp{position:sticky;top:0;z-index:1;background:var(--card);font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 0 4px;display:flex;align-items:center;gap:6px}
  .pd-list .cgrp svg{width:13px;height:13px} .pd-list .cgrp .btn{min-height:26px;padding:2px 8px;font-size:12px;text-transform:none;letter-spacing:0}
  .pd-list .list{margin:0} .pd-list .list li{gap:10px;align-items:center;padding:6px 4px}
  .pd-list .pmain{display:flex;flex-direction:column;min-width:0} .pd-list .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pd-list .acts{flex:none;display:flex;gap:2px} .pd-list .help{padding-top:12px;margin:0}
  .qb.fav[aria-pressed=true] svg{fill:currentColor}
  .pd-list .qb.fav[aria-pressed=true]{background:none;border-color:transparent;color:#E0A100}
  .pplist .qb.fav[aria-pressed=true],.acct-list .qb.fav[aria-pressed=true]{background:none;border-color:transparent;color:#E0A100}
  .pd-add.ct-add,.dlg .padd.cal-f{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
  .dlg-act{display:flex;justify-content:flex-end} .dlg-act .btn{min-width:110px;justify-content:center}
  .dlg-s{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px;margin-top:4px}
  .dlg-s:first-child{margin-top:0} .dlg-s>svg{width:13px;height:13px;flex:none} .dlg-s .tip{text-transform:none;letter-spacing:0;font-weight:400}
  .dlg-conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .dlg-conn .btn{justify-content:center}
  .dlg .pd-list:empty{display:none}
  @media (max-width:560px){
    .dlg{width:100vw;max-width:100vw;max-height:88dvh;margin:auto 0 0;border-radius:16px 16px 0 0;border-bottom:0}
    .dlg-h::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line-strong)}
    .dlg-h{position:relative;padding-top:16px}
    .pd-add{grid-template-columns:minmax(0,1fr) auto auto} .pd-add #pd_n{grid-column:1/-1}
    .pd-add.ct-add,.dlg .padd.cal-f{grid-template-columns:minmax(0,1fr)} .pd-add.ct-add>input,.dlg .padd.cal-f>input{grid-row:auto;grid-column:auto}
    .dlg-act .btn{width:100%}
    .pd-add .padd-btn{grid-row:auto;grid-column:auto;align-self:center;height:38px}
    .pd-imp .bl{display:none} }
  .ptools .padd-btn{margin-left:auto}
  .pplist{margin-top:0}
  .pplist li{flex-wrap:nowrap;align-items:center;gap:10px}
  .pplist li>input[type=checkbox]{flex:none;width:18px;height:18px;margin:0}
  .pplist li.on{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pplist .pmain{display:flex;flex-direction:column;min-width:0}
  .pplist .pname{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-width:0} .pplist .pname b{overflow-wrap:anywhere}
  .pplist .pmain>.small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pplist .acts{flex:none;gap:2px;align-items:center}
  .qb.ok{color:var(--accent)}
  .padd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px;align-items:center;min-width:0}
  .padd input{min-height:38px;padding:6px 10px}
  .padd-new{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .pplist li.pediting{background:var(--sunken)} .pediting .padd{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
  .padd-btn{width:40px;min-height:38px;padding:0} .padd-btn svg{width:18px;height:18px;flex:none}
  @media (max-width:560px){ .padd{grid-template-columns:minmax(0,1fr) auto} .padd input+input{grid-row:2;grid-column:1} .padd-btn{grid-row:1/3;grid-column:2;align-self:stretch;height:auto}
    .pediting .padd{grid-template-columns:minmax(0,1fr)} }
  .em-pill{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-size:13.5px;font-weight:500;line-height:1.3;padding:4px 4px 4px 9px;border-radius:5px;background:var(--accent-weak);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .em-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .em-pill.bad{background:var(--no-bg);color:var(--no);border-color:color-mix(in srgb,var(--no) 40%,transparent)}
  .em-pill button{flex:none;width:20px;height:20px;padding:0;border:0;border-radius:3px;background:transparent;color:inherit;font-size:15px;line-height:1;cursor:pointer;opacity:.7}
  .em-pill button:hover{opacity:1;background:color-mix(in srgb,currentColor 14%,transparent)}
  input[type=number]{width:84px}
  /* day/time pattern picker */
  .patp{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--sunken)}
  .pat-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
  .pat-row.hide{display:none}
  .pat-l{flex:none;width:44px;font-size:13px;font-weight:600;color:var(--muted)}
  .pat-in{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px}
  .pat-in .num-sm{margin:0 2px} .num-sm.dom-in{width:42px!important;padding-inline:4px;text-align:center}
  .wdchips{display:inline-flex;flex-wrap:wrap;gap:4px}
  .wdc{font:inherit;font-size:13px;font-weight:600;width:38px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);color:var(--muted);cursor:pointer;transition:background .12s,color .12s,border-color .12s}
  .wdc:hover{border-color:var(--accent);color:var(--ink)}
  .wdc.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pat-pre{display:inline-flex;flex-wrap:wrap;gap:4px}
  .pat-pre button{font:inherit;font-size:12.5px;font-weight:550;line-height:1.2;border:1px solid var(--line-strong);border-radius:999px;background:var(--card);padding:3px 10px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
  .pat-pre button:hover{border-color:var(--accent);color:var(--ink)}
  .pat-pre button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-ink)}
  /* the grey box: filters on top, then (under a line) what to do with them */
  .pat-act{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
  .pat-act .pat-sum{padding-top:0}
  .pat-sum{font-size:13.5px;font-weight:600;color:var(--ink);padding-top:2px}
  .qf{margin-top:var(--s2)}
  .aif{margin-top:var(--s2)}
  .aif .patp{gap:8px;padding:10px 12px}
  .aif textarea{width:100%;box-sizing:border-box;min-height:96px}
  .aif-go{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .aif-go .btn svg{width:15px;height:15px}
  .aif-msg{font-size:13px} .aif-msg.err{color:var(--no)}
  .aif-clr{margin-left:auto} .aif-clr[hidden]{display:none}
  .boxh{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--ink)} .boxh>svg{width:16px;height:16px;flex:none;color:var(--accent)}
  .cal-in{flex:1 1 260px;min-width:0}
  .pat-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:500}
  .em-pill .pat-brush{display:inline-flex;align-items:center;gap:4px;width:auto;height:auto;min-width:0;padding:0;font:inherit;opacity:1;overflow:hidden}
  .em-pill .pat-brush:hover{background:none;text-decoration:underline}
  .pat-keys{margin-left:auto}
  .pat-keys kbd{font:inherit;font-size:11.5px;padding:0 4px;border:1px solid var(--line,currentColor);border-radius:3px}
  @media (hover:none){ .pat-keys{display:none} }
  .pat-chips .em-pill .dot{flex:none;display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:2px}
  .pat-chips .em-pill.draft{border-style:dashed;background:transparent;padding-right:9px}
  /* quick fill rules: the one being built, then the stack (top first, lower wins) */
  .qf-draft{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;min-height:30px}

<script>
(function(){
'use strict';
const $app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const TOUCH = !!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const store0 = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
// ---------- language ----------
// LANG: 'de' when chosen (language picker, saved as "lang"; System default removes it) or, by default, when the browser is German; else 'en'.
// t('English text',{x}) gives the German text from DE (germanText() at the end of the script) with {x} placeholders replaced.
// Every user-visible string goes through t(); a missing German entry falls back to English.
const LANG = (l => l==='de'||l==='en' ? l : ((navigator.language||'').toLowerCase().startsWith('de')?'de':'en'))(store0('lang'));

const DE = LANG==='de' ? germanText() : {}; // germanText() is at the end of the script
const t = (s,v) => { let r=(LANG==='de'&&DE[s])||s; if(v) r=r.replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m); return r; };

document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-setlang]'); if(b){ e.preventDefault(); setLang(b.dataset.setlang); } });
// Server error messages are English; translate the fixed ones (in DE) and the ones with variable parts (patterns below).
const ERR_DE = [
  [/^At most (\d+) quick fill rules$/, (m,n)=>`Höchstens ${n} Regeln für Schnell ausfüllen`],
  [/^(.+) needs an email address$/, (m,n)=>`${n} braucht eine E-Mail-Adresse`],
  [/^You can have at most (\d+) favourites$/, (m,n)=>`Du kannst höchstens ${n} Favoriten haben`],
  [/^Allow when-who to read your (Google|Outlook) contacts$/, (m,p)=>`Erlaube when-who, deine ${p}-Kontakte zu lesen`],
  [/^(.+) is required$/, (m,f)=>`${t(f)}: Pflichtfeld`],
  [/^(.+) must be text$/, (m,f)=>`${t(f)}: muss Text sein`],
  [/^(.+) is too long \(max (\d+) characters\)$/, (m,f,n)=>`${t(f)} ist zu lang (max. ${n} Zeichen)`],
  [/^(.+): that address doesn’t look right$/, (m,f)=>`${t(f)}: Diese Adresse sieht nicht richtig aus`],
  [/^Too many emails\. Try again in (\d+) minutes\.$/, (m,n)=>`Zu viele E-Mails. Versuch es in ${n} Minuten noch einmal.`],
  [/^Too many sign-in emails\. Try again in (\d+) minutes\.$/, (m,n)=>`Zu viele Anmelde-E-Mails. Versuch es in ${n} Minuten noch einmal.`],
  [/^Too many attempts\. Try again in (\d+) minutes\.$/, (m,n)=>`Zu viele Versuche. Versuch es in ${n} Minuten noch einmal.`],
  [/^You can have at most (\d+) polls\. Delete an old one first\.$/, (m,n)=>`Du kannst höchstens ${n} Umfragen haben. Lösch zuerst eine alte.`],
  [/^Daily email limit reached \((\d+) recipients\)\. Try again tomorrow\.$/, (m,n)=>`Tageslimit für E-Mails erreicht (${n} Empfänger). Versuch es morgen wieder.`],
  [/^Request failed \((\d+)\)$/, (m,n)=>`Anfrage fehlgeschlagen (${n})`],
  [/^At most (\d+) calendar links per account$/, (m,n)=>`Höchstens ${n} Kalender-Links pro Konto`],
  [/^Too many calendar requests\. Try again in (\d+) minutes\.$/, (m,n)=>`Zu viele Kalender-Abrufe. Versuch es in ${n} Minuten noch einmal.`],
  [/^Too many calendar imports\. Try again in (\d+) minutes\.$/, (m,n)=>`Zu viele Kalender-Importe. Versuch es in ${n} Minuten noch einmal.`],
  [/^You can fill from text (\d+) times a day\. Try again tomorrow\.$/, (m,n)=>`Du kannst ${n}-mal am Tag per Text ausfüllen. Versuch es morgen wieder.`],
  [/^Too many tries\. Try again in (\d+) minutes\.$/, (m,n)=>`Zu viele Versuche. Versuch es in ${n} Minuten noch einmal.`],
  [/^Reconnect your (.+) calendar$/, (m,p)=>`Verbinde deinen ${p}-Kalender neu`],
  [/^Couldn’t reach (.+)\. Try again later\.$/, (m,p)=>`${p} ist nicht erreichbar. Versuch es später noch einmal.`],
  [/^(.+) answered with an error \((\d+)\)$/, (m,p,n)=>`${p==='The calendar link'?'Der Kalender-Link':p} hat mit einem Fehler geantwortet (${n})`],
];
function tErr(msg){ if(LANG!=='de'||!msg) return msg; if(DE[msg]) return DE[msg];
  for(const [re,f] of ERR_DE){ const m=String(msg).match(re); if(m) return f(...m); } return msg; }
const WD = LANG==='de' ? ['Mo','Di','Mi','Do','Fr','Sa','So'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const EMAIL_RE = /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast(t('Copied')); }catch(e){ prompt(t('Copy this:'), text); } }
const origin = location.origin + location.pathname.replace(/index\.html$/,'');
const shareLink = id => `${origin}?p=${id}`;
// ---- People list (People tab and the "Poll created" screen): everyone in the poll plus an add row ----
// "anna.m-b@x.com" -> "Anna M B"
const nameFromEmail = e => e.split('@')[0].split(/[._+\-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ').slice(0,60) || e.split('@')[0].slice(0,60);
// Accepts "Anna", "ben@x.com", "Carl <carl@x.com>", "Dora dora@x.com", "Eve, eve@x.com" and lists of them
// (one per line, or separated by commas or semicolons). A name directly followed by an address on the same line pairs up.
function parsePeople(raw){
  const out=[];
  String(raw||'').split(/\r?\n/).forEach(line=>{ let prevName=null;
    line.split(/[,;\t]+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
      let m=tok.match(/^"?(.*?)"?\s*<([^<>\s]+)>$/)||tok.match(/^(.+?)\s+(\S+@\S+)$/);
      if(m&&m[2].includes('@')&&!m[1].includes('@')){ out.push({name:m[1].trim().slice(0,60)||(EMAIL_RE.test(m[2])?nameFromEmail(m[2]):''),email:m[2].toLowerCase()}); prevName=null; return; }
      tok=tok.replace(/^<|>$/g,'');
      if(EMAIL_RE.test(tok)||tok.includes('@')){ const e=tok.toLowerCase();
        if(prevName&&!prevName.email){ prevName.email=e; prevName=null; } else out.push({name:EMAIL_RE.test(e)?nameFromEmail(e):'',email:e}); return; }
      prevName={name:tok.slice(0,60),email:''}; out.push(prevName);
    }); });
  return out;
}
const pollHeaders = id => id===P.id ? headers() : (store.get('pw:'+id,null) ? {'x-poll-password':store.get('pw:'+id,null)} : {});
const plural = (n,one,many) => `${n} ${n===1?one:many}`;
// The ready-to-send invite text (Share, Copy message, WhatsApp, email): what, when, reply-by and the link.
function pollShareText({id,title,description,range,deadline},greet){
  const desc=String(description||'').trim().replace(/\s+\n/g,'\n'), d=desc.length>300?desc.slice(0,299).trimEnd()+'…':desc;
  return [greet?t('Hi,')+'\n':'', t('When are you free? Please mark your availability for “{title}” here:',{title}),
    d?'\n'+d+'\n':'', range?'📅 '+range:'', deadline?'⏰ '+t('Please answer by {date}.',{date:longDay(deadline)}):'',
    '', shareLink(id), t('No account needed, just open the link.')].filter((x,i,a)=>x!==''||(i>0&&a[i-1]!=='')).join('\n').trim();
}
const inviteSubject = title => t('When are you free?')+' '+title;
// Share / Copy message buttons for a linkbox. The phone share sheet when there is one, else WhatsApp + email links.
function shareBtns(info,noCopy){
  const msg=pollShareText(info);
  return (noCopy?'':ib('note',t('Copy message'),`data-copy="${esc(msg)}"`,'',''))
    +(navigator.share?ib('share',t('Share…'),`data-nshare="${esc(msg)}" data-ntitle="${esc(info.title)}"`,'','')
      :ibl('chat',t('Share via WhatsApp'),'https://wa.me/?text='+encodeURIComponent(msg),'','')
       +ibl('mail',t('Send by email'),`mailto:?subject=${encodeURIComponent(inviteSubject(info.title))}&body=${encodeURIComponent(msg)}`,'',''));
}
function pollInviteMail(id,title,deadline,raw,info){
  const parts=(raw||'').split(/[\s,;]+/).map(x=>x.replace(/^<|>$/g,'').trim()).filter(Boolean);
  const ok=[...new Set(parts.filter(x=>EMAIL_RE.test(x)).map(x=>x.toLowerCase()))], bad=parts.filter(x=>!EMAIL_RE.test(x));

  return { ok, bad, href:`mailto:?${ok.length?'bcc='+encodeURIComponent(ok.join(','))+'&':''}subject=${encodeURIComponent(inviteSubject(title))}&body=${encodeURIComponent(body)}` };
}

async function api(method, path, body, headers={}){
  const res = await fetch('/api'+path, { method, headers:Object.assign({'content-type':'application/json','x-lang':LANG},headers), body: body?JSON.stringify(body):undefined });
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error(tErr(data.error||('Request failed ('+res.status+')'))); err.status=res.status; err.data=data; throw err; }
  return data;

// ---------- dates ----------
const parseD = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const dayLabel = k => parseD(k).toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short'});
const longDay = k => parseD(k).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const monthLabel = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(LOC,{month:'long',year:'numeric'}); };
const wdOf = k => (parseD(k).getDay()+6)%7;
const isoL = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDaysL = (k,n) => { const d=parseD(k); d.setDate(d.getDate()+n); return isoL(d); };

// A square/round tile: picture (with fallback underneath), emoji, or initial on a colour.
function tile({img,emoji,text,seed},cls=''){
  const base = emoji ? `<span class="tile-e">${esc(emoji)}</span>` : `<span class="tile-i" style="--t:${tintOf(seed||text)}">${initialOf(text)}</span>`;
  return `<span class="tile ${cls}${emoji?' has-e':''}">${base}${img?`<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
}

function pickerResults(key){

async function resizeImage(file,size){
  if(!/^image\//.test(file.type)) throw new Error(t('Pick a picture file (JPEG, PNG or WebP).'));
  let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ throw new Error(t('This picture format isn’t supported. Try a JPEG or PNG.')); }
  const sq=Math.min(bmp.width,bmp.height), c=document.createElement('canvas'); c.width=c.height=size;
  c.getContext('2d').drawImage(bmp,(bmp.width-sq)/2,(bmp.height-sq)/2,sq,sq,0,0,size,size);
  let type='image/webp', q=.86, url=c.toDataURL(type,q);
  if(!url.startsWith('data:image/webp')){ type='image/jpeg'; url=c.toDataURL(type,q); }
  while(url.length>140000&&q>.35){ q-=.12; url=c.toDataURL(type,q); }
  if(url.length>140000) throw new Error(t('That picture is too large. Try a smaller one.'));
  return url;
}

const DEMO_PEOPLE=[['Ana','y.myy.i'],['Ben','myyy..y'],['Chloé','yyiym..'],['Dev','.yyyym.'],['Eli','y.yyy.m']];

let demoTimer=0;
function startLandingDemo(){
  clearTimeout(demoTimer);
  const demo=$('demo'); if(!demo) return;
  const n=DEMO_PEOPLE.length, cal=$('demoCal'), bl=$('demoBl'), cnt=$('demoCount');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Same counting as stats(): free = available + if needed; peakIfn = how many of those only "if needed".
  const S=()=>WD.map(()=>({peak:0,peakIfn:0,peakMaybe:0}));
  let st=S();
  const add=(i,j)=>{ const a=DEMO_PEOPLE[i][1][j], s=st[j]; if(a==='y'||a==='i') s.peak++; if(a==='i') s.peakIfn++; if(a==='m') s.peakMaybe++; return a!=='.'; };
  const cell=j=>heatDay(DEMO_START+j,st[j],n,`data-c="${j}"`);
  const draw=()=>{ cal.innerHTML=WD.map(w=>`<div class="wd">${w}</div>`).join('')+WD.map((_,j)=>cell(j)).join(''); };
  const redraw=j=>{ const old=cal.querySelector(`[data-c="${j}"]`); old.outerHTML=cell(j); cal.querySelector(`[data-c="${j}"]`).classList.add('pop'); };
  const best=()=>{ const r=WD.map((w,j)=>({j,s:st[j]})).filter(o=>o.s.peak>0)
      .sort((a,b)=>b.s.peak-a.s.peak||a.s.peakIfn-b.s.peakIfn||b.s.peakMaybe-a.s.peakMaybe||a.j-b.j).slice(0,3);
    bl.innerHTML=r.length?r.map(o=>bestLi(o.s,n,`${WDL[o.j]} ${DEMO_START+o.j}`,[t('all day'),o.s.peakIfn?t('{n} if needed',{n:o.s.peakIfn}):'',o.s.peakMaybe?t('+{n} maybe',{n:o.s.peakMaybe}):''].filter(Boolean).join(' · '))).join('')
      :'<li class="muted small">'+t('Once people respond, the best days show up here.')+'</li>'; };
  const who=(i,c)=>demo.querySelector(`.demo-p[data-r="${i}"]`).classList.add(c);
  const reset=()=>{ st=S(); draw(); best(); demo.querySelectorAll('.demo-p').forEach(x=>x.classList.remove('on','done')); demo.classList.remove('best'); cnt.textContent=t('{a}/{b} answered',{a:0,b:n}); };
  const finish=()=>{ st=S(); DEMO_PEOPLE.forEach((_,i)=>{ WD.forEach((_,j)=>add(i,j)); who(i,'done'); }); draw(); best(); cnt.textContent=t('{a}/{b} answered',{a:n,b:n}); demo.classList.add('best'); };
  reset(); best();
  if(reduce){ finish(); return; }
  const steps=[]; DEMO_PEOPLE.forEach((_,i)=>{ steps.push(['on',i]); WD.forEach((_,j)=>{ if(DEMO_PEOPLE[i][1][j]!=='.') steps.push(['cell',i,j]); }); steps.push(['done',i]); });
  let k=0;
  const tick=()=>{
    if(!document.body.contains(demo)) return;            // navigated away
    if(document.hidden){ demoTimer=setTimeout(tick,600); return; }
    if(k>=steps.length){ best(); demo.classList.add('best'); demoTimer=setTimeout(()=>{ reset(); k=0; demoTimer=setTimeout(tick,900); },4800); return; }
    const [ty,i,j]=steps[k++];
    if(ty==='on'){ who(i,'on'); demoTimer=setTimeout(tick,380); return; }
    if(ty==='cell'){ add(i,j); redraw(j); demoTimer=setTimeout(tick,150); return; }
    demo.querySelector(`.demo-p[data-r="${i}"]`).classList.replace('on','done'); cnt.textContent=t('{a}/{b} answered',{a:i+1,b:n}); best(); demoTimer=setTimeout(tick,450);
  };
  demoTimer=setTimeout(tick,700);
}

      if(v==='weekly'&&getR('ans')==='days') f.querySelector('[data-for="ans"] [data-sans="slots"]').click(); }
    if(n==='ans') patShowHours('np',getR('ans')!=='days');
    if(n==='kind') patRefresh('np');
    sum(); });
  // The picker re-renders itself on every change (emoji, upload, clear), so watch it.
  new MutationObserver(sum).observe($('pk_new'),{childList:true});
  // Days matching the pattern in [st,en], for the picker's count and warnings.
  const daysIn=(st,en,pat)=>{ let n=0; if(!st||!en||en<st) return 0; for(let k=st,i=0;k<=en&&i<400;k=addDaysL(k,1),i++) if(matchPat(k,pat)) n++; return n; };
  const firstRound=()=>{ const s=seriesSettings(); return /^\d{4}-\d{2}-\d{2}$/.test(s.anchor)?[seriesStart(s,0),addDaysL(seriesStart(s,1),-1)]:null; };
  PAT.np.count=v=>{ if(getR('kind')==='weekly'){ const n=v.pat&&v.pat.wd?v.pat.wd.length:7; return n===1?t('{n} day a week',{n}):t('{n} days a week',{n}); }
    if(getR('kind')==='single'){ const n=daysIn($('start').value,$('end').value,v.pat); return n?(n===1?t('{n} day in this poll',{n}):t('{n} days in this poll',{n})):t('no days in this range match'); }
    const r=firstRound(); if(!r) return ''; const n=daysIn(r[0],r[1],v.pat); return n?(n===1?t('{n} day in the first round',{n}):t('{n} days in the first round',{n})):t('no days in the first round match'); };
  $('pat_np').addEventListener('patchange',sum);
  f.addEventListener('input',e=>{ if(['start','end','every','first'].includes(e.target.id)) patRefresh('np'); });
  f.addEventListener('change',e=>{ if(e.target.id==='unit') patRefresh('np'); });
  patRefresh('np');
  sum(); $('title').focus();

  f.onsubmit=async e=>{
    e.preventDefault(); const v=id=>$(id).value, err=$('ferr'); err.textContent='';
    const kind=getR('kind'), ans=getR('ans');
    const fail=(msg,id)=>{ err.textContent=msg; if(id){ const el=$(id), pk=el.closest('.dpk'); if(pk) dpkOpen(pk.id.slice(4)); el.focus(); } return false; };
    const check=()=>{
      if(!v('title').trim()) return fail(t('Give the poll a title.'),'title');
      if(kind==='single'){
        if(!v('start')||!v('end')) return fail(t('Pick the first and last day.'), v('start')?'end':'start');
        if(v('end')<v('start')) return fail(t('The last day is before the first day.'),'end');
        if(v('dl')&&v('dl')>v('end')) return fail(t('The reply-by date is after the last day.'),'dl');
      } else if(kind==='series'&&!v('first')) return fail(t('Pick when the series starts.'),'first');
      const pv=patValue('np'); if(pv.empty) return fail(t('Add at least one rule.'));
      if(kind==='single'&&!daysIn(v('start'),v('end'),pv.pat)) return fail(t('None of the days in this range match the chosen days.'));
      return true; };
    if(!check()) return;
    const body={ title:v('title').trim(), description:v('desc'), kind, answerMode:ans, hourStart:patValue('np').hs, hourEnd:patValue('np').he, dayPattern:patValue('np').pat,
      hideResults:$('hide').checked, allowComments:$('n_com').checked, requireEmail:$('n_reqmail').checked, password:v('pw')||undefined };
    if($('n_invonly').checked) body.invitedOnly=true;
    const pk=pickerValue('new'); body.icon=pk.emoji; if(pk.image) body.image=pk.image;
    if(kind==='series'){ Object.assign(body,{unit:v('unit'), every:+v('every'), firstStart:v('first'), openDays:+v('openDays'), deadlineDays:v('dlDays')===''?null:+v('dlDays')}); }
    else if(kind==='weekly'){ body.deadline=v('dlw')||null; }
    else { body.startDate=v('start'); body.endDate=v('end'); body.deadline=v('dl')||null; }
    if(mail){ body.notifyOpen=kind==='series'&&$('notify').checked; body.remindDays=$('remind').checked&&v('remindDays')!==''?+v('remindDays'):null; }
    const btns=f.querySelectorAll('button[type=submit]'); btns.forEach(b=>b.disabled=true);
    try{
      const r=await api('POST','/polls',body);
      if(body.password) store.set('pw:'+r.id, body.password);
      renderCreated(r.id, body, kind);
      try{ ME.polls=(await api('GET','/me/polls')).polls; }catch(e){}
    }catch(ex){ err.textContent=ex.message; btns.forEach(b=>b.disabled=false); }
  };
}

const CALUI={edit:null};

// FRIENDS: GET /me/friends result { favourites, contacts, friends, … }, loaded once per page. The page shows it as
// contacts: favourites, people from your polls (guests added by email + accounts that were friends) and imported ones.
let FRIENDS=null;
async function loadFriends(force){
  if(!ME.user) return null;
  if(FRIENDS&&!force) return FRIENDS;
  if(loadFriends._p&&!force) return loadFriends._p;
  loadFriends._p=api('GET','/me/friends').then(r=>(FRIENDS=r)).catch(()=>null).finally(()=>{ loadFriends._p=null; });
  return loadFriends._p;
}
// The contacts engine, shared by the Account page's Contacts card and the Add-people popup.
// contactKeep(q,skip): filter for search text, duplicates (first group wins) and skip(f,key) (e.g. already in the poll).
function contactKeep(q,skip){
  const seen=new Set(); q=String(q||'').trim().toLowerCase();
  return f=>{ const k=f.email?f.email.toLowerCase():'n:'+f.name.toLowerCase();
    if(seen.has(k)||(skip&&skip(f,k))) return false;
    if(q&&!(f.name||'').toLowerCase().includes(q)&&!(f.email||'').toLowerCase().includes(q)) return false; seen.add(k); return true; };
}
// [{ic,title,list,imp}]: Favourites, From your polls, Imported (imported = this page's list).
function contactGroups(imported,keep){
  const F=FRIENDS||{};
  return [{ic:'star',title:t('Favourites'),list:(F.favourites||[]).map(f=>({name:f.name,email:f.email}))},
    {ic:'users',title:t('From your polls'),list:[...(F.friends||[]).map(f=>({...f,name:displayName(f),friend:true})),...(F.contacts||[])]},
    {ic:'upload',title:t('Imported'),list:imported,imp:true}].map(g=>({...g,list:g.list.filter(keep)}));
}
// Group headers + rows. items collects the people shown (rows refer to them by index), acts(f,i) = the row's buttons,
// head(g) = extra buttons in a group header.
function contactListHtml(groups,items,acts,head){
  let h='';
  for(const g of groups){ if(!g.list.length) continue;
    h+=`<div class="cgrp">${ICON[g.ic]}<span class="grow">${esc(g.title)} <span class="muted">(${g.list.length})</span></span>${head?head(g):''}</div><ul class="list">`
      +g.list.slice(0,300).map(f=>{ const i=items.push(f)-1;
        return `<li>${avatarOf(f)}<span class="grow pmain"><b class="ell">${esc(f.name)}</b>${f.email?`<span class="muted small ell">${esc(f.email)}</span>`:''}</span>
          <span class="acts">${acts(f,i)}</span></li>`; }).join('')+'</ul>'; }
  return h;
}
// Import buttons (phone, vCard file, Google / Outlook); attr = the data attribute the clicks are caught by.
function contactImportButtons(attr){
  const prov=Object.assign({google:false,microsoft:false},CONFIG.calProviders||{});
  const imp=(k,ic,label)=>`<button type="button" class="btn sm withic" ${attr}="${k}" title="${esc(label)}" aria-label="${esc(label)}">${ic}<span>${esc(k==='google'?'Google':k==='microsoft'?'Outlook':k==='phone'?t('Phone'):'vCard')}</span></button>`;
  return `${canPhone()?imp('phone',ICON.users,t('Pick people from your phone’s contacts')):''}
    ${imp('vcf',ICON.upload,t('Pick a .vcf file exported from your contacts app (iPhone, Mac, Android, Outlook)'))}
    ${ME.user&&prov.google?imp('google',ICON.cal,t('Your Google contacts (asks Google for permission the first time)')):''}
    ${ME.user&&prov.microsoft?imp('microsoft',ICON.cal,t('Your Outlook contacts (asks Microsoft for permission the first time)')):''}`;
}
// Imported contacts → st.imported (deduplicated by email, or by name when there is none), then render().
function addImported(st,list,src,render){
  const have=new Set(st.imported.map(x=>x.email||'n:'+x.name.toLowerCase())); let n=0;
  for(const c of list){ const email=String(c.email||'').trim().toLowerCase(), name=String(c.name||'').trim().slice(0,60)||(email&&EMAIL_RE.test(email)?nameFromEmail(email):'');
    if(!name||(email&&!EMAIL_RE.test(email))) continue; const k=email||'n:'+name.toLowerCase(); if(have.has(k)) continue; have.add(k); st.imported.push({name,email}); n++; }
  st.imported.sort((a,b)=>a.name.localeCompare(b.name,LOC));
  toast(n?t('{n} contacts imported from {src}',{n,src}):t('No new contacts found in {src}',{src}));
  render(); return n;
}
// One import source into st (PD or CT). fileId = that view's hidden file input; ret = poll id to come back to after
// a Google / Outlook sign-in (none = back to the Account page, which picks the import up again via sessionStorage).
async function importContacts(k,btn,st,render,fileId,ret){
  if(k==='vcf'){ $(fileId).click(); return; }
  if(k==='phone'){
    try{ const r=await navigator.contacts.select(['name','email'],{multiple:true});
      addImported(st,r.flatMap(c=>{ const name=(c.name||[])[0]||''; return (c.email||[]).length?c.email.map(e=>({name,email:e})):[{name,email:''}]; }),t('your phone'),render); }
    catch(e){ if(e&&e.name!=='AbortError') toast(t('Couldn’t open your contacts')); }
    return; }
  // Google / Outlook: every connected account of that provider that allows reading contacts; otherwise ask for it.
  const pn=k==='google'?'Google':'Outlook';
  if(btn) btn.disabled=true; st.busy=t('Loading contacts from {src}…',{src:pn}); render();
  try{ CALS.list=null; const r=await loadCals(); const accts=((r&&r.accounts)||[]).filter(a=>a.provider===k&&a.status==='ok');
    const ok=accts.filter(a=>a.contacts);
    if(!ok.length){ const hint=accts.length===1&&accts[0].email?'&hint='+encodeURIComponent(accts[0].email):'';
      if(!btn||confirm(t('when-who will ask {src} for permission to read your contacts. They are only shown to you here and never saved. Continue?',{src:pn}))){
        if(!ret) try{ sessionStorage.setItem('ct_import',k); }catch(e){}
        location.href=`/api/oauth/${k}/start?contacts=1${ret?'&ret='+encodeURIComponent(ret):''}${hint}`; }
      return; }
    const all=[]; for(const a of ok){ const d=await api('GET','/me/contacts/'+encodeURIComponent(a.id)); all.push(...(d.contacts||[])); }
    st.busy=''; addImported(st,all,pn,render); }
  catch(ex){ toast(ex.message); }
  finally{ st.busy=''; if(btn) btn.disabled=false; render(); }
}

async function contactAdd(btn){
  const n=$('ct_n'), m=$('ct_e'), err=$('ct_err'); if(!n) return; err.textContent='';

// Star every imported contact with an email (one request each; stops at the first error, e.g. the favourites cap).
async function ctStarAll(btn){

// ---- entry helpers: 'y' | 'i' | 'm' | {y:[h],i:[h],m:[h]}. Anything not marked counts as not available.
// 'i' = "if needed": free, but not preferred. It counts as available, ranked below 'y' and above 'm'.
// Old answers may still hold 'n' / {n:[h]} (an explicit "can't"); it is treated like blank.
// hours(k): the hours offered on day k. A poll with several periods (weekdays 17-22, weekends 10-22) offers
// each day only the hours of its own periods; without k (or without periods) it's the poll's whole range.
function hours(k){ const p=P.data.poll, H=Array.from({length:p.hourEnd-p.hourStart},(_,i)=>p.hourStart+i);
  const ps=k&&p.dayPattern&&p.dayPattern.periods?p.dayPattern.periods.filter(x=>matchDay(k,x)):null;
  return ps&&ps.length?H.filter(h=>ps.some(x=>h>=x.hs&&h<x.he)):H; }
function hourMap(v,k){
  const H=hours(k), map=new Map(), ok=new Set(H);
  if(v==='y'||v==='i'||v==='m') H.forEach(h=>map.set(h,v));
  else if(Array.isArray(v)) v.forEach(h=>ok.has(h)&&map.set(h,'y'));
  else if(v&&typeof v==='object') ['m','i','y'].forEach(s=>(v[s]||[]).forEach(h=>ok.has(h)&&map.set(h,s)));
  return map;
}
function fromMap(map,k){
  const H=hours(k), o={y:[],i:[],m:[]};
  H.forEach(h=>{ const s=map.get(h); if(s==='y'||s==='i'||s==='m') o[s].push(h); });
  for(const s of ['y','i','m']) if(o[s].length===H.length) return s;
  if(!o.y.length&&!o.i.length&&!o.m.length) return null;
  if(!o.i.length) delete o.i;
  return o;
}
const isPartial = v => Array.isArray(v)||(v&&typeof v==='object');
// Drops old explicit "can't" marks from my own answer, so saving rewrites it without them.
function cleanEntries(en){ const o={}; for(const k in en||{}){ const x=fromMap(hourMap(en[k],k),k); if(x!=null) o[k]=x; } return o; }
function counts(v,k){ const H=hours(k), c={y:0,i:0,m:0,e:0}; const map=hourMap(v,k); H.forEach(h=>{ const s=map.get(h); c[s||'e']++; }); return c; }
// A 0–24:00 timeline of one person's day: each run of hours sits where it is in the day (20–24 h = green at the right end).
function ratioBar(v,k){ const c=counts(v,k), runs=[]; let cur=null;
  [...hourMap(v,k)].sort((a,b)=>a[0]-b[0]).forEach(([h,x])=>{ if(!'yim'.includes(x)) return; if(cur&&cur.s===x&&cur.e===h) cur.e=h+1; else runs.push(cur={s:x,b:h,e:h+1}); });
  return `<div class="ratio tl" title="${esc(partialText(v,k))} · ${t('{n}h available',{n:c.y})}${c.i?' · '+t('{n}h if needed',{n:c.i}):''}${c.m?' · '+t('{n}h maybe',{n:c.m}):''}">${runs.map(r=>`<i class="r${r.s}" style="left:${r.b/24*100}%;width:${(r.e-r.b)/24*100}%"></i>`).join('')}</div>`; }
function hoursOf(v,s,k){ return [...hourMap(v,k)].filter(([h,x])=>x===s).map(([h])=>h).sort((a,b)=>a-b); }
function partialText(v,k){ const y=hoursOf(v,'y',k), i=hoursOf(v,'i',k), m=hoursOf(v,'m',k); return [y.length?hoursText(y):'', i.length?t('if needed {h}',{h:hoursText(i)}):'', m.length?t('maybe {h}',{h:hoursText(m)}):''].filter(Boolean).join(' · ') || t("can't"); }
function statusOf(v,k){
  if(v==='y') return {t:t('Available'),c:'var(--yes-dark)',cls:'y'};
  if(v==='i') return {t:t('If needed'),c:'var(--ifn-ink)',cls:'i'};
  if(v==='m') return {t:t('Maybe'),c:'var(--maybe-ink)',cls:'m'};
  if(isPartial(v)&&fromMap(hourMap(v,k),k)!=null) return {t:partialText(v,k),c:'var(--ink)',cls:'part'};
  return {t:'',c:'var(--muted)',cls:''};
}
// availability of a person for a window [start,end) on a day: 'y' all hours available, 'i' all available or if needed,
// 'm' none unavailable but some maybe, 'x' otherwise
function windowStatus(v,start,end,allDay,k){
  if(v==null) return 'x';
  if(v==='y'||v==='i'||v==='m') return v; if(!isPartial(v)) return 'x';
  const map=hourMap(v,k), H=hours(k); const span=allDay?H:H.filter(h=>h>=start&&h<end);
  if(!span.length) return 'x';
  const st=span.map(h=>map.get(h));
  if(st.every(s=>s==='y')) return 'y';
  if(st.every(s=>s==='y'||s==='i')) return 'i';
  if(st.every(s=>s&&s!=='n')) return 'm';
  return 'x';
}

// ---- saving ----
// Invited-only polls: '' = may answer, 'signin' = signed out, 'not' = this account isn't invited. The owner always may.
function inviteLock(){ const d=P.data, p=d&&d.poll; if(!p||!p.invitedOnly||d.isAdmin) return ''; if(!ME.user) return 'signin'; return d.me&&d.me.invited?'':'not'; }
function editable(){ return P.data && inst().status==='open' && !inviteLock(); }
function status(t){ saveBar(t); }
// The send/update bar under the calendar. Answers are only sent when the button is pressed.
function saveBar(msg){
  const bar=$('savebar'); if(!bar) return;
  bar.classList.toggle('hide', P.tab!=='mine' && !P.dirty && !P.saving);
  bar.classList.toggle('dirty', P.dirty);
  const btn=$('saveBtn');
  btn.innerHTML = ICON.send+(P.saving ? `<span>${t('Sending…')}</span>` : `<span>${P.myResp?t('Update<span class="bl"> answer</span>'):t('Send<span class="bl"> answer</span>')}</span>`);
  btn.disabled = P.saving || !P.dirty;
  // Short status (icon + a few words); the full sentence is the tooltip.
  const named=P.mine.name.trim(), st = msg!=null ? (/^Saved/.test(msg)?'ok':'err') : P.dirty ? 'dirty' : P.myResp ? 'ok' : 'idle';
  const [short,long] = msg!=null ? [t(msg),t(msg)]
    : P.dirty ? (named ? (P.myResp?[t('Unsent changes'),t('You have changes that aren’t sent yet')]:[t('Not sent'),t('Not sent yet')]) : [t('Add your name'),t('Enter your name, then send')])
    : P.myResp ? [t('Saved'),t('Your answer is saved')] : [t('Not answered'),t('Mark your availability, then send your answer')];
  const s=$('status'); s.className='sstat '+st; s.title=long;
  s.innerHTML=`${st==='ok'?ICON.check:'<i class="sdot"></i>'}<span>${esc(short.replace(/ ✓$/,''))}</span>`;
  const dm=$('delMine'); if(dm) dm.classList.toggle('hide',!P.myResp||P.saving);
}
function changed(){
  if(!editable()) return;
  P.dirty=true; saveBar();
}
async function save(retried){
  if(P.saving||!P.dirty) return false;
  if(!P.mine.name.trim()){ if(P.tab!=='mine'){ P.tab='mine'; renderBody(); } saveBar('Enter your name first'); const nm=$('name'); if(nm) nm.focus(); return false; }
  if(!ME.user&&P.data.poll.requireEmail&&!EMAIL_RE.test((P.mine.email||'').trim())){ if(P.tab!=='mine'){ P.tab='mine'; renderBody(); } saveBar('Enter your email address first'); const em=$('email'); if(em) em.focus(); return false; }
  P.saving=true; P.dirty=false; saveBar();
  const em=(P.mine.email||'').trim(), key=respKey(), had=!!P.myResp;
  const body={name:P.mine.name, email:EMAIL_RE.test(em)?em:'', comment:P.mine.comment, entries:P.mine.entries,
    fill:qfActive()?{rules:P.qfApplied.map(r=>({pat:r.pat||null,hs:r.hs,he:r.he,st:r.st||'y',...(r.off?{off:true}:{})})),...qfLayersNow()}:null};
  let msg, retry=false, ok=false;
  try{
    if(P.myResp){ const r=await api('PUT',`/polls/${P.id}/responses/${P.myResp.id}`,body,headers());
      if(!P.myResp.account && !P.myResp.editKey && r.name){ P.myResp.name=r.name; store.set(key,P.myResp); } }
    else { const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/responses`,body,headers());
      if(ME.user) P.myResp={id:r.id,account:true}; else { P.myResp={id:r.id,editKey:r.editKey,name:r.name}; store.set(key,P.myResp); } nameHint(); }
    if(!ME.user){ store.set('myName',P.mine.name); if(body.email) store.set('myEmail',body.email); }
    ok=true; msg = em&&!body.email ? 'Saved, but that email doesn’t look right' : 'Saved ✓';
    toast(had?t('Answer updated'):t('Answer sent')); refreshResults();
  }catch(e){
    P.dirty=true;
    if(e.status===404 && P.myResp){ store.del(key); P.myResp=null; retry=true; }
    else if(e.status===409 && e.data && e.data.code==='name_taken'){ msg='Not sent'; nameHint(true); }
    else if(e.status===409 && e.data && e.data.code==='own_answer'){ P.myResp={id:e.data.responseId,account:true}; retry=true; } // answered on another device
    else msg=t('Not sent: {msg}',{msg:e.message});
  }
  P.saving=false;
  if(retry && !retried) return save(true);
  saveBar(P.dirty&&ok ? undefined : msg);
  if(ok) updateHelp();
  return ok;
}
// The help line under "Your answer" depends on whether an answer exists.
function updateHelp(){ const h=$('ansHelp'); if(h) h.innerHTML=ansHelp(); wireDel(); }
function ansHelp(){ return ansHelp1(); } // the how-to for painting is the ⓘ in the Days / Hours row
function ansHelp1(){
  if(ME.user) return `${t('Signed in as {email}: your answer follows you to every device.',{email:esc(ME.user.email)})} ${P.myResp?t('Change it any time, then press <b>Update</b>.'):t('Mark your availability, then press <b>Send</b>.')}`;
  return P.myResp?t('Saved. To change it later, open the poll here or enter the same name on any device, then press <b>Update</b>.')
    :t('Mark your availability, then press <b>Send</b>. <a href="#" data-opensignin>Sign in</a> to keep your answers in an account instead.');
}
// "Is that you?": shown when the typed name already belongs to someone in this poll.
function nameHint(force){
  const el=$('nameHint'); if(!el) return;
  if(ME.user){ el.innerHTML=''; return; } // signed in: names don't have to be unique
  const k=nameKey(P.mine.name), p=(P.data.participants||[]).find(x=>nameKey(x.name)===k);
  if(!k || P.myResp || (!p && !force)){ el.innerHTML=''; return; }
  const shown=p?p.name:P.mine.name.trim();
  el.innerHTML=`<div class="namehint">${t("“{name}” is already in this poll. If that's you, load your answer.",{name:esc(shown)})}<button type="button" class="btn sm" data-recall>${t("That's me")}</button><br><span class="muted">${t('Otherwise, pick a different name.')}</span></div>`;
}
async function recallMine(){
  try{
    const r=await api('POST',`/polls/${P.id}/instances/${inst().id}/recall`,{name:P.mine.name},headers());
    if(!r.responseId){ // known person, no answer yet this round: their new answer is linked to the same name
      P.mine.name=r.name; $('nameHint').innerHTML=`<div class="namehint">${t("Welcome back, {name}! Mark your availability below; it's saved under your name.",{name:esc(r.name)})}</div>`;
      const nm=$('name'); if(nm) nm.value=r.name; changed(); return; }
    P.myResp={id:r.responseId,editKey:null,name:r.name};
    const a=await api('GET',`/polls/${P.id}/responses/${r.responseId}`,null,headers());
    store.set(respKey(),P.myResp); P.dirty=false;
    P.mine={name:a.name,email:a.email||'',comment:a.comment,entries:cleanEntries(a.entries)}; qfReset(); qfRestore(a.fill);
    render(); toast(t('Your answer is loaded'));
  }catch(e){ P.myResp=null; toast(e.message); }
}
let refT=null;
function refreshResults(){ clearTimeout(refT); refT=setTimeout(async()=>{ try{ const d=await fetchPoll(); if(d.instance.id!==P.iid) return; P.data=d; pruneWho(); renderHeader(); renderSeries(); if(P.tab!=='mine'||P.hint) renderBody(); }catch(e){} },400); }

function wireDel(){
  const dm=$('delMine');
  if(dm) dm.onclick=async e=>{ e.preventDefault(); if(!confirm(t('Remove your answer from this poll?'))) return;
    try{ await api('DELETE',`/polls/${P.id}/responses/${P.myResp.id}`,null,headers()); }catch(err){}
    store.del(respKey()); P.myResp=null; qfReset(); P.mine={name:P.mine.name,email:P.mine.email,comment:'',entries:{}}; P.mineFor=null; await loadPoll(false); };
}

        :`<div class="notice warn withic">${ICON.lock}<span>${t('Closed · answers for {round} are final.',{round:esc(instLabel(i))})}</span></div>`}
      <div id="body"></div>
      ${editable()?`<div class="savebar wsfoot" id="savebar"><span class="sstat" id="status"></span>${ib('trash',t('Remove my answer'),'id="delMine"','ghost danger hide')}<button type="button" class="btn primary withic sendbtn" id="saveBtn"></button></div>`:''}
    </div></div>
    ${d.isAdmin?adminPanes():viewerPanes()}</main>${chatDock()}`;
  renderHeader(); renderSeries();
  const nm=$('name'); if(nm){ nm.value=P.mine.name||''; nm.oninput=e=>{ P.mine.name=e.target.value; nameHint(); changed(); }; nameHint(); }

}

// An ⓘ tip's bubble is nudged sideways (and flipped above if needed) so it stays inside the screen.
function fitTip(t){ const b=t&&t.querySelector('.tipb'); if(!b) return;
  b.style.removeProperty('--tx'); b.classList.remove('up');
  const r=b.getBoundingClientRect(), W=document.documentElement.clientWidth, H=window.innerHeight, m=8;
  let dx=0; if(r.right>W-m) dx=W-m-r.right; if(r.left+dx<m) dx=m-r.left;
  if(dx) b.style.setProperty('--tx',Math.round(dx)+'px');
  if(r.bottom>H-m&&t.getBoundingClientRect().top-r.height-6>m) b.classList.add('up'); }
document.addEventListener('mouseover',e=>{ const t=e.target.closest&&e.target.closest('.tip'); if(t&&!t.contains(e.relatedTarget)) fitTip(t); });
document.addEventListener('focusin',e=>{ const t=e.target.closest&&e.target.closest('.tip'); if(t) fitTip(t); });
// The ⋯ menu closes after a pick or a tap elsewhere; an ⓘ tip closes on a tap elsewhere.
document.addEventListener('pointerdown',e=>{ const m=$('moredd'); if(m&&m.open&&!m.contains(e.target)) m.open=false;
  const t=document.activeElement; if(t&&t.classList&&t.classList.contains('tip')&&!t.contains(e.target)) t.blur(); });
document.addEventListener('click',e=>{ const m=e.target.closest('#moredd .ddp button,.pmore .ddp button'); if(m) m.closest('details').open=false; },true);
document.addEventListener('pointerdown',e=>{ document.querySelectorAll('.pmore[open]').forEach(d=>{ if(!d.contains(e.target)) d.open=false; }); });
// Share button: the phone's own share sheet with the whole invite message (the link is inside the text,

  navigator.share({title:b.dataset.ntitle,text:b.dataset.nshare}).catch(()=>{}); });

function renderBody(){
  const b=$('body'); if(!b) return;
  // iOS Safari has no scroll anchoring: rebuilding the panel briefly shortens the page and Safari scrolls up
  // (often to the top). Hold the old height until the next frame and put the scroll position back.
  const y0=window.scrollY, h0=b.offsetHeight; if(h0) b.style.minHeight=h0+'px';
  try{ renderBodyInner(b); } finally {
    if(Math.abs(window.scrollY-y0)>1) window.scrollTo(0,y0);
    requestAnimationFrame(()=>{ b.style.minHeight=''; });
  }
}
function renderBodyInner(b){
  document.querySelectorAll('[data-tab]').forEach(x=>{ const on=x.dataset.tab===P.tab; x.classList.toggle('on',on); x.setAttribute('aria-selected',on); });
  const me=$('wsme'); if(me) me.classList.toggle('hide',P.tab!=='mine');
  // Only one of the two is rendered at a time, so the shared ids (whodd, pgrid, drafts …) stay unique.
  const mp=$('mplan');
  if(mp&&P.atab==='meetings'){ b.innerHTML=''; if(msub()==='plan') renderPlan(mp); else mp.innerHTML=''; }
  else { if(mp) mp.innerHTML=''; if(P.tab==='mine') renderMine(b); else renderGroup(b); }
  const dn=$('msubd'); if(dn){ dn.textContent=P.drafts.length; dn.hidden=!P.drafts.length; }
  saveBar();
}

// On touch screens the list must survive the keyboard closing (that blurs the field), and it opens above the field
// when the on-screen keyboard leaves no room below it.

    const below=bot-r.bottom-8, above=r.top-top-8, up=below<180&&above>below;
    box.classList.toggle('up',up); box.style.maxHeight=Math.max(120,Math.min(300,(up?above:below)-4))+'px'; };
  const close=()=>{ box.hidden=true; box.innerHTML=''; items=[]; cur=-1; inp.setAttribute('aria-expanded','false'); inp.removeAttribute('aria-activedescendant'); };
  // Touch: close on a tap outside the field and list instead of on blur. The listener removes itself once the field is gone.

    if(!box.hidden&&e.target!==inp&&!box.contains(e.target)){ live=false; close(); } };
  if(TOUCH){ document.addEventListener('pointerdown',outside); vv&&vv.addEventListener('resize',place); }
  const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
  const fmt=pr=>{ const street=[pr.street,pr.housenumber].filter(Boolean).join(' '), city=pr.city||pr.town||pr.village||pr.district||'';
    const name=pr.name||street||city||pr.country||'';
    return {name, sub:uniq([street,[pr.postcode,city].filter(Boolean).join(' '),pr.state,pr.country]).filter(x=>x!==name).join(', '),
      full:uniq([name,street,city,pr.country]).join(', ').slice(0,200)}; };

// Pending batch edit applied to the meetings (used for the live preview and by Update, so both agree).
// changed: id → fields changed ('loc','desc','when'); bad: ids that would run past midnight; ad: all-day ones an hour move skips.
function batchApply(ms,S,b){
  b=b||{}; let list=ms; const changed=new Map(), bad=new Set(), mark=(id,f)=>{ if(!changed.has(id)) changed.set(id,new Set()); changed.get(id).add(f); };
  const set=(key,field,v)=>{ list=list.map(m=>{ if(!S.has(m.id)||(m[field]||'')===v) return m; mark(m.id,key); return {...m,[field]:v}; }); };
  if(b.loc!==undefined) set('loc','location',String(b.loc).trim());
  if(b.desc!==undefined) set('desc','note',String(b.desc).trim());
  const u=b.u==='h'?'h':'d', raw=String(b.n??'').trim(), k=raw===''?0:+raw; let err='', ad=0;
  if(raw!==''&&(!Number.isInteger(k)||Math.abs(k)>(u==='h'?48:365))) err=u==='h'?t('Enter whole hours, up to ±48'):t('Enter whole days, up to ±365');
  else if(k) list=list.map(m=>{ if(!S.has(m.id)) return m; if(u==='h'&&m.allDay){ ad++; return m; }
    const o=shiftMeeting(m,k,u); if(!o){ bad.add(m.id); return m; } mark(m.id,'when'); return o; });
  return {list,changed,bad,err,ad};
}

// A meeting moved by n days or hours; null if it can't be (it would run past midnight).
function shiftMeeting(m,n,unit){
  let days=unit==='d'?n:0, o={...m};
  if(unit==='h'){ if(m.allDay) return m;
    let s=m.start+n, e=m.end+n; const off=Math.floor(s/24); s-=off*24; e-=off*24; if(e>24) return null;
    o.start=s; o.end=e; days=off; }
  if(!days) return o;
  if(m.repeat){ o.date=addDaysL(WEEK0,((wdOf(m.date)+days)%7+7)%7);
    o.repeat={...m.repeat, from:addDaysL(m.repeat.from,days), until:m.repeat.until?addDaysL(m.repeat.until,days):m.repeat.until}; }
  else { o.date=addDaysL(m.date,days); if(m.endDate) o.endDate=addDaysL(m.endDate,days); }
  return o;
}

function monthsOf(dates){ const g=[]; dates.forEach(k=>{ const ym=k.slice(0,7); let x=g[g.length-1]; if(!x||x.ym!==ym){ x={ym,days:[]}; g.push(x);} x.days.push(k); }); return g; }

function monthPager(dates){

  const pg=monthPager(dates), g=pg.groups[pg.mi];

// Whole days: paint with the chosen brush (click/tap, or drag across days). Painting a day that already has that colour clears it.
function wireDays(){
  const grid=$('dgrid'); if(!grid) return;
  let paint=null, touched=new Set(), last=null;
  const cellAt=(x,y)=>{ const el=document.elementFromPoint(x,y), d=el&&el.closest&&el.closest('.day[data-day]'); return d&&grid.contains(d)?d:null; };
  const dates=P.data.dates, cellOf=k=>grid.querySelector(`.day[data-day="${k}"]`);
  // A fast drag can jump over days, so a move fills every poll day between the previous day and this one.
  const span=el=>{ const a=dates.indexOf(last), b=dates.indexOf(el.dataset.day); last=el.dataset.day;
    if(a<0||b<0) return apply(el); const [lo,hi]=a<b?[a,b]:[b,a]; for(let i=lo;i<=hi;i++){ const c=cellOf(dates[i]); if(c) apply(c); } };
  const apply=el=>{ const k=el.dataset.day; if(touched.has(k)) return; touched.add(k);
    setEntry(k,paint==='x'?null:paint); const st=statusOf(P.mine.entries[k],k);
    el.classList.remove('y','i','m','part'); if(st.cls) el.classList.add(st.cls); };
  const end=()=>{ if(paint===null) return; paint=null; touched=new Set(); changed(); renderBody(); };
  gridGestures(grid,cellAt,{
    start:el=>{ const v=P.mine.entries[el.dataset.day]; paint=(P.brush!=='x'&&v===P.brush)?'x':P.brush; touched=new Set(); last=el.dataset.day; apply(el); },
    move:el=>{ if(paint!==null) span(el); },

}
function wireGrid(){
  const grid=$('grid'); if(!grid) return;
  let paint=null, touched=new Map();
  const cellAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.classList&&el.classList.contains('slot')&&el.dataset.k?el:null; };
  const stateOf=el=>['y','i','m'].find(s=>el.classList.contains('s'+s))||null;
  const apply=el=>{ const k=el.dataset.k, hr=+el.dataset.h; if(!touched.has(k)) touched.set(k,hourMap(P.mine.entries[k],k));
    const map=touched.get(k); if(paint==='x') map.delete(hr); else map.set(hr,paint);

  const end=()=>{ if(paint===null) return; paint=null; touched.forEach((map,k)=>setEntry(k,fromMap(map,k))); touched=new Map(); changed(); renderBody(); };
  gridGestures(grid,cellAt,{
    start:el=>{ paint=(P.brush!=='x'&&stateOf(el)===P.brush)?'x':P.brush; touched=new Map(); apply(el); },

// Hour grids: a mouse or pen drag paints straight away. On touch a swipe scrolls the page,
// a tap does one cell, and press-and-hold (then drag) paints a range. h.start may return false to skip the drag.
function gridGestures(grid,cellAt,h){
  let mode=null, timer=0, x0=0, y0=0, cell=null, pid=null;
  const off=()=>{ clearTimeout(timer); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',cancel); mode=null; grid.classList.remove('painting'); };
  const up=e=>{ if(e.pointerId!==pid) return; const m=mode; off(); if(m==='wait'){ if(h.start(cell)!==false) h.end(); } else if(m==='paint') h.end(); };
  const cancel=e=>{ if(e.pointerId!==pid) return; const m=mode; off(); if(m==='paint') h.cancel(); };
  grid.addEventListener('pointerdown',e=>{ if(mode) return; const el=cellAt(e.clientX,e.clientY); if(!el) return;
    pid=e.pointerId; window.addEventListener('pointerup',up); window.addEventListener('pointercancel',cancel);
    if(e.pointerType!=='touch'){ e.preventDefault(); mode='paint'; if(h.start(el)===false) off(); return; }
    mode='wait'; cell=el; x0=e.clientX; y0=e.clientY;
    timer=setTimeout(()=>{ if(mode!=='wait') return; mode='paint'; grid.classList.add('painting');

      if(h.start(cell)===false) off(); },320); });
  grid.addEventListener('pointermove',e=>{ if(e.pointerId!==pid) return;
    if(mode==='wait'){ if(Math.hypot(e.clientX-x0,e.clientY-y0)>8){ clearTimeout(timer); mode='scroll'; } return; }
    if(mode==='paint'){ const el=cellAt(e.clientX,e.clientY); if(el) h.move(el); } });
  grid.addEventListener('touchmove',e=>{ if(mode==='paint'&&e.cancelable) e.preventDefault(); },{passive:false});
  grid.addEventListener('contextmenu',e=>{ if(mode||e.target.closest('.slot')) e.preventDefault(); });
}

function others(){ return (P.data.responses||[]).filter(r=>!P.myResp||r.id!==P.myResp.id); }
function stats(k, rs=sel()){
  // cy = free per hour (available + if needed), ci = how many of those are only "if needed", cm = maybe.
  const H=hours(), cy=H.map(()=>0), ci=H.map(()=>0), cm=H.map(()=>0); let full=0,ifn=0,part=0,maybe=0,no=0;
  const list=rs.map(r=>{ const v=(r.entries||{})[k];
    const x=fromMap(hourMap(v,k),k); if(x==='y') full++; else if(x==='i') ifn++; else if(x==='m') maybe++; else if(x) part++; else no++;
    hourMap(v,k).forEach((s,h)=>{ const i=h-H[0]; if(i<0||i>=H.length) return; if(s==='y'||s==='i') cy[i]++; if(s==='i') ci[i]++; else if(s==='m') cm[i]++; });
    return {id:r.id,name:r.name||t('Someone'),v}; });
  // Best hours: the most people free, and among those the fewest who'd only come "if needed".
  const peak=Math.max(0,...cy), peakIfn=peak?Math.min(...H.map((h,i)=>cy[i]===peak?ci[i]:Infinity)):0;
  const bestHours=peak?H.filter((h,i)=>cy[i]===peak&&ci[i]===peakIfn):[];
  const peakMaybe=peak?Math.max(0,...H.map((h,i)=>cy[i]===peak&&ci[i]===peakIfn?cm[i]:0)):Math.max(0,...cm);
  return {full,ifn,part,maybe,no,cy,ci,cm,peak,peakIfn,peakMaybe,bestHours,window:hoursText(bestHours),list};
}

function bestBlock(s){ // longest contiguous run of best hours
  const H=s.bestHours; if(!H.length) return [hours()[0], hours()[0]+2];
  let best=[H[0],H[0]], cur=[H[0],H[0]];

  return `<${tg} class="sech">${ICON[icon]||''}<h3>${title}</h3>${count!=null?`<span class="count">${count}</span>`:''}${tp?tip(tp):''}${extra?`<span class="ml-auto"></span><span class="sech-a">${extra}</span>`:''}</${tg}>`;
}
// The organiser's way into scheduling from the Group view: add a draft for that day (picked hours or the best block) and open Schedule.
function scheduleDay(k){
  const slotsOn=P.data.poll.answerMode!=='days', r=P.range&&P.range.date===k?[P.range.start,P.range.end]:null;
  if(!P.drafts.some(x=>x.date===k&&(x.allDay||(r&&x.start===r[0]&&x.end===r[1])))){
    if(!slotsOn) addDraft(k,true,null,null);
    else { const [st,en]=r||bestBlock(stats(k)); addDraft(k,false,st,Math.min(en,24)); } }
  P.range=null; planShow(k); setMsub('plan',false);
  if(P.atab==='meetings') renderBody(); else setPollTab('meetings');
  toast(t('Draft added. Set the details, then create the meeting.'));
  const tr=$('drafts'); if(tr) tr.closest('.pstep').scrollIntoView({block:'start'});
}

  if(!d.responses){ el.innerHTML=`<p class="help">${t('The organiser has chosen to keep answers private.')}</p>`; return; }
  const all=d.responses.length, tot=sel().length, H=hours(), S={}; d.dates.forEach(k=>S[k]=stats(k));

  let h=`<div class="asec">${vrow(tip(d.isAdmin?t('Each day shows how many are free at the best time (+ how many said “maybe”). Tap a day for details and to schedule a meeting.'):t('Each day shows how many are free at the best time (+ how many said “maybe”). Tap a day for details.')),whoDropdown())}`;

  h+=legend('heat',d.dates.some(k=>S[k].peak===tot)?'allfree':'','ifn','maybe','line',d.isAdmin||meetingDays().size?'meeting':'');
  if(P.ovDay && S[P.ovDay]){
    const s=S[P.ovDay], pick=d.isAdmin&&slotsOn, sr=pickRange(), rg=sr?`${hh(sr[0])}–${hh(sr[1])}`:'';

    h+=`<div class="dpanel">
      <div class="row"><div class="grow"><h3>${esc(dLabel(P.ovDay))}</h3>
        <div class="schips">${[['y','✓',s.full,t('whole day')],['i','◔',s.ifn,t('if needed')],['p','◐',s.part,t('certain hours')],['m','?',s.maybe,t('maybe')],['n','✕',s.no,t('can’t')]].filter(x=>x[2]||x[0]==='y').map(([c,ic,v,lb])=>`<span class="sc-${c}" title="${v} ${lb}">${ic} ${v}</span>`).join('')}${s.peak&&slotsOn?`<span class="sc-b" title="${t('Best hours')}">${ICON.clock}${esc(s.window)}</span>`:''}</div></div>
        ${d.isAdmin?`${sr?ib('x',t('Clear time'),'data-clearrange','sm ghost'):''}<button class="btn sm primary" data-schedule="${P.ovDay}" aria-label="${t('Schedule')}${sr?` ${esc(rg)}`:''}"><span>★<span class="${sr?'bl':''}"> ${t('Schedule')}</span>${sr?` ${esc(rg)}`:''}</span></button>`:''}
        ${chatRefBtn('d:'+P.ovDay)}${ib('x',t('Close'),`data-ov="${P.ovDay}"`,'sm ghost')}</div>
      ${slotsOn?`${pick?`<div class="bartip">${tip(t('Drag across the bars to pick the meeting time.'),'right')}</div>`:''}<div class="bars${pick?' pick':''}" id="ovbars">${s.cy.map((c,i)=>{ const m=s.cm[i], f=s.ci[i]; return `<div class="stack${inR(H[i])?' in':''}" data-bh="${H[i]}" title="${hh(H[i])} · ${esc(freeTip(c,f,m,tot))}"><div class="bar${s.peak&&c===s.peak&&f===s.peakIfn?' best':''}" style="height:${tot?(c-f)/tot*100:0}%"></div>${f?`<div class="bar ibar" style="height:${f/tot*100}%"></div>`:''}<div class="bar mbar" style="height:${tot?m/tot*100:0}%"></div></div>`; }).join('')}</div>
      <div class="barl">${H.map(x=>`<span${inR(x)?' class="in"':''}>${x}</span>`).join('')}</div>${legend('yes','best','ifn','maybe')}`:''}
      <div class="people">${s.list.map(x=>{ const st=statusOf(x.v,P.ovDay); return `<div class="p"><div class="pr"><span>${esc(x.name)}</span><span class="st" style="color:${st.c}">${esc(st.t||t('Not available'))}</span></div>${st.cls==='part'?ratioBar(x.v,P.ovDay):''}</div>`; }).join('')}</div></div>`;
  }

  h+=`<div class="asec">${secH('star',t('Best days'))}<ul class="list best">${ranked.map(o=>bestLi(o.s,tot,
      `${md.has(o.k)?'<span class="acc">★</span> ':''}${esc(dLabel(o.k))}`,
      `${o.s.full+o.s.ifn===o.s.peak||!slotsOn?t('all day'):esc(o.s.window)}${o.s.peakIfn?` · ${t('{n} if needed',{n:o.s.peakIfn})}`:''}${o.s.peakMaybe?` · ${t('+{n} maybe',{n:o.s.peakMaybe})}`:''}`,
      `data-ov="${o.k}"`, d.isAdmin?ib('star',t('Schedule'),`data-schedule="${o.k}"`,'sm'):'')).join('')||`<li class="muted">${t('Nobody has marked a day as available yet.')}</li>`}</ul></div>`;
  const withC=sel().filter(r=>r.comment);
  if(withC.length) h+=`<details class="asec comments"${P.cOpen?' open':''} data-keep="cOpen">${secH('chat',t('Comments'),{count:withC.length,summary:true})}${withC.map(r=>`<div class="c"><b>${esc(r.name)}:</b> ${esc(r.comment)}</div>`).join('')}</details>`;

  el.innerHTML=h;
